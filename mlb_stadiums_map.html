    return best ? { stadium: best, marker: bestMarker } : null;
  }

  let hoveredStadiumName = null;
  // The specific marker instance that was actually hit for the current
  // hover/pin — as opposed to looking it back up via markerByName[name],
  // which during the year-slider story can't disambiguate which of a
  // shared stadium's two team markers the cursor is really over (see
  // findHoveredStadium). Used anywhere the overlay needs to anchor to (or
  // re-anchor after a pan/zoom to) the exact marker that's live right now.
  let hoveredMarkerRef = null;
  let pinnedMarkerRef = null;
  const mapContainerEl = map.getContainer();

  // Hover preview only makes sense for an input that can genuinely hover
  // (a real mouse or trackpad) — not a finger tap, which has no hover
  // state at all and would otherwise flash the condensed preview open
  // right as (or just after) the tap's click pins the full overlay open.
  //
  // Checked per-event via the Pointer Events API's pointerType, rather
  // than once via the CSS (hover: hover)/(pointer: fine) media features —
  // those are unreliable on iPadOS specifically: a connected Bluetooth
  // trackpad doesn't consistently flip them to true the way a laptop's
  // built-in trackpad does. pointerType is the signal that actually holds
  // up across cases: 'mouse' for both a real desktop mouse AND an iPad's
  // trackpad-driven cursor, 'touch' for a finger, 'pen' for Apple Pencil.
  // Using pointermove/pointerleave (instead of mousemove/mouseleave) with
  // this per-event check means: a finger tap never triggers hover at all
  // (goes straight through the click handler below to the full pinned
  // overlay), while moving an iPad's trackpad cursor gets the exact same
  // hover-then-click behavior as a laptop, with no separate device
  // detection needed.
  // True if the cursor is either directly over the condensed preview's own
  // DOM box, or inside the invisible hoverBridge corridor connecting it to
  // its marker (see computeHoverBridge) — the two places a mouse can be
  // while genuinely on its way from one to the other without having
  // "left" the hoverable area.
  function isInHoverLeewayZone(clientX, clientY) {
    const rect = overlayEl.getBoundingClientRect();
    if (overlayEl.style.display !== 'none' &&
        clientX >= rect.left && clientX <= rect.right &&
        clientY >= rect.top && clientY <= rect.bottom) {
      return true;
    }
    if (hoverBridge) {
      const mapRect = mapContainerEl.getBoundingClientRect();
      const x = clientX - mapRect.left, y = clientY - mapRect.top;
      if (x >= hoverBridge.left && x <= hoverBridge.right &&
          y >= hoverBridge.top && y <= hoverBridge.bottom) {
        return true;
      }
    }
    return false;
  }

  mapContainerEl.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    // Checked FIRST, before even looking for a new marker under the
    // cursor: if a condensed preview is up and the cursor is still inside
    // its leeway zone (its own panel, or the bridge corridor to its
    // marker), stay locked onto it — full stop — even if some OTHER
    // marker's hit-circle also geometrically covers that exact point. A
    // marker sitting visually behind the hovered one (partially obscured
    // by it, e.g. the demolished former Busch Stadium marker sitting
    // right behind — and partly under — the current Busch Stadium
    // marker) can end up positioned right in that gap; without this check
    // running first, passing through its hit-circle on the way to the
    // panel would hijack the hover mid-transit. Deliberately no attempt
    // to distinguish "just passing through" from "actually wants to
    // hover that other marker now" — the leeway zone is narrow, and this
    // is simpler and more predictable than z-order tricks.
    if (hoveredStadiumName && !pinnedStadiumName && isInHoverLeewayZone(e.clientX, e.clientY)) {
      return;
    }
    const hit = findHoveredStadium(e.clientX, e.clientY);
    if (hit) {
      if (hit.stadium.name === hoveredStadiumName && hit.marker === hoveredMarkerRef) return;
      hoveredStadiumName = hit.stadium.name;
      hoveredMarkerRef = hit.marker;
      debouncedShowOverlay(hit.stadium, hit.marker);
      return;
    }
    if (hoveredStadiumName) {
      hoveredStadiumName = null;
      hoveredMarkerRef = null;
      debouncedHideOverlay();
    }
  });
  mapContainerEl.addEventListener('pointerleave', (e) => {
    if (e.pointerType !== 'mouse') return;
    if (hoveredStadiumName) {
      hoveredStadiumName = null;
      hoveredMarkerRef = null;
      debouncedHideOverlay();
    }
  });
  mapContainerEl.addEventListener('click', (e) => {
    // Let Leaflet's own controls (zoom buttons, reset view) work normally.
    if (e.target.closest('.leaflet-control-container')) return;
    const hit = findHoveredStadium(e.clientX, e.clientY);
    if (hit) {
      // Always goes straight to the full pinned overlay — on a hover-
      // capable device this replaces whatever condensed preview was
      // already showing; on touch, this is the ONLY overlay a tap ever
      // shows, since the mousemove handler above is a no-op there.
      pinnedStadiumName = hit.stadium.name;
      pinnedMarkerRef = hit.marker;
      showOverlay(hit.stadium, hit.marker, true);
    } else if (pinnedStadiumName) {
      // Clicks on the overlay itself never reach here (it stops
      // propagation), so any other click on the map — empty water, land,
      // another part of the basemap — means "outside the overlay": close it.
      dismissPinned();
    }
  });

  // --- Combined filtering: a stadium is shown when its category checkbox is
  // on AND (no people filter is active, or at least one checked person was
  // there) AND (no ratings filter is active, or its rating is checked).
  // Each "Show all" is a bulk toggle for its section and reflects the
  // section's aggregate state (checked / unchecked / indeterminate).
  const PEOPLE = ["jessie", "andrew", "fender", "howard", "jim", "rob", "kim", "serena", "heather"];
  const RATINGS = [5, 4, 3, 2, 1];

  // Show a live "(count)" next to each People/Ratings filter item — the
  // number of stadiums that match — computed straight from the data so it
  // always stays accurate.
  PEOPLE.forEach(p => {
    const count = stadiums.filter(s => s.people && s.people.includes(p)).length;
    const el = document.querySelector(`.filter-count[data-person="${p}"]`);
    if (el) el.textContent = `(${count})`;
  });
  RATINGS.forEach(r => {
    const count = stadiums.filter(s => s.rating === r).length;
    const el = document.querySelector(`.filter-count[data-rating="${r}"]`);
    if (el) el.textContent = `(${count})`;
  });

  // --- Two-mode filter panel ---
  // "All MLB Stadiums" groups the 7 underlying data categories into 4 pure
  // existence-based buckets (Current / Former-standing / Former-demolished
  // / Future) with no personal-visit distinction. "Stadiums I've Visited"
  // shows only stadiums with gamesAttended set, filtered by the existing
  // People/Ratings controls. uiGroupOf() is the one place that maps the
  // real s.category values to this UI grouping — everything else that
  // reads s.category directly (marker colors, the overlay panel, etc.) is
  // untouched.
  function uiGroupOf(s) {
    if (s.category === 'current_visited' || s.category === 'current_not_visited') return 'current';
    if (s.category === 'future_planned') return 'future';
    if (s.category === 'former_exists' || s.category === 'historic_not_visited') return 'former-standing';
    if (s.category === 'former_demolished' || s.category === 'historic_demolished') return 'former-demolished';
    return null;
  }

  const cbCurrent = document.getElementById('cb-current');
  const cbFormer = document.getElementById('cb-former');
  const cbFormerStanding = document.getElementById('cb-former-standing');
  const cbFormerDemolished = document.getElementById('cb-former-demolished');
  const cbFuture = document.getElementById('cb-future');
  const peopleAllCb = document.getElementById('cb-people-all');
  const personCheckboxes = {};
  PEOPLE.forEach(p => { personCheckboxes[p] = document.getElementById('cb-person-' + p); });

  const ratingsAllCb = document.getElementById('cb-ratings-all');
  const ratingCheckboxes = {};
  RATINGS.forEach(r => { ratingCheckboxes[r] = document.getElementById('cb-rating-' + r); });

  // Live counts next to each "All MLB Stadiums" row and each mode tab.
  const groupCounts = { current: 0, 'former-standing': 0, 'former-demolished': 0, future: 0 };
  stadiums.forEach(s => { const g = uiGroupOf(s); if (g) groupCounts[g]++; });
  document.getElementById('count-current').textContent = `(${groupCounts.current})`;
  document.getElementById('count-former').textContent = `(${groupCounts['former-standing'] + groupCounts['former-demolished']})`;
  document.getElementById('count-former-standing').textContent = `(${groupCounts['former-standing']})`;
  document.getElementById('count-former-demolished').textContent = `(${groupCounts['former-demolished']})`;
  document.getElementById('count-future').textContent = `(${groupCounts.future})`;
  document.getElementById('mode-count-all').textContent = `${stadiums.length} total`;
  document.getElementById('mode-count-visited').textContent = `${stadiums.filter(s => s.gamesAttended != null).length} total`;

  // "Show" scope within the Visited tab: All / Current / Former — counts
  // are of actually-visited stadiums only (gamesAttended != null), same
  // convention as mode-count-visited above; the always-shown-dimmed
  // not-yet-visited current stadiums aren't counted as "visited" here.
  // isCurrentCategory is defined further down (function declarations
  // hoist, so it's already callable up here).
  const visitedCountList = stadiums.filter(s => s.gamesAttended != null);
  document.getElementById('count-scope-all').textContent = `(${visitedCountList.length})`;
  document.getElementById('count-scope-current').textContent = `(${visitedCountList.filter(isCurrentCategory).length})`;
  document.getElementById('count-scope-former').textContent = `(${visitedCountList.filter(s => !isCurrentCategory(s)).length})`;

  // activeMode itself is declared earlier (see its own comment there),
  // since updateGrowingMarkerSizes needs it well before this point.
  // 'all' | 'current' | 'former' — which stadiums the Visited tab shows,
  // independent of and applied on top of the People/Ratings filters.
  let visitedScope = 'all';
  const scopeRadios = {
    all: document.getElementById('cb-scope-all'),
    current: document.getElementById('cb-scope-current'),
    former: document.getElementById('cb-scope-former')
  };
  Object.keys(scopeRadios).forEach(key => {
    scopeRadios[key].addEventListener('change', () => {
      if (scopeRadios[key].checked) { visitedScope = key; updateVisibility(); }
    });
  });

  function updateVisibility() {
    if (yearStoryModeActive) {
      // Also all-or-nothing, like road-trip mode: every other filter is
      // irrelevant while scrubbing years. Every normal per-stadium marker
      // stays hidden for the story's whole duration — what's shown instead
      // is the dynamic set of per-TEAM markers for yearStoryYear (see
      // renderYearStoryMarkersForYear, which also calls resolveOverlaps
      // itself once the right markers are shown/hidden).
      stadiums.forEach(s => { map.removeLayer(markerByName[s.name]); });
      renderYearStoryMarkersForYear(yearStoryYear);
      return;
    }
    if (journeyModeActive) {
      // Also all-or-nothing, like the year story — but cumulative, not
      // point-in-time: every visited stadium whose firstVisited is on or
      // before journeyYear stays shown, not just the ones from that exact
      // year. Plain per-stadium markers (see startJourney, which already
      // swapped every non-current one to its full-color logo styling) —
      // no team-splitting complexity here, since each of these is Marco's
      // own single visit record for that one building.
      stadiums.forEach(s => { map.removeLayer(markerByName[s.name]); });
      VISITED_STADIUMS.forEach(s => {
        if (s.firstVisited <= journeyYear) markerByName[s.name].addTo(map);
      });
      resolveOverlaps();
      return;
    }
    if (roadTripModeActive) {
      // All-or-nothing mode: mode/category/people/rating filters are
      // irrelevant while the 2007 Road Trip layer is on — only its fixed
      // stadium list is shown, everything else is hidden.
      stadiums.forEach(s => {
        const marker = markerByName[s.name];
        if (activeRoadTripStadiumNames.has(s.name)) { marker.addTo(map); } else { map.removeLayer(marker); }
      });
      // Whichever stadiums are now on/off the map changes who's eligible
      // to collide, so re-settle nudged positions (see resolveOverlaps).
      resolveOverlaps();
      return;
    }

    if (activeMode === 'all') {
      stadiums.forEach(s => {
        const marker = markerByName[s.name];
        const g = uiGroupOf(s);
        let show = false;
        if (g === 'current') show = cbCurrent.checked;
        else if (g === 'former-standing') show = cbFormerStanding.checked;
        else if (g === 'former-demolished') show = cbFormerDemolished.checked;
        else if (g === 'future') show = cbFuture.checked;
        if (show) { marker.addTo(map); } else { map.removeLayer(marker); }
      });
    } else {
      // 'visited' mode: stadiums with gamesAttended set are eligible,
      // narrowed further by People/Ratings exactly like the old
      // category-based filter used to narrow current/former stadiums, AND
      // by the "Show: All/Current/Former" scope radios (visitedScope) —
      // 'current' keeps only current-category stadiums, 'former' keeps
      // only former/historic ones, 'all' applies no extra restriction.
      // Current stadiums I haven't been to yet are ALSO shown (not
      // hidden) when scope allows current stadiums at all, so this tab
      // still reads as "every current stadium, mine highlighted." They
      // render at reduced opacity via updateGrowingMarkerSizes'
      // unvisitedDim, keyed off the same activeMode this function reads.
      // But they only make sense while People/Ratings are both at their
      // unfiltered "show everyone/everything" state — a not-yet-visited
      // stadium has no people or rating of its own to match against, so
      // as soon as either filter narrows the view, it drops out too
      // (rather than staying on regardless, which read as broken/stuck).
      const selectedPeople = new Set(PEOPLE.filter(p => personCheckboxes[p].checked));
      const peopleFilterActive = selectedPeople.size < PEOPLE.length;
      const selectedRatings = new Set(RATINGS.filter(r => ratingCheckboxes[r].checked));
      const ratingsFilterActive = selectedRatings.size < RATINGS.length;
      stadiums.forEach(s => {
        const marker = markerByName[s.name];
        let show = false;
        const isCurrentCat = isCurrentCategory(s);
        const scopeOk = visitedScope === 'all' ||
          (visitedScope === 'current' && isCurrentCat) ||
          (visitedScope === 'former' && !isCurrentCat);
        if (scopeOk) {
          if (s.gamesAttended != null) {
            const peopleOk = !peopleFilterActive || (s.people && s.people.some(p => selectedPeople.has(p)));
            const ratingOk = !ratingsFilterActive || (s.rating != null && selectedRatings.has(s.rating));
            show = peopleOk && ratingOk;
          } else if (s.category === 'current_not_visited') {
            show = !peopleFilterActive && !ratingsFilterActive;
          }
        }
        if (show) { marker.addTo(map); } else { map.removeLayer(marker); }
      });
    }
    // Whichever stadiums are now on/off the map changes who's eligible to
    // collide, so re-settle nudged positions (see resolveOverlaps) — e.g.
    // a former stadium nudged aside by a current one snaps back to its
    // exact spot once that current stadium's layer is filtered off.
    resolveOverlaps();
  }

  function updateShowAllState() {
    const checkedCount = PEOPLE.filter(p => personCheckboxes[p].checked).length;
    peopleAllCb.checked = checkedCount === PEOPLE.length;
    peopleAllCb.indeterminate = checkedCount > 0 && checkedCount < PEOPLE.length;
  }

  function updateRatingsAllState() {
    const checkedCount = RATINGS.filter(r => ratingCheckboxes[r].checked).length;
    ratingsAllCb.checked = checkedCount === RATINGS.length;
    ratingsAllCb.indeterminate = checkedCount > 0 && checkedCount < RATINGS.length;
  }

  // "Former" parent <-> "Still standing"/"Demolished" children, tri-state,
  // same indeterminate-checkbox pattern as the People/Ratings "Show all"
  // rows above.
  function updateFormerParentState() {
    const checkedCount = [cbFormerStanding.checked, cbFormerDemolished.checked].filter(Boolean).length;
    cbFormer.checked = checkedCount === 2;
    cbFormer.indeterminate = checkedCount === 1;
  }

  // Recomputes the green star badge's visibility (see starsVisible's
  // declaration up near roadTripModeActive) from the current mode + road
  // trip/journey state, then regenerates every logo marker's icon via
  // updateGrowingMarkerSizes so the change is immediately visible. Never on
  // during the year-slider story — a personal rating/visit star doesn't
  // belong on a plain "was this stadium open in year X" existence view.
  // Forced ON during the journey story regardless of whatever activeMode
  // was left at before it started — a personal 5-star rating is exactly
  // what belongs on "my journey through the stadiums I've visited."
  function updateStarsVisible() {
    starsVisible = (activeMode === 'visited' || roadTripModeActive || journeyModeActive) && !yearStoryModeActive;
    updateGrowingMarkerSizes();
  }

  function setMode(mode) {
    activeMode = mode;
    document.getElementById('mode-btn-all').classList.toggle('active', mode === 'all');
    document.getElementById('mode-btn-visited').classList.toggle('active', mode === 'visited');
    document.getElementById('mode-body-all').style.display = mode === 'all' ? '' : 'none';
    document.getElementById('mode-body-visited').style.display = mode === 'visited' ? '' : 'none';
    updateStarsVisible();
  }
  document.getElementById('mode-btn-all').addEventListener('click', () => { setMode('all'); updateVisibility(); });
  document.getElementById('mode-btn-visited').addEventListener('click', () => { setMode('visited'); updateVisibility(); });

  cbCurrent.addEventListener('change', updateVisibility);
  cbFuture.addEventListener('change', updateVisibility);
  cbFormer.addEventListener('change', () => {
    const checked = cbFormer.checked;
    cbFormerStanding.checked = checked;
    cbFormerDemolished.checked = checked;
    cbFormer.indeterminate = false;
    updateVisibility();
  });
  cbFormerStanding.addEventListener('change', () => { updateFormerParentState(); updateVisibility(); });
  cbFormerDemolished.addEventListener('change', () => { updateFormerParentState(); updateVisibility(); });

  PEOPLE.forEach(p => {
    personCheckboxes[p].addEventListener('change', () => {
      updateShowAllState();
      updateVisibility();
    });
  });

  peopleAllCb.addEventListener('change', () => {
    const checked = peopleAllCb.checked;
    PEOPLE.forEach(p => { personCheckboxes[p].checked = checked; });
    peopleAllCb.indeterminate = false;
    updateVisibility();
  });

  RATINGS.forEach(r => {
    ratingCheckboxes[r].addEventListener('change', () => {
      updateRatingsAllState();
      updateVisibility();
    });
  });

  ratingsAllCb.addEventListener('change', () => {
    const checked = ratingsAllCb.checked;
    RATINGS.forEach(r => { ratingCheckboxes[r].checked = checked; });
    ratingsAllCb.indeterminate = false;
    updateVisibility();
  });

  // Sync initial visibility with the checkbox states above.
  updateVisibility();

  // Streets & highways basemap toggle — swaps the clean, label-free tile
  // layer for CARTO Voyager (roads, highways, place labels), off by default.
  // Never-visited historic dots (both still-standing and demolished) never
  // get the white center dot — that now signals "visited," not
  // "demolished" — so both stay plain dotIcon markers here, just with
  // different fill colors for standing vs demolished. This is currently a
  // visual no-op either way (VOYAGER_COLOR === DEFAULT_COLOR for both), but
  // kept structured for symmetry/future use rather than deleted outright.
  const HISTORIC_STANDING_DEFAULT_COLOR = STYLES.historic_not_visited.color;
  const HISTORIC_STANDING_VOYAGER_COLOR = HISTORIC_STANDING_DEFAULT_COLOR;
  const HISTORIC_DEMOLISHED_DEFAULT_COLOR = STYLES.historic_demolished.color;
  const HISTORIC_DEMOLISHED_VOYAGER_COLOR = HISTORIC_DEMOLISHED_DEFAULT_COLOR;
  document.getElementById('cb-basemap-voyager').addEventListener('change', (e) => {
    const standingColor = e.target.checked ? HISTORIC_STANDING_VOYAGER_COLOR : HISTORIC_STANDING_DEFAULT_COLOR;
    const demolishedColor = e.target.checked ? HISTORIC_DEMOLISHED_VOYAGER_COLOR : HISTORIC_DEMOLISHED_DEFAULT_COLOR;
    markersByCategory.historic_not_visited.forEach(marker => {
      marker.setIcon(dotIcon(standingColor, standingColor, 1.5, MARKER_RADIUS));
    });
    markersByCategory.historic_demolished.forEach(marker => {
      marker.setIcon(dotIcon(demolishedColor, demolishedColor, 1.5, MARKER_RADIUS));
    });
    // These specific swatch ids no longer exist in the two-mode filter
    // panel (the "Still standing"/"Demolished" swatches under Former now
    // represent a merged visited+never-visited group, not this color
    // specifically) — guarded so this stays a harmless no-op rather than
    // throwing.
    const swatchStanding = document.getElementById('swatch-historic_not_visited');
    if (swatchStanding) swatchStanding.style.background = standingColor;
    const swatchDemolished = document.getElementById('swatch-historic_demolished');
    if (swatchDemolished) swatchDemolished.style.background = demolishedColor;
    if (e.target.checked) {
      map.removeLayer(lightBaseLayer);
      voyagerBaseLayer.addTo(map);
      // Voyager already labels states/provinces itself, so our own
      // state-name labels would just duplicate them — stay hidden here too.
      map.getPane('pane-state-labels').style.display = 'none';
    } else {
      map.removeLayer(voyagerBaseLayer);
      lightBaseLayer.addTo(map);
      // Plain label-free basemap and no state names either — checking
      // "Street and place names" back on (Voyager) is how those come back.
      map.getPane('pane-state-labels').style.display = 'none';
    }
  });

  // --- Road trips: all-or-nothing mode ---
  // Turning any one trip on replaces every other filter selection with a
  // fixed view (that trip's route + its specific stadium list) and screens
  // the rest of the filters menu behind an opaque scrim so nothing else can
  // be toggled while a trip is active. The only interactions still allowed
  // in the filters menu are picking a different trip (switches instantly,
  // no need to deselect first) or unchecking the active trip, which
  // restores exactly the filter selections that were in place beforehand.
  const filtersScrimEl = document.getElementById('filters-scrim');
  const voyagerCb = document.getElementById('cb-basemap-voyager');
  let savedFilterState = null;
  // Which "story" (a road trip id, or 'story-years') is currently active,
  // if any — shared across every entry in the Stories menu so only one can
  // ever be active at a time, the same all-or-nothing behavior the road
  // trips always had, now generalized to cover the year-slider story too.
  let activeStoryId = null;

  function snapshotFilterState() {
    return {
      mode: activeMode,
      current: cbCurrent.checked,
      formerStanding: cbFormerStanding.checked,
      formerDemolished: cbFormerDemolished.checked,
      future: cbFuture.checked,
      visitedScope: visitedScope,
      people: PEOPLE.reduce((acc, p) => { acc[p] = personCheckboxes[p].checked; return acc; }, {}),
      ratings: RATINGS.reduce((acc, r) => { acc[r] = ratingCheckboxes[r].checked; return acc; }, {}),
      voyager: voyagerCb.checked,
    };
  }

  function restoreFilterState(state) {
    setMode(state.mode);
    cbCurrent.checked = state.current;
    cbFormerStanding.checked = state.formerStanding;
    cbFormerDemolished.checked = state.formerDemolished;
    cbFuture.checked = state.future;
    updateFormerParentState();
    visitedScope = state.visitedScope || 'all';
    scopeRadios[visitedScope].checked = true;
    PEOPLE.forEach(p => { personCheckboxes[p].checked = state.people[p]; });
    RATINGS.forEach(r => { ratingCheckboxes[r].checked = state.ratings[r]; });
    updateShowAllState();
    updateRatingsAllState();
    if (voyagerCb.checked !== state.voyager) {
      voyagerCb.checked = state.voyager;
      voyagerCb.dispatchEvent(new Event('change'));
    }
  }

  // Shows a trip's route + stadiums and applies its logo overrides.
  // updateVisibility() must run BEFORE the overrides: it operates on
  // whatever markerByName currently points to (the originals), and the
  // overrides then swap those pointers to temporary logo markers.
  // Bumped on every activate/deactivate so any pending moveend listener,
  // setTimeout, or in-flight rAF loop from a superseded trip can recognize
  // it's stale and bail out instead of drawing on top of whatever trip is
  // active now.
  // --- Road trip playback: a persisted-position "player" (distKm along the
  // route, 0..trip.lengthKm) drives both the progressive polyline draw and
  // each stop's pop-in reveal — replacing the old one-shot, elapsed-time-only
  // animation with something the transport buttons can pause, resume, and
  // jump around in (skip to start, step to the previous/next stop) without
  // losing track of where it was. Distance, not elapsed time, is a player's
  // single source of truth; elapsed time only advances it while actually
  // playing (see tripPlayLoopFrame below). Only one road trip is ever
  // active at once, so currentTripPlayer is the one live player, same as
  // roadTripAnimationToken guards only the one in-flight activateTrip call.
  let roadTripAnimationToken = 0; // still guards activateTrip's camera-settle handoff below
  let currentTripPlayer = null;
  const TRIP_STOP_PAUSE_MS = 900; // hold at each newly-revealed stop before continuing — matches the .stadium-pop-svg animation's total length so the pop finishes settling before the route resumes drawing

  const tripBarEl = document.getElementById('trip-bar');
  const tripSliderEl = document.getElementById('trip-slider');
  const tripLabelEl = document.getElementById('trip-title-text');
  const tripMarkerThumbEl = document.getElementById('trip-marker-thumb');
  const tripPlayBtn = document.getElementById('trip-play');
  const tripPlayIconEl = tripPlayBtn.querySelector('.btn-icon');

  function makeTripPlayer(trip) {
    return { trip, distKm: 0, playing: false, revealed: new Set(), rafId: null, pauseUntil: null, lastFrameTime: null };
  }

  // Makes a stop's marker visible (creating the temporary logo-override
  // marker if this stop needs one, or just re-adding the normal marker
  // activateTrip hid), pops it in with the stadiumPop animation, and re-runs
  // the same collision-avoidance pass the base map uses so a freshly-popped
  // marker doesn't land stacked on top of one already shown.
  function revealStop(trip, name) {
    if (trip.logoOverrideNames.has(name)) {
      applyLogoOverride(name);
    } else {
      const marker = markerByName[name];
      if (marker && !map.hasLayer(marker)) marker.addTo(map);
    }
    // popStadiumIcon itself bumps this stop to the top of the z-order (see
    // storyPopZIndexByName there) as well as playing the pop animation.
    popStadiumIcon(name);
    resolveOverlaps();
  }

  // The un-reveal counterpart a persisted-position player needs that the
  // old forward-only animation never did — stepping backward has to be
  // able to hide a stop exactly as cleanly as stepping forward pops it in.
  function hideStop(trip, name) {
    if (trip.logoOverrideNames.has(name)) {
      revertLogoOverride(name);
    } else {
      const marker = markerByName[name];
      if (marker && map.hasLayer(marker)) map.removeLayer(marker);
    }
  }

  // Renders a player's current distKm: how much of the polyline is drawn,
  // and which stops are revealed vs. still hidden — reconciled in both
  // directions, so this is equally correct whether distKm just increased
  // (playing forward) or decreased (stepped/skipped backward).
  //
  // trip.deferredNames (2002's Fenway Park, 2007/2006's T-Mobile Park)
  // covers the trips that start and end at the same home stadium: rather
  // than reveal it at the very first stop (indistinguishable from just
  // always being visible), it stays hidden through every earlier
  // occurrence and only reveals at its last one — the "arriving home"
  // moment.
  function syncTripVisual(player) {
    const trip = player.trip;
    if (!map.hasLayer(trip.layer)) trip.layer.addTo(map);
    const total = trip.coords.length;
    const cumKm = trip.cumKm;
    let i = 1;
    while (i < total && cumKm[i] <= player.distKm) i++;
    trip.layer.setLatLngs(trip.coords.slice(0, i));
    const deferred = trip.deferredNames || new Set();
    const lastStopIdxForName = {};
    trip.stops.forEach((s, idx) => { if (deferred.has(s.name)) lastStopIdxForName[s.name] = idx; });
    // Tracks the visible stop furthest along the route (highest s.idx) —
    // the "current" stop for the marker thumbnail below — rather than
    // whichever happens to be last in trip.stops' own array order.
    let currentStopName = null;
    let currentStopIdx = -1;
    trip.stops.forEach((s, idx) => {
      const isRevealMoment = !deferred.has(s.name) || idx === lastStopIdxForName[s.name];
      const shouldBeVisible = isRevealMoment && s.idx <= i - 1;
      const isVisible = player.revealed.has(s.name);
      if (shouldBeVisible && !isVisible) {
        revealStop(trip, s.name);
        player.revealed.add(s.name);
      } else if (!shouldBeVisible && isVisible) {
        hideStop(trip, s.name);
        player.revealed.delete(s.name);
      }
      if (shouldBeVisible && s.idx > currentStopIdx) { currentStopIdx = s.idx; currentStopName = s.name; }
    });
    setBarMarkerThumb(tripMarkerThumbEl, currentStopName);
    tripSliderEl.value = player.distKm;
  }

  // Jumps straight to a distance (skip/step/slider-drag) — always stops any
  // playback timing first (the caller does that), so this alone is what a
  // static, non-playing scrub does.
  function seekTripPlayer(player, distKm) {
    player.distKm = Math.max(0, Math.min(player.trip.lengthKm, distKm));
    player.pauseUntil = null;
    syncTripVisual(player);
  }

  function stopTripPlayback(player) {
    player.playing = false;
    if (player.rafId !== null) { cancelAnimationFrame(player.rafId); player.rafId = null; }
    player.lastFrameTime = null;
    tripPlayIconEl.innerHTML = '&#9654;';
    tripPlayBtn.setAttribute('aria-label', 'Play');
    tripPlayBtn.title = 'Play';
  }

  // Paced by real-world distance (see ROAD_TRIP_PACE_MS_PER_KM above) so
  // the 2002 trip always takes ~2.5s and the longer trips take
  // proportionally longer, not the same fixed duration regardless of
  // length. Every time a stop actually pops in, playback holds there for
  // TRIP_STOP_PAUSE_MS before continuing, exactly like the original
  // one-shot animation did — just now via player.pauseUntil instead of a
  // local accumulatedPauseMs closure, so it survives being paused/resumed
  // externally.
  function tripPlayLoopFrame(player, now) {
    if (currentTripPlayer !== player || !player.playing) return;
    if (player.pauseUntil !== null) {
      if (now < player.pauseUntil) { player.rafId = requestAnimationFrame(t => tripPlayLoopFrame(player, t)); return; }
      player.pauseUntil = null;
      player.lastFrameTime = now;
    }
    if (player.lastFrameTime === null) player.lastFrameTime = now;
    const dt = now - player.lastFrameTime;
    player.lastFrameTime = now;
    const trip = player.trip;
    const beforeCount = player.revealed.size;
    player.distKm = Math.min(trip.lengthKm, player.distKm + dt * (trip.lengthKm / trip.durationMs));
    syncTripVisual(player);
    if (player.distKm >= trip.lengthKm) { stopTripPlayback(player); return; }
    if (player.revealed.size > beforeCount) {
      player.pauseUntil = now + TRIP_STOP_PAUSE_MS;
    }
    player.rafId = requestAnimationFrame(t => tripPlayLoopFrame(player, t));
  }

  function startTripPlayback(player) {
    if (player.playing) return;
    // Starting from the end just loops back to the beginning, rather than
    // doing nothing (which would read as a broken button) — same
    // convention as the two timeline stories' play buttons.
    if (player.distKm >= player.trip.lengthKm) seekTripPlayer(player, 0);
    player.playing = true;
    player.lastFrameTime = null;
    tripPlayIconEl.innerHTML = '&#10074;&#10074;';
    tripPlayBtn.setAttribute('aria-label', 'Pause');
    tripPlayBtn.title = 'Pause';
    player.rafId = requestAnimationFrame(t => tripPlayLoopFrame(player, t));
  }

  function skipTripToStart(player) {
    stopTripPlayback(player);
    seekTripPlayer(player, 0);
  }

  function stepTripForward(player) {
    stopTripPlayback(player);
    const wp = player.trip.waypointsKm;
    const next = wp.find(km => km > player.distKm + 0.01);
    seekTripPlayer(player, next !== undefined ? next : player.trip.lengthKm);
  }

  function stepTripBack(player) {
    stopTripPlayback(player);
    const wp = player.trip.waypointsKm;
    let prev = 0;
    for (const km of wp) { if (km < player.distKm - 0.01) prev = km; else break; }
    seekTripPlayer(player, prev);
  }

  tripSliderEl.addEventListener('input', () => {
    if (!currentTripPlayer) return;
    stopTripPlayback(currentTripPlayer); // dragging manually always stops any playback
    seekTripPlayer(currentTripPlayer, parseFloat(tripSliderEl.value));
  });
  tripPlayBtn.addEventListener('click', () => {
    if (!currentTripPlayer) return;
    if (currentTripPlayer.playing) stopTripPlayback(currentTripPlayer); else startTripPlayback(currentTripPlayer);
  });
  document.getElementById('trip-skip-start').addEventListener('click', () => {
    if (currentTripPlayer) skipTripToStart(currentTripPlayer);
  });
  document.getElementById('trip-step-back').addEventListener('click', () => {
    if (currentTripPlayer) stepTripBack(currentTripPlayer);
  });
  document.getElementById('trip-step-fwd').addEventListener('click', () => {
    if (currentTripPlayer) stepTripForward(currentTripPlayer);
  });
  document.getElementById('trip-close').addEventListener('click', () => {
    if (activeStoryId && ROAD_TRIPS_BY_ID[activeStoryId]) exitStoryMode();
  });

  function activateTrip(trip) {
    const token = ++roadTripAnimationToken;
    roadTripModeActive = true;
    activeRoadTripStadiumNames = trip.stadiumNames;
    activeRoadTripLogoOverrideNames = trip.logoOverrideNames;
    storyPopZIndexByName = {};
    storyPopZIndexCounter = 0;
    updateStarsVisible();
    updateVisibility();
    // updateVisibility() just added every stop's marker (even the
    // "current" ones, like Fenway or T-Mobile, that are normally always
    // shown) — immediately hide them all again so the player can pop each
    // one in fresh as the drawn route actually reaches it. This is
    // synchronous with no render in between, so it isn't a visible flash.
    const stopNames = new Set(trip.stops.map(s => s.name));
    stopNames.forEach(name => {
      const marker = markerByName[name];
      if (marker && map.hasLayer(marker)) map.removeLayer(marker);
    });
    tripLabelEl.textContent = trip.title;
    // Reset to the baseball placeholder in case this is a restart of an
    // already-run trip (re-clicking its play button) that left a real
    // team logo showing — syncTripVisual will overwrite this with the
    // real furthest-reached stop once playback actually gets going, but
    // that's a beat away yet (camera flight + settle delay below).
    setBarMarkerThumb(tripMarkerThumbEl, null);
    tripSliderEl.min = 0;
    tripSliderEl.max = trip.lengthKm;
    tripSliderEl.step = trip.lengthKm / 500;
    tripSliderEl.value = 0;
    tripBarEl.style.display = 'flex';
    // Recenter/re-zoom to fit the whole route right away — trip.bounds is
    // computed from trip.coords directly (not trip.layer.getBounds()),
    // since the layer itself is about to be reset to empty and drawn in
    // progressively below, so its own bounds aren't usable yet. Playback
    // itself doesn't start until this camera move fully settles (moveend)
    // plus one extra beat — starting it immediately used to run the
    // line-drawing and the camera's pan/zoom at the same time, so the
    // first sliver of drawn line would visibly swing/stretch across the
    // screen as the camera moved, before either had really begun in a way
    // that read as intentional.
    flyToTripBounds(trip.bounds, Object.assign({ duration: 1 }, storyViewportFitPadding()));
    map.once('moveend', () => {
      if (token !== roadTripAnimationToken) return;
      setTimeout(() => {
        if (token !== roadTripAnimationToken) return;
        const player = makeTripPlayer(trip);
        currentTripPlayer = player;
        syncTripVisual(player);
        // Selecting the trip from the menu should start it running
        // immediately rather than sitting paused at the first stop.
        startTripPlayback(player);
      }, 1000);
    });
  }

  // Hides a trip's route, stops any playback in progress, and reverts its
  // logo overrides back to normal.
  function deactivateTrip(trip) {
    roadTripAnimationToken++; // invalidate any pending activateTrip settle-callback
    if (currentTripPlayer && currentTripPlayer.trip === trip) {
      stopTripPlayback(currentTripPlayer);
      currentTripPlayer = null;
    }
    tripBarEl.style.display = 'none';
    setBarMarkerThumb(tripMarkerThumbEl, null);
    map.removeLayer(trip.layer);
    trip.logoOverrideNames.forEach(revertLogoOverride);
  }

  // --- "Stadiums Over the Years" story: a year slider (1920-2026) plus
  // play/pause/skip transport controls. See activeTeamAssignmentsForYear /
  // renderYearStoryMarkersForYear above for the data + marker side, and
  // the yearStoryModeActive branch in updateVisibility() for how a
  // scrubbed year actually changes what's on the map.
  const yearStoryBarEl = document.getElementById('year-story-bar');
  const yearStorySliderEl = document.getElementById('year-story-slider');
  const yearStoryYearLabelEl = document.getElementById('year-story-year-label');
  const yearStoryPlayBtn = document.getElementById('year-story-play');
  const yearStoryPlayIconEl = yearStoryPlayBtn.querySelector('.btn-icon');
  const YEAR_STORY_PLAY_MS = 450; // ms per year while playing
  let yearStoryPlayTimer = null;

  function updateYearStoryLabel() {
    yearStoryYearLabelEl.textContent = 'Stadiums in ' + yearStoryYear;
    renderStoryBigNumber(String(yearStoryYear), YEAR_STORY_BIG_NUMBER_FONT_PX);
  }

  // Moves the story to a specific year — re-renders the map (if the story
  // is currently active) and keeps the slider/label in sync, whether the
  // change came from dragging the slider, a transport button, or playback.
  function setYearStoryYear(year) {
    yearStoryYear = Math.max(YEAR_STORY_MIN, Math.min(YEAR_STORY_MAX, year));
    yearStorySliderEl.value = yearStoryYear;
    updateYearStoryLabel();
    if (yearStoryModeActive) renderYearStoryMarkersForYear(yearStoryYear);
  }

  function stopYearStoryPlayback() {
    if (yearStoryPlayTimer) {
      clearInterval(yearStoryPlayTimer);
      yearStoryPlayTimer = null;
    }
    yearStoryPlayIconEl.innerHTML = '&#9654;';
    yearStoryPlayBtn.setAttribute('aria-label', 'Play');
    yearStoryPlayBtn.title = 'Play';
  }

  function startYearStoryPlayback() {
    if (yearStoryPlayTimer) return;
    // Starting from the end just loops back to the beginning, rather than
    // doing nothing (which would read as a broken button).
    if (yearStoryYear >= YEAR_STORY_MAX) setYearStoryYear(YEAR_STORY_MIN);
    yearStoryPlayIconEl.innerHTML = '&#10074;&#10074;';
    yearStoryPlayBtn.setAttribute('aria-label', 'Pause');
    yearStoryPlayBtn.title = 'Pause';
    yearStoryPlayTimer = setInterval(() => {
      if (yearStoryYear >= YEAR_STORY_MAX) { stopYearStoryPlayback(); return; }
      setYearStoryYear(yearStoryYear + 1);
    }, YEAR_STORY_PLAY_MS);
  }

  // Enters the story fresh — always starts back at 1920 (matching "browse
  // from the beginning" rather than resuming wherever it was last left).
  function startYearStory() {
    yearStoryModeActive = true;
    yearStoryYear = YEAR_STORY_MIN;
    yearStorySliderEl.value = yearStoryYear;
    updateYearStoryLabel();
    stopYearStoryPlayback();
    yearStoryBarEl.style.display = 'flex';
    // starsVisible must land on its year-story value (false) before the
    // team markers below are built, so they're created correct the first
    // time rather than momentarily showing a star then losing it.
    updateStarsVisible();
    // Every normal per-stadium marker is hidden for the story's whole
    // duration — what's shown instead is a dynamic set of per-TEAM
    // markers (see renderYearStoryMarkersForYear), every one of them a
    // team-logo-in-a-circle marker, not the plain dot former/historic
    // stadiums normally get, since whichever ones are shown for a given
    // year WERE that year's "current" MLB ballparks.
    stadiums.forEach(s => { map.removeLayer(markerByName[s.name]); });
    renderYearStoryMarkersForYear(yearStoryYear);
    flyToDefaultView();
    // Selecting the story from the menu should start it running immediately
    // rather than sitting paused at 1920 waiting for a manual Play click.
    startYearStoryPlayback();
  }

  yearStorySliderEl.addEventListener('input', () => {
    stopYearStoryPlayback(); // dragging manually always stops any playback
    setYearStoryYear(parseInt(yearStorySliderEl.value, 10));
  });
  yearStoryPlayBtn.addEventListener('click', () => {
    if (yearStoryPlayTimer) stopYearStoryPlayback(); else startYearStoryPlayback();
  });
  document.getElementById('year-story-skip-start').addEventListener('click', () => {
    stopYearStoryPlayback();
    setYearStoryYear(YEAR_STORY_MIN);
  });
  document.getElementById('year-story-step-back').addEventListener('click', () => {
    stopYearStoryPlayback();
    setYearStoryYear(yearStoryYear - 1);
  });
  document.getElementById('year-story-step-fwd').addEventListener('click', () => {
    stopYearStoryPlayback();
    setYearStoryYear(yearStoryYear + 1);
  });
  document.getElementById('year-story-close').addEventListener('click', () => {
    if (activeStoryId === 'story-years') exitStoryMode();
  });

  // --- "Ballparks I've Visited" story: same slider + transport control design
  // as "Stadiums Over the Years" above (shares its CSS classes), but its
  // own separate bar/state/functions — cumulative reveal of every stadium
  // Marco's actually visited, by firstVisited year, rather than a
  // point-in-time view of MLB history. See VISITED_STADIUMS/JOURNEY_MIN/
  // JOURNEY_MAX above for the data side, and the journeyModeActive branch
  // in updateVisibility() for how a scrubbed year changes what's shown.
  const journeyBarEl = document.getElementById('journey-bar');
  const journeySliderEl = document.getElementById('journey-slider');
  const journeyYearLabelEl = document.getElementById('journey-year-label');
  const journeyMarkerThumbEl = document.getElementById('journey-marker-thumb');
  const journeyPlayBtn = document.getElementById('journey-play');
  const journeyPlayIconEl = journeyPlayBtn.querySelector('.btn-icon');

  // Every journey reveal path (manual jump, staggered playback, and the
  // intro's own JOURNEY_MIN reveal) pops a stadium via popStadiumIcon and
  // should also update the transport bar's "current marker" thumbnail to
  // match — wrapping both together here means each of those three call
  // sites only has to call one function instead of remembering both.
  function popJourneyStadium(name) {
    popStadiumIcon(name);
    setBarMarkerThumb(journeyMarkerThumbEl, name);
  }

  // Bound labels/slider min-max are hardcoded in the HTML as a reasonable
  // starting point but always resynced here to the real computed range,
  // so they can never silently drift out of sync with the visit data.
  journeySliderEl.min = JOURNEY_MIN;
  journeySliderEl.max = JOURNEY_MAX;
  document.getElementById('journey-bound-min').textContent = JOURNEY_MIN;
  document.getElementById('journey-bound-max').textContent = JOURNEY_MAX;
  document.getElementById('journey-skip-start').title = 'Jump to ' + JOURNEY_MIN;

  let journeyPlayTimeoutId = null;
  // Invalidates the opening zoom-in/pop-Fenway/zoom-out sequence below
  // (startJourney) if the story gets closed or restarted before it finishes
  // — same generation-token pattern roadTripAnimationToken uses to guard a
  // multi-step, timer-chained handoff against being superseded mid-flight.
  let journeyIntroToken = 0;
  // Zoomed-in enough to read as "way in on New England" rather than the
  // full default view — deliberately hand-picked around Fenway/Boston
  // (see startJourney's opening beat below), not derived from the data,
  // since which real-world region to zoom into is a one-off creative
  // choice tied to Fenway specifically being the earliest stadium visited.
  const JOURNEY_INTRO_BOUNDS = L.latLngBounds([[41.2, -73.8], [43.6, -69.4]]);

  // Stadiums for the current journeyYear still waiting to pop in during
  // playback — populated by scheduleNextJourneyStep whenever playback lands
  // on a growth year, drained one at a time by advanceJourneyReveal. Always
  // reset to empty by any MANUAL jump (setJourneyYear), since a slider
  // drag/step/skip reveals its target year's stadiums all at once, not
  // staggered — this queue only ever represents an in-progress, resumable
  // PLAYBACK reveal.
  let journeyRevealQueue = [];

  function updateJourneyLabel() {
    // Every prior year is by definition fully revealed already; the current
    // year counts only however many of its own stadiums have actually
    // popped in so far (all of them for a manual jump, since that always
    // empties journeyRevealQueue — see setJourneyYear — or partway through
    // for a playback reveal still in progress) — so the number on screen
    // never gets ahead of what's actually visible on the map.
    const priorCount = VISITED_STADIUMS.filter(s => s.firstVisited < journeyYear).length;
    const thisYearTotal = journeyStadiumsAddedInYear(journeyYear).length;
    const thisYearRevealed = thisYearTotal - journeyRevealQueue.length;
    const count = priorCount + Math.max(0, Math.min(thisYearTotal, thisYearRevealed));
    journeyYearLabelEl.textContent = journeyYear + ': ' + count;
    renderStoryBigNumber(String(count), JOURNEY_BIG_NUMBER_FONT_PX);
  }

  // Step-back/step-forward for this story jump between years that actually
  // added a stadium, skipping the empty years in between — distinct from
  // the year-story's step buttons above, which move one calendar year at a
  // time regardless of content. Falls back to JOURNEY_MIN/JOURNEY_MAX at
  // either end rather than overshooting past the data.
  function nextJourneyGrowthYear(fromYear) {
    for (let y = fromYear + 1; y <= JOURNEY_MAX; y++) {
      if (journeyStadiumsAddedInYear(y).length > 0) return y;
    }
    return JOURNEY_MAX;
  }
  function previousJourneyGrowthYear(fromYear) {
    for (let y = fromYear - 1; y >= JOURNEY_MIN; y--) {
      if (journeyStadiumsAddedInYear(y).length > 0) return y;
    }
    return JOURNEY_MIN;
  }

  function setJourneyYear(year) {
    const prevYear = journeyYear;
    journeyYear = Math.max(JOURNEY_MIN, Math.min(JOURNEY_MAX, year));
    journeySliderEl.value = journeyYear;
    // A manual jump (slider drag, step, or skip) always reveals its target
    // year's stadiums all at once, not staggered — invalidate any
    // in-progress playback reveal so a later Play doesn't try to keep
    // draining a queue that belonged to a different year.
    journeyRevealQueue = [];
    updateJourneyLabel();
    if (journeyModeActive) {
      updateVisibility();
      // Moving forward can cross the firstVisited threshold for one or more
      // stadiums at once — pop each one newly revealed in, the same
      // stadiumPop animation the road trips use, rather than having it
      // just silently appear. Moving backward only ever hides stadiums,
      // nothing to pop.
      if (journeyYear > prevYear) {
        VISITED_STADIUMS.forEach(s => {
          if (s.firstVisited > prevYear && s.firstVisited <= journeyYear) popJourneyStadium(s.name);
        });
      }
    }
  }

  function setJourneyPlayingUI(isPlaying) {
    journeyPlayIconEl.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
    journeyPlayBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    journeyPlayBtn.title = isPlaying ? 'Pause' : 'Play';
  }

  function stopJourneyPlayback() {
    if (journeyPlayTimeoutId !== null) {
      clearTimeout(journeyPlayTimeoutId);
      journeyPlayTimeoutId = null;
    }
    setJourneyPlayingUI(false);
  }

  // Advances playback to journeyYear + 1 and queues up its reveal (empty
  // queue if nothing was added that year). Called both to move on from a
  // year whose reveal just finished and, from startJourney's intro, as the
  // very first step once JOURNEY_MIN's own reveal+rest has already
  // happened there.
  function scheduleNextJourneyStep() {
    if (journeyYear >= JOURNEY_MAX) { stopJourneyPlayback(); return; }
    journeyYear += 1;
    journeySliderEl.value = journeyYear;
    journeyRevealQueue = journeyRevealOrderForYear(journeyYear);
    updateJourneyLabel();
    advanceJourneyReveal();
  }

  // Pops the next queued stadium for the current journeyYear, if any, then
  // schedules the following one JOURNEY_STAGGER_MS later; once the queue's
  // empty (nothing left to pop, whether because this year never had
  // anything to begin with or because it just finished), waits either the
  // zip pace or JOURNEY_YEAR_REST_MS — whichever fits this year — before
  // moving on to the next one. This is also the resume path when playback
  // was paused: mid-stagger it pops the very next queued stadium
  // immediately, and between years it just re-waits the appropriate pace
  // rather than trying to preserve exactly how much of the original delay
  // had already elapsed.
  function advanceJourneyReveal() {
    if (journeyRevealQueue.length > 0) {
      const s = journeyRevealQueue.shift();
      markerByName[s.name].addTo(map);
      popJourneyStadium(s.name);
      updateJourneyLabel();
      resolveOverlaps();
    }
    if (journeyRevealQueue.length > 0) {
      journeyPlayTimeoutId = setTimeout(advanceJourneyReveal, JOURNEY_STAGGER_MS);
    } else {
      const delay = journeyStadiumsAddedInYear(journeyYear).length > 0 ? JOURNEY_YEAR_REST_MS : JOURNEY_ZIP_STEP_MS;
      journeyPlayTimeoutId = setTimeout(scheduleNextJourneyStep, delay);
    }
  }

  // True "begin/resume the automatic playback timer", used by the Play
  // button — continues from wherever journeyRevealQueue currently sits
  // (mid-reveal, waiting out a rest/zip pause, or freshly reset to
  // JOURNEY_MIN if playback had already finished).
  function startJourneyPlayback() {
    if (journeyPlayTimeoutId !== null) return;
    if (journeyYear >= JOURNEY_MAX) {
      journeyYear = JOURNEY_MIN;
      journeySliderEl.value = journeyYear;
      journeyRevealQueue = [];
      updateJourneyLabel();
      updateVisibility();
    }
    setJourneyPlayingUI(true);
    advanceJourneyReveal();
  }

  // Used only by startJourney's intro sequence below, once it's already
  // handled JOURNEY_MIN's own reveal and one-second rest itself — jumps
  // straight to advancing toward the next year rather than re-running
  // JOURNEY_MIN's reveal a second time the way startJourneyPlayback would.
  function beginJourneyPlaybackFromIntro() {
    if (journeyPlayTimeoutId !== null) return;
    setJourneyPlayingUI(true);
    scheduleNextJourneyStep();
  }

  // Enters the story fresh — always starts back at JOURNEY_MIN (matching
  // "browse the journey from the beginning"), with a short choreographed
  // opening: fly in tight on New England with nothing shown yet, pop
  // Fenway in alone, hold a beat, then fly back out to the full default
  // view while playback gets underway — timed so the zoom-out finishes
  // right around when the next stadium (1985's Kingdome, as of today's
  // data) pops on, rather than the camera still being zoomed in on Boston
  // when something pops on the far side of the country.
  function startJourney() {
    const token = ++journeyIntroToken;
    journeyModeActive = true;
    storyPopZIndexByName = {};
    storyPopZIndexCounter = 0;
    journeyYear = JOURNEY_MIN;
    journeySliderEl.value = journeyYear;
    journeyRevealQueue = []; // discard any leftover queue from a previous session before the label reads it below
    updateJourneyLabel();
    stopJourneyPlayback();
    journeyBarEl.style.display = 'flex';
    // Reset to the baseball placeholder in case this is a restart that
    // left a real team logo showing from a previous run — popJourneyStadium
    // overwrites this with JOURNEY_MIN's own stadium once the intro's
    // zoom-in settles below, but that's a beat away yet.
    setBarMarkerThumb(journeyMarkerThumbEl, null);
    // starsVisible must land on its journey value (true) before the
    // override markers below are built, so 5-star stadiums show their
    // badge from the very first frame rather than only after the next
    // filter change.
    updateStarsVisible();
    // Every visited stadium gets current-stadium styling — full-color
    // team logo, not the plain gray dot a former/historic stadium
    // normally gets — regardless of whether it's still standing today.
    // Reuses applyLogoOverride, the same marker-swap road trips and the
    // year story both use. Checked directly against category, not
    // isLogoIconActive (which by this point already returns true for
    // every visited stadium thanks to journeyModeActive above — that
    // circularity would skip every override).
    VISITED_STADIUMS.forEach(s => {
      const isCurrent = s.category === 'current_visited' || s.category === 'current_not_visited';
      if (!isCurrent) applyLogoOverride(s.name);
    });
    // Nothing shown yet — the opening beat below wants the camera to
    // arrive on an empty, zoomed-in New England first, then pop JOURNEY_MIN's
    // stadium(s) in only once that view has settled, not have them already
    // sitting there mid-flight.
    stadiums.forEach(s => { map.removeLayer(markerByName[s.name]); });
    flyToTripBounds(JOURNEY_INTRO_BOUNDS, Object.assign({ duration: 1 }, storyViewportFitPadding()));
    map.once('moveend', () => {
      if (token !== journeyIntroToken) return; // superseded by a close/restart mid-flight
      journeyStadiumsAddedInYear(JOURNEY_MIN).forEach(s => {
        markerByName[s.name].addTo(map);
        popJourneyStadium(s.name);
      });
      journeyRevealQueue = []; // JOURNEY_MIN is fully revealed now, not staggered — see updateJourneyLabel
      updateJourneyLabel();
      resolveOverlaps();
      // "Pause there for one second" — JOURNEY_YEAR_REST_MS, the same flat
      // rest the playback timer itself uses after any growth year's last
      // pop, so this opening hold and the timer's own first step stay in
      // sync by construction rather than as two separately-tuned numbers.
      setTimeout(() => {
        if (token !== journeyIntroToken) return;
        updateVisibility(); // picks up any other JOURNEY_MIN stadiums beyond what was popped above
        // Zoom-out duration matches JOURNEY_ZIP_TOTAL_MS — the same ~2s the
        // zero-growth years between JOURNEY_MIN and the next stadium zip
        // through in — so the camera lands on the full default view right
        // as that next stadium pops on, instead of arriving early or late.
        flyToDefaultView(JOURNEY_ZIP_TOTAL_MS / 1000);
        beginJourneyPlaybackFromIntro();
      }, JOURNEY_YEAR_REST_MS);
    });
  }

  journeySliderEl.addEventListener('input', () => {
    stopJourneyPlayback();
    setJourneyYear(parseInt(journeySliderEl.value, 10));
  });
  journeyPlayBtn.addEventListener('click', () => {
    if (journeyPlayTimeoutId !== null) stopJourneyPlayback(); else startJourneyPlayback();
  });
  document.getElementById('journey-skip-start').addEventListener('click', () => {
    stopJourneyPlayback();
    setJourneyYear(JOURNEY_MIN);
  });
  document.getElementById('journey-step-back').addEventListener('click', () => {
    stopJourneyPlayback();
    setJourneyYear(previousJourneyGrowthYear(journeyYear));
  });
  document.getElementById('journey-step-fwd').addEventListener('click', () => {
    stopJourneyPlayback();
    setJourneyYear(nextJourneyGrowthYear(journeyYear));
  });
  document.getElementById('journey-close').addEventListener('click', () => {
    if (activeStoryId === 'story-journey') exitStoryMode();
  });

  // Keeps the two collapsed corner buttons ("Stories" / "Layers & filters")
  // out of the way whenever they'd just be clutter: both hide while any
  // story is being viewed (active or paused, doesn't matter — only the
  // transport bar's own close button exits a story now), and the Stories
  // button additionally hides whenever the filters panel is expanded, so
  // the two menus never compete for the same corner. Called on every
  // activeStoryId change (activateStoryRow/exitStoryMode) and on every
  // filters-toggle click.
  function updateTopRightPanelsVisibility() {
    const storyActive = activeStoryId !== null;
    const filtersOpen = filtersBodyEl.style.display !== 'none';
    filtersPanelEl.style.display = storyActive ? 'none' : '';
    storiesPanelEl.style.display = (storyActive || filtersOpen) ? 'none' : '';
  }

  // --- Stories: shared all-or-nothing activation, generalized from the
  // road-trip logic above to also cover the year-slider story below.
  // Turning any one story on replaces every other filter selection with
  // that story's own fixed view and screens the rest of the filters menu
  // behind an opaque scrim so nothing else can be toggled while a story is
  // active. The only interactions still allowed in the filters menu are
  // picking a different story (switches instantly, no need to deselect
  // first) or unchecking the active story, which restores exactly the
  // filter selections that were in place beforehand.
  function enterStoryModeIfNeeded() {
    if (activeStoryId !== null) return;
    savedFilterState = snapshotFilterState();
    cbCurrent.checked = false;
    cbFormerStanding.checked = false;
    cbFormerDemolished.checked = false;
    cbFuture.checked = false;
    updateFormerParentState();
    PEOPLE.forEach(p => { personCheckboxes[p].checked = false; });
    peopleAllCb.checked = false;
    peopleAllCb.indeterminate = false;
    RATINGS.forEach(r => { ratingCheckboxes[r].checked = false; });
    ratingsAllCb.checked = false;
    ratingsAllCb.indeterminate = false;
    if (voyagerCb.checked) {
      voyagerCb.checked = false;
      voyagerCb.dispatchEvent(new Event('change'));
    }
    filtersScrimEl.style.display = 'block';
  }

  // Turns off whichever story is currently active (if any), without
  // touching the saved filter snapshot or the scrim — used both when
  // switching directly from one story to another and as the first step of
  // exiting story mode entirely.
  function deactivateActiveStory() {
    if (activeStoryId === null) return;
    hideStoryBigNumber(); // only ever shown by story-years/story-journey, but safe to call regardless
    if (activeStoryId === 'story-years') {
      stopYearStoryPlayback();
      // Hide every year-story team marker — the normal per-stadium
      // markers get their own visibility restored below, once the filter
      // state that was saved on entry gets restored and re-renders them.
      hideAllYearStoryMarkers();
      yearStoryModeActive = false;
      yearStoryBarEl.style.display = 'none';
    } else if (activeStoryId === 'story-journey') {
      journeyIntroToken++; // invalidate any in-flight startJourney zoom/pop/zoom-out sequence
      stopJourneyPlayback();
      // Revert every stadium applyLogoOverride swapped in when the journey
      // started — restores each one's normal marker (dot or logo,
      // whichever its category actually calls for) before the filter
      // state that was saved on entry gets restored and re-renders them.
      VISITED_STADIUMS.forEach(s => { if (originalMarkerByName[s.name]) revertLogoOverride(s.name); });
      journeyModeActive = false;
      journeyBarEl.style.display = 'none';
      setBarMarkerThumb(journeyMarkerThumbEl, null);
    } else {
      const prevTrip = ROAD_TRIPS_BY_ID[activeStoryId];
      deactivateTrip(prevTrip);
      roadTripModeActive = false;
      activeRoadTripStadiumNames = null;
      activeRoadTripLogoOverrideNames = null;
    }
    updateStarsVisible();
  }

  // Exits story mode entirely: deactivates whatever's active, drops the
  // scrim, and restores exactly the filter selections from before any
  // story was entered.
  function exitStoryMode() {
    deactivateActiveStory();
    activeStoryId = null;
    updateTopRightPanelsVisibility();
    filtersScrimEl.style.display = 'none';
    if (savedFilterState) {
      restoreFilterState(savedFilterState);
      savedFilterState = null;
    }
    updateVisibility();
    flyToDefaultView();
  }

  // Stories menu rows are single play buttons, not a checkbox/radio to
  // toggle (see .story-row in the HTML/CSS) — clicking one always (re)starts
  // that story from the beginning, switching away from whatever else was
  // active; the transport bar's own close (X) button is the only way to
  // stop a story from here on out. kind distinguishes a road trip (looked
  // up by id in ROAD_TRIPS_BY_ID) from the two fixed timeline stories.
  function activateStoryRow(kind, id) {
    enterStoryModeIfNeeded();
    if (activeStoryId !== null && activeStoryId !== id) deactivateActiveStory();
    activeStoryId = id;
    storiesToggle.collapse();
    updateTopRightPanelsVisibility();
    if (kind === 'trip') activateTrip(ROAD_TRIPS_BY_ID[id]);
    else if (id === 'story-years') startYearStory();
    else if (id === 'story-journey') startJourney();
  }

  ROAD_TRIPS.forEach(trip => {
    document.querySelector('.story-row[data-route="' + trip.id + '"] .story-play-btn')
      .addEventListener('click', () => activateStoryRow('trip', trip.id));
  });
  document.querySelector('.story-row[data-story="story-years"] .story-play-btn')
    .addEventListener('click', () => activateStoryRow('story', 'story-years'));
  document.querySelector('.story-row[data-story="story-journey"] .story-play-btn')
    .addEventListener('click', () => activateStoryRow('story', 'story-journey'));

  // Also allow clicking a filter row (not just the input itself) to toggle
  // — a radio (the Show: All/Current/Former scope row) just gets selected,
  // since toggling a radio off would leave the group with nothing checked.
  document.querySelectorAll('.filter-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('input, label')) return;
      const cb = row.querySelector('input[type=checkbox], input[type=radio]');
      if (!cb) return;
      cb.checked = cb.type === 'radio' ? true : !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });

  // Collapsible panel toggle — collapsed by default, shared by both the
  // Layers & filters panel and the Stories panel. Floats over the map (see
  // viewportFitPadding above), so opening/closing it never touches the
  // map's size or fit — no refit needed here.
  function setupPanelToggle(toggleId, bodyId, panelEl, expandTitle, collapseTitle) {
    const toggleBtn = document.getElementById(toggleId);
    const arrowEl = toggleBtn.querySelector('.panel-toggle-arrow');
    const bodyEl = document.getElementById(bodyId);
    function setExpanded(expanding) {
      bodyEl.style.display = expanding ? '' : 'none';
      arrowEl.innerHTML = expanding ? '&#9662;' : '&#9656;';
      toggleBtn.setAttribute('aria-expanded', String(expanding));
      toggleBtn.title = expanding ? collapseTitle : expandTitle;
      panelEl.classList.toggle('expanded', expanding);
    }
    toggleBtn.addEventListener('click', () => setExpanded(bodyEl.style.display === 'none'));
    // Exposed so other code (picking a story from the menu) can force the
    // panel closed programmatically, same as if the user clicked the arrow.
    return { collapse: () => setExpanded(false) };
  }
  setupPanelToggle('filters-toggle', 'filters-body', filtersPanelEl, 'Expand layers & filters', 'Collapse layers & filters');
  const storiesToggle = setupPanelToggle('stories-toggle', 'stories-body', storiesPanelEl, 'Expand stories', 'Collapse stories');
  // Opening/closing the filters panel can change whether the Stories button
  // should be visible (see updateTopRightPanelsVisibility) — registered
  // after setupPanelToggle's own listener above, so filters-body's
  // display has already been flipped by the time this runs.
  document.getElementById('filters-toggle').addEventListener('click', updateTopRightPanelsVisibility);

  // --- Story transport bars: draggable by their title bar. Works with
  // either a mouse or a finger via the Pointer Events API, which unifies
  // both (plus pen) behind one event model instead of needing separate
  // mouse/touch listeners. On the first drag, the bar's current on-screen
  // position gets frozen into explicit left/top pixel values (dropping the
  // centering transform/bottom anchor it starts with), so it tracks the
  // pointer 1:1 from wherever it happened to be — and stays wherever it's
  // dropped for the rest of the session, rather than snapping back the
  // next time the bar is shown.
  function makeBarDraggable(barEl, handleEl) {
    let dragging = false;
    let startX, startY, startLeft, startTop, barW;
    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return; // mouse: left button only
      const rect = barEl.getBoundingClientRect();
      barW = rect.width;
      barEl.style.left = rect.left + 'px';
      barEl.style.top = rect.top + 'px';
      barEl.style.bottom = 'auto';
      barEl.style.transform = 'none';
      startX = e.clientX;
      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
      dragging = true;
      handleEl.setPointerCapture(e.pointerId);
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      const margin = 40; // keep at least this much of the bar reachable on every edge
      let newLeft = startLeft + dx, newTop = startTop + dy;
      newLeft = Math.max(margin - barW, Math.min(window.innerWidth - margin, newLeft));
      newTop = Math.max(0, Math.min(window.innerHeight - margin, newTop));
      barEl.style.left = newLeft + 'px';
      barEl.style.top = newTop + 'px';
    }
    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;
      try { handleEl.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    handleEl.addEventListener('pointerdown', onPointerDown);
    handleEl.addEventListener('pointermove', onPointerMove);
    handleEl.addEventListener('pointerup', onPointerUp);
    handleEl.addEventListener('pointercancel', onPointerUp);
  }
  makeBarDraggable(document.getElementById('year-story-bar'), document.getElementById('year-story-titlebar'));
  makeBarDraggable(document.getElementById('journey-bar'), document.getElementById('journey-titlebar'));
  makeBarDraggable(document.getElementById('trip-bar'), document.getElementById('trip-titlebar'));

  // --- Overlap avoidance: when two stadium markers are closer together on
  // screen than needed to keep each one at least half-visible, nudge them
  // apart along the axis connecting their centers, at every zoom level.
  // Recomputed from the canonical coordinates on every zoom change so it
  // settles correctly at each zoom level, and only considers stadiums
  // currently ON the map — a stadium hidden by the filters can't cause (or
  // need) a nudge, so switching a colliding layer off automatically lets
  // whatever it had displaced settle back to its exact true location the
  // next time this runs.
  //
  // The minimum separation for a given pair is sized to each marker's own
  // on-screen radius (a small former/historic dot needs far less clearance
  // than a large current-team logo, and a 5-star logo with its star badge
  // needs more still) rather than one uniform worst-case gap for every
  // pair — d >= max(radiusA, radiusB) is exactly the distance at which
  // each circle keeps at least half its diameter clear of the other.
  //
  // Current stadiums (visited or not) always win the exact spot: when a
  // current stadium collides with a non-current one, only the non-current
  // one moves, absorbing the entire gap. Pairs with no current stadium
  // involved (e.g. two former stadiums) split the gap evenly as before, as
  // do the rare pairs of two current stadiums close enough to collide —
  // there's no priority to apply between two of the same kind.
  // Reads the marker's CURRENT on-screen radius live (dotRadiusForZoom /
  // logoDiameterForZoom), not a fixed base value — former/historic/future
  // dots and, on mobile, logo markers too, grow with zoom (see
  // updateGrowingMarkerSizes), so collision-avoidance has to separate them
  // using however big they actually are RIGHT NOW or a grown marker can
  // end up closer to a neighbor than its larger visible size needs.
  function markerRadiusPx(s) {
    if (!isLogoIconActive(s)) return dotRadiusForZoom(map.getZoom());
    const d = logoDiameterForZoom(map.getZoom());
    return (s.rating === 5 ? d * STAR_SCALE : d) / 2;
  }

  function isCurrentCategory(s) {
    return s.category === 'current_visited' || s.category === 'current_not_visited';
  }

  function resolveOverlaps() {
    const zoom = map.getZoom();
    // r uses each marker's CURRENT on-screen radius (markerRadiusPx reads
    // dotRadiusForZoom/logoDiameterForZoom live) — this only gives correct
    // separation if it runs AFTER updateGrowingMarkerSizes has applied the
    // real size for this zoom (see the 'zoomend' wiring below); called
    // with a stale pre-growth radius, grown markers can end up closer
    // together on screen than their now-larger visible size needs,
    // reading as one marker disappearing behind another.
    // + worldOffsetDeg (see updateWorldOffset) so collision-avoidance
    // projects from wherever the markers actually are right now, not their
    // one true home longitude — otherwise this would drag every marker
    // back to the original world copy the instant it next runs.
    //
    // In the year-slider story, the "stadiums" being separated are really
    // the dynamic per-TEAM-PER-STADIUM markers (see yearStoryMarkerByKey)
    // — each point still always projects fresh from its assigned
    // stadium's TRUE home coordinate (entry.stadium), never from the
    // marker's own current (possibly already-nudged) position, for the
    // same anti-drift reason as the worldOffsetDeg comment above. Every
    // one of them is weighted equally (current: false), so two teams
    // sharing one ballpark (or one team split across two) split the gap
    // evenly instead of one being treated as a fixed anchor.
    const pts = yearStoryModeActive
      ? Object.values(yearStoryMarkerByKey)
          .filter(entry => map.hasLayer(entry.marker))
          .map(entry => ({
            marker: entry.marker,
            p: map.project([entry.stadium.lat, entry.stadium.lon + worldOffsetDeg], zoom),
            r: logoDiameterForZoom(zoom) / 2,
            current: false
          }))
      : stadiums
          .filter(s => map.hasLayer(markerByName[s.name]))
          .map(s => ({
            marker: markerByName[s.name],
            p: map.project([s.lat, s.lon + worldOffsetDeg], zoom),
            r: markerRadiusPx(s),
            current: isCurrentCategory(s)
          }));
    // Snapshot each marker's true, un-nudged position before collision
    // avoidance touches it — used below to tell "already on screen, don't
    // let it get pushed off" apart from "was never on screen to begin
    // with," which the edge-clamp must never drag into view.
    pts.forEach(pt => { pt.p0 = { x: pt.p.x, y: pt.p.y }; });

    const maxIterations = 8;
    for (let iter = 0; iter < maxIterations; iter++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const minSep = Math.max(a.r, b.r);
          const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minSep) {
            moved = true;
            let ux, uy;
            if (dist < 1e-6) {
              const angle = ((i * 37 + j * 53) % 360) * Math.PI / 180;
              ux = Math.cos(angle); uy = Math.sin(angle);
              dist = 0;
            } else {
              ux = dx / dist; uy = dy / dist;
            }
            const gap = minSep - dist;
            // Weight 0 = fixed (current stadium), 1 = movable. Splitting
            // the gap by weight share means: current-vs-non-current moves
            // only the non-current point the full gap, while same-kind
            // pairs (both weight 1, or both weight 0 as a fallback) still
            // split it evenly exactly like before.
            const wa = a.current ? 0 : 1, wb = b.current ? 0 : 1;
            const total = wa + wb;
            const fa = total === 0 ? 0.5 : wa / total;
            const fb = total === 0 ? 0.5 : wb / total;
            a.p.x -= ux * gap * fa; a.p.y -= uy * gap * fa;
            b.p.x += ux * gap * fb; b.p.y += uy * gap * fb;
          }
        }
      }
      if (!moved) break;
    }

    // A marker that starts ON SCREEN near the edge of the fitted view
    // (Miami is the recurring example) can get nudged further toward that
    // edge while separating from a neighbor, right off the visible map
    // entirely — clamp those back in, by their own radius. Critically,
    // this only applies per-axis when the marker's TRUE, un-nudged
    // position (p0) was already within the visible area on that axis; a
    // marker that's legitimately off-screen to begin with (e.g. Boston
    // while zoomed into California) must never get dragged onto screen
    // just because collision-avoidance happened to move it — that was the
    // bug in the first version of this clamp, which pulled EVERY marker
    // onto screen unconditionally and lined the whole roster up around
    // the edges the instant you zoomed in anywhere.
    const pixelBounds = map.getPixelBounds(zoom);
    pts.forEach(({ p, p0, r }) => {
      const margin = r + 2;
      const minX = pixelBounds.min.x + margin, maxX = pixelBounds.max.x - margin;
      const minY = pixelBounds.min.y + margin, maxY = pixelBounds.max.y - margin;
      if (minX <= maxX && p0.x >= minX && p0.x <= maxX) {
        p.x = Math.min(Math.max(p.x, minX), maxX);
      }
      if (minY <= maxY && p0.y >= minY && p0.y <= maxY) {
        p.y = Math.min(Math.max(p.y, minY), maxY);
      }
    });

    pts.forEach(({ marker, p }) => {
      marker.setLatLng(map.unproject(p, zoom));
    });
  }

  // --- State-label sizing + overlap avoidance + viewport clamping. Font
  // size ramps with zoom (see fontSizeForZoom), each label's icon container
  // is resized to its true measured footprint so the text is never clipped
  // by its own box, overlapping labels are pushed apart using a
  // minimum-translation-vector approach on those true bounding boxes, and
  // finally any label that's partly on-screen gets nudged fully inside the
  // visible map area so it's never cut off at the window edge. Recomputed
  // on every zoom change, pan, and window resize.
  function resolveStateLabelOverlaps() {
    const zoom = map.getZoom();
    const fontSizePx = fontSizeForZoom(zoom);

    const pts = stateLabels.map(st => {
      const size = measureLabel(st.name, fontSizePx);
      // + worldOffsetDeg keeps labels on the same world copy the stadium
      // markers were just shifted to (see updateWorldOffset) — projecting
      // the true, un-shifted lon here would place labels a full world away
      // from view the moment the user pans past one.
      return { st, p: map.project([st.lat, st.lon + worldOffsetDeg], zoom), w: size.width, h: size.height };
    });

    const padding = 1.5; // small buffer so labels don't sit edge-to-edge
    const maxIterations = 12;
    for (let iter = 0; iter < maxIterations; iter++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
          const overlapX = (a.w / 2 + b.w / 2 + padding) - Math.abs(dx);
          const overlapY = (a.h / 2 + b.h / 2 + padding) - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            moved = true;
            if (overlapX < overlapY) {
              const sign = dx === 0 ? (i < j ? -1 : 1) : Math.sign(dx);
              const shift = (overlapX / 2) * (sign || 1);
              a.p.x -= shift; b.p.x += shift;
            } else {
              const sign = dy === 0 ? (i < j ? -1 : 1) : Math.sign(dy);
              const shift = (overlapY / 2) * (sign || 1);
              a.p.y -= shift; b.p.y += shift;
            }
          }
        }
      }
      if (!moved) break;
    }

    const size = map.getSize(); // current container size in px, tracks window size
    const edgeMargin = 2;

    pts.forEach(({ st, p, w, h }) => {
      const marker = stateMarkerByName[st.name];
      const boxW = Math.ceil(w) + 4;
      const boxH = Math.ceil(h) + 2;
      marker.setIcon(L.divIcon({
        className: 'state-label',
        html: st.name,
        iconSize: [boxW, boxH],
        iconAnchor: [boxW / 2, boxH / 2]
      }));
      const el = marker.getElement();
      if (el) el.style.fontSize = fontSizePx + 'px';

      let latlng = map.unproject(p, zoom);

      // Keep the label fully inside the visible window: only nudge it if
      // it's already at least partly on-screen (never yank an off-screen
      // state into view).
      const cp = map.latLngToContainerPoint(latlng);
      const halfW = boxW / 2, halfH = boxH / 2;
      const intersects = (cp.x + halfW > 0) && (cp.x - halfW < size.x) &&
                          (cp.y + halfH > 0) && (cp.y - halfH < size.y);
      if (intersects) {
        let cx = cp.x, cy = cp.y;
        if (boxW + edgeMargin * 2 <= size.x) {
          cx = Math.min(Math.max(cx, halfW + edgeMargin), size.x - halfW - edgeMargin);
        } else {
          cx = size.x / 2;
        }
        if (boxH + edgeMargin * 2 <= size.y) {
          cy = Math.min(Math.max(cy, halfH + edgeMargin), size.y - halfH - edgeMargin);
        } else {
          cy = size.y / 2;
        }
