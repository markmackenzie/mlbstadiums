  // Desktop/laptop/iPad placement — anything that isn't a genuine phone
  // (see isPhoneFormFactor; deliberately NOT isMobileViewport alone, which
  // would also catch an ordinary narrowed desktop browser window). The
  // condensed preview and the pinned full
  // panel have to agree in advance on which side of the marker they're
  // both going to live on, since the whole point is that clicking to pin
  // reads as an in-place expansion, never a jump to a different spot:
  //
  // Preferred side is the marker's right, top-edge-aligned with the
  // marker's own top — that's checked against the FULL panel's size
  // (fixed ~340px wide, height varies per stadium's content), not the
  // condensed preview's own smaller size, because the side has to work
  // for whichever one ends up showing. Left is the fallback if right
  // doesn't fit, and centered-over-the-marker is the last resort if
  // neither side has room (only really happens at a very small window
  // size).
  //
  // Vertically, the preferred behavior is also top-aligned with the
  // marker, letting the full panel extend straight downward from there —
  // but if the full panel is tall enough that this would clip it at the
  // bottom of the window, it instead hugs the bottom (OV_EDGE_MARGIN up
  // from the window's bottom edge) and grows upward only as far as it
  // needs to, rather than clipping. The condensed preview always stays
  // top-aligned with the marker regardless — it's short enough that this
  // essentially never clips, and that's what makes the RIGHT-side expand
  // read as "in place": both states share the same top-left corner, so
  // expanding only ever adds space to the right and below, never
  // relocating anything already on screen.
  //
  // On the LEFT side that same "share a corner" trick can't rely on the
  // literal same corner — the panel's felt anchor there is its RIGHT edge
  // (nearest the marker), with everything extending leftward from it. If
  // the condensed preview were left at its own (narrower) natural width,
  // expanding it to the full panel's width would widen it further to the
  // LEFT, visibly shifting the header text left as it expands. So on this
  // side the condensed preview is pre-sized to the FULL panel's width
  // from the start (blank space trailing the short header content is the
  // trade-off), giving both states the exact same left edge and leaving
  // the text that's actually there completely still.
  const OV_MARKER_GAP = 8;    // gap between the marker's own edge and the panel
  const OV_EDGE_MARGIN = 10;  // margin kept from the window edge
  function computeStadiumPlacement(anchor, r, fullSize, condensedSize, mapSize) {
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
    const rightEdge = anchor.x + r;
    const leftEdge = anchor.x - r;
    const topEdge = anchor.y - r;

    const fitsRight = rightEdge + OV_MARKER_GAP + fullSize.w + OV_EDGE_MARGIN <= mapSize.x;
    const fitsLeft = leftEdge - OV_MARKER_GAP - fullSize.w - OV_EDGE_MARGIN >= 0;

    if (!fitsRight && !fitsLeft) {
      // Last resort: neither side has room for the full panel. Dead-
      // centering it directly over the marker was the original approach
      // here, but that hides the very marker the panel is describing —
      // not legible, and not what "last resort" should mean. Stack it
      // below the marker instead (above, if below doesn't fit either),
      // horizontally centered on the marker and pre-sized to the full
      // panel's width — the same "shared edges" trick as the left-side
      // case above, so there's still no horizontal shift on expand. This
      // keeps both the marker and the panel visible and legible at
      // essentially any window size; only a window too short for even the
      // condensed preview's own small height would still clip it, which
      // in practice shouldn't happen outside a genuinely pathological
      // window.
      const sharedLeft = clamp(anchor.x - fullSize.w / 2, OV_EDGE_MARGIN, mapSize.x - fullSize.w - OV_EDGE_MARGIN);
      const bottomEdge = anchor.y + r;
      const stackVertical = (size) => {
        if (bottomEdge + OV_MARKER_GAP + size.h + OV_EDGE_MARGIN <= mapSize.y) {
          return bottomEdge + OV_MARKER_GAP; // below the marker
        }
        if (topEdge - OV_MARKER_GAP - size.h - OV_EDGE_MARGIN >= 0) {
          return topEdge - OV_MARKER_GAP - size.h; // above the marker
        }
        // Neither direction has full clearance — pick below and let the
        // outer clamp pull it back fully on screen.
        return clamp(bottomEdge + OV_MARKER_GAP, OV_EDGE_MARGIN, mapSize.y - size.h - OV_EDGE_MARGIN);
      };
      return {
        full: { left: sharedLeft, top: stackVertical(fullSize) },
        condensed: { left: sharedLeft, top: stackVertical(condensedSize), width: fullSize.w }
      };
    }

    const side = fitsRight ? 'right' : 'left';
    const sharedLeft = clamp(
      side === 'right' ? rightEdge + OV_MARKER_GAP : leftEdge - OV_MARKER_GAP - fullSize.w,
      OV_EDGE_MARGIN,
      Math.max(OV_EDGE_MARGIN, mapSize.x - fullSize.w - OV_EDGE_MARGIN)
    );

    const fitsBelow = topEdge + fullSize.h + OV_EDGE_MARGIN <= mapSize.y;
    const fullTop = fitsBelow
      ? topEdge
      : Math.max(OV_EDGE_MARGIN, mapSize.y - OV_EDGE_MARGIN - fullSize.h);

    const condensedTop = clamp(topEdge, OV_EDGE_MARGIN, mapSize.y - condensedSize.h - OV_EDGE_MARGIN);

    return {
      full: { left: sharedLeft, top: fullTop },
      condensed: { left: sharedLeft, top: condensedTop, width: side === 'left' ? fullSize.w : null }
    };
  }

  // Shows/hides each fade strip to match actual scroll position — top
  // fade hidden while already at the top (nothing hidden above yet),
  // bottom fade hidden once scrolled all the way down (or if the content
  // never overflowed in the first place).
  function updateScrollFades(scrollEl) {
    const wrap = scrollEl.parentElement;
    const fadeTop = wrap.querySelector('.ov-fade-top');
    const fadeBottom = wrap.querySelector('.ov-fade-bottom');
    const atTop = scrollEl.scrollTop <= 1;
    const atBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 1;
    if (fadeTop) fadeTop.style.opacity = atTop ? '0' : '1';
    if (fadeBottom) fadeBottom.style.opacity = atBottom ? '0' : '1';
  }

  // The invisible corridor connecting a marker to its condensed preview
  // panel, so a mouse crossing the small gap between the two — genuinely
  // empty map, not marker and not panel — doesn't read as "left the
  // hoverable area." Exactly one marker-diameter (2r) wide, running along
  // whichever axis actually separates the two boxes: a horizontal strip
  // centered on the marker's own vertical center when the panel sits to
  // its left or right, or a vertical strip centered on the marker's
  // horizontal center when the panel sits above or below. Returns null if
  // the two boxes already touch/overlap (last-resort placements can land
  // right up against the marker) — no corridor is needed there.
  function computeHoverBridge(anchor, r, panelLeft, panelTop, panelW, panelH) {
    const mLeft = anchor.x - r, mRight = anchor.x + r;
    const mTop = anchor.y - r, mBottom = anchor.y + r;
    const pLeft = panelLeft, pRight = panelLeft + panelW;
    const pTop = panelTop, pBottom = panelTop + panelH;
    if (pLeft >= mRight || pRight <= mLeft) {
      return {
        left: Math.min(mRight, pRight), right: Math.max(mLeft, pLeft),
        top: anchor.y - r, bottom: anchor.y + r
      };
    }
    if (pTop >= mBottom || pBottom <= mTop) {
      return {
        left: anchor.x - r, right: anchor.x + r,
        top: Math.min(mBottom, pBottom), bottom: Math.max(mTop, pTop)
      };
    }
    return null;
  }

  function showOverlay(stadium, marker, pinned) {
    // Two-stage overlay: hovering shows just the condensed header (logo,
    // stadium name, team name); clicking pins it open and swaps in the full
    // info (stars, years, visit history, etc.).
    const html = pinned ? stadium.fullBodyHtml : stadium.condensedHtml;
    const anchor = map.latLngToContainerPoint(marker.getLatLng());
    const mapSize = map.getSize();
    const fit = computeHeaderFit(stadium);

    let left, top, forcedWidth = null, forcedHeight = null, isPhoneDrawer = false, phoneDrawerLandscape = false;
    if (isPhoneFormFactor()) {
      // In practice this is always the pinned case — condensed never
      // shows on a real phone at all (see isPhoneFormFactor's own
      // comment: the hover preview is gated to pointerType 'mouse',
      // which a touch tap never is). The unpinned branch below is a
      // defensive fallback, not a real path.
      if (pinned) {
        isPhoneDrawer = true;
        // Snapshot the map's center from before the FIRST tap in this
        // pinned "session" — see phoneDrawerPreTapCenter's own comment.
        // Deliberately not overwritten on a later call caused by tapping
        // a DIFFERENT marker while one's already pinned, or by a
        // rotation re-running this via repositionPinned.
        if (phoneDrawerPreTapCenter === null) phoneDrawerPreTapCenter = map.getCenter();
        // Only pan if the marker isn't ALREADY comfortably clear of the
        // drawer — "clear" meaning at least PHONE_DRAWER_CLEARANCE px from
        // the drawer's near edge (its top edge in portrait, its left edge
        // in landscape). When a pan IS needed, move the minimum amount to
        // bring it exactly to that clearance, not all the way to the
        // center of the open half — the marker just needs to be visible
        // and unambiguous, not perfectly centered. Single-axis only:
        // vertical in portrait, horizontal in landscape, matching
        // computePlacementPhoneDrawer's own split — the other axis is
        // never touched. Panning by a pixel offset rather than computing
        // a new LatLng directly keeps this exact regardless of projection.
        const landscape = mapSize.x >= mapSize.y;
        phoneDrawerLandscape = landscape;
        let dx = 0, dy = 0;
        if (landscape) {
          const maxX = mapSize.x / 2 - PHONE_DRAWER_CLEARANCE;
          if (anchor.x > maxX) dx = anchor.x - maxX;
        } else {
          const maxY = mapSize.y * (1 - PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION) - PHONE_DRAWER_CLEARANCE;
          if (anchor.y > maxY) dy = anchor.y - maxY;
        }
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
          suppressPinDismissOnMove = true;
          map.panBy([dx, dy], { animate: true, duration: 0.3 });
          map.once('moveend', () => { suppressPinDismissOnMove = false; });
        }
        const placement = computePlacementPhoneDrawer(mapSize);
        left = placement.left;
        top = placement.top;
        forcedWidth = placement.width;
        forcedHeight = placement.height;
        // The drawer doesn't sit next to the marker the way the desktop
        // overlay does, so grow the marker itself to keep the connection
        // between the two obvious — see setPinnedMarkerBoost's own
        // comment. Restored on dismiss (see dismissPinned).
        setPinnedMarkerBoost(stadium.name);
      } else {
        const size = measureBox(html, pinned, stadium);
        const placement = computePlacementSimple(anchor, size.w, size.h, mapSize);
        left = placement.left;
        top = placement.top;
      }
      hoverBridge = null; // hover-leeway only applies on hover-capable desktop/laptop/iPad
    } else {
      // Both sizes are needed regardless of which one is actually being
      // shown right now — see computeStadiumPlacement's own comment for
      // why the placement decision always has to be made from the FULL
      // panel's size, even while only the condensed preview is on screen.
      const fullSize = measureBox(stadium.fullBodyHtml, true, stadium);
      const condensedSize = measureBox(stadium.condensedHtml, false, stadium);
      const r = hitRadiusPx(stadium);
      const plan = computeStadiumPlacement(anchor, r, fullSize, condensedSize, mapSize);
      const chosen = pinned ? plan.full : plan.condensed;
      left = chosen.left;
      top = chosen.top;
      forcedWidth = pinned ? null : chosen.width;
      // Only the condensed (unpinned) preview ever gets dismissed by mouse
      // movement — a pinned panel stays open regardless — so the bridge
      // only needs to exist for that case.
      hoverBridge = pinned ? null : computeHoverBridge(
        anchor, r, left, top,
        forcedWidth != null ? forcedWidth : condensedSize.w,
        condensedSize.h
      );
    }

    overlayEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + (isPhoneDrawer ? ' phone-drawer' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    overlayEl.innerHTML = html + (pinned ? '<button type="button" class="ov-close" aria-label="Close">&times;</button>' : '');
    // Forced only for the condensed preview's left-side placement, or the
    // phone drawer (see computeStadiumPlacement/computePlacementPhoneDrawer)
    // — every other case relies on the CSS default (auto-width for
    // condensed, the fixed pinned width for expanded; auto-height always,
    // except the phone drawer's fixed half-screen height).
    overlayEl.style.width = forcedWidth != null ? forcedWidth + 'px' : '';
    overlayEl.style.height = forcedHeight != null ? forcedHeight + 'px' : '';
    overlayEl.style.left = left + 'px';
    overlayEl.style.top = top + 'px';
    // .expanded is display:flex (pinned header + independently-scrolling
    // body); the condensed hover preview stays a plain block box.
    overlayEl.style.display = pinned ? 'flex' : 'block';
    // Subtle slide+fade entrance for the phone drawer only: rather than
    // animating the drawer's full travel from off-screen, we deliberately
    // only show the LAST 10% of that slide — it starts already 90% of the
    // way to its resting position (translateX/Y(10%), which resolves
    // against the drawer's own width/height, whatever that is for the
    // current portrait/landscape size) and opacity 0, then transitions to
    // translate(0)/opacity 1. Re-applied on every call that opens/updates
    // the drawer (a fresh tap, or switching to a different pinned stadium
    // while it's already open) since each is functionally a fresh
    // appearance. The non-phone-drawer branch explicitly clears these so
    // no stale transform/opacity ever leaks into the desktop overlay.
    if (isPhoneDrawer && !suppressPhoneDrawerEntrance) {
      overlayEl.style.transition = 'none';
      overlayEl.style.opacity = '0';
      overlayEl.style.transform = phoneDrawerLandscape ? 'translateX(10%)' : 'translateY(10%)';
      // Force a reflow so the browser commits the pre-animation state
      // above before transitions are re-enabled — otherwise the two style
      // writes coalesce into one and there's nothing left to animate.
      void overlayEl.offsetHeight;
      overlayEl.style.transition = 'transform 200ms ease-out, opacity 200ms ease-out';
      overlayEl.style.opacity = '1';
      overlayEl.style.transform = phoneDrawerLandscape ? 'translateX(0)' : 'translateY(0)';
    } else if (!isPhoneDrawer) {
      overlayEl.style.transition = '';
      overlayEl.style.opacity = '';
      overlayEl.style.transform = '';
    }
    // else: isPhoneDrawer && suppressPhoneDrawerEntrance — a reposition of
    // an already-open drawer, so deliberately leave transform/opacity/
    // transition untouched and just let the left/top/width/height changes
    // above take effect instantly.
    // applyHeaderFit just assigns the already-computed (pinned-width-based)
    // font-size/letter-spacing values — no live measurement here, so it
    // doesn't matter that this runs on both modes and doesn't need the box
    // laid out first.
    applyHeaderFit(overlayEl, fit);

    // The scrollable body is rebuilt fresh every call (innerHTML above),
    // so its fade state and scroll listener need re-wiring each time too.
    if (pinned) {
      const scrollEl = overlayEl.querySelector('.ov-scroll');
      if (scrollEl) {
        // Inset the fades from the right edge by however wide the actual
        // scrollbar is on this system (0 on systems with overlay
        // scrollbars, ~15-17px on Windows/some Linux) — otherwise the
        // fade paints straight over the scrollbar track, including its
        // clickable up/down arrow buttons where present.
        const scrollbarWidth = scrollEl.offsetWidth - scrollEl.clientWidth;
        const wrap = scrollEl.parentElement;
        const fadeTop = wrap.querySelector('.ov-fade-top');
        const fadeBottom = wrap.querySelector('.ov-fade-bottom');
        if (fadeTop) fadeTop.style.right = scrollbarWidth + 'px';
        if (fadeBottom) fadeBottom.style.right = scrollbarWidth + 'px';
        updateScrollFades(scrollEl);
        scrollEl.addEventListener('scroll', () => updateScrollFades(scrollEl));
      }
    }
  }

  // restoreView defaults to true (deliberate dismissal: the X button, a
  // tap on empty map, or interacting with the filters menu) — pass false
  // only for the "the user is already dragging/zooming away" case (see
  // the movestart/zoomstart listener below), where programmatically
  // panning back to the pre-tap center would fight the gesture already in
  // progress instead of just getting out of its way.
  function dismissPinned(restoreView) {
    if (restoreView === undefined) restoreView = true;
    pinnedStadiumName = null;
    overlayEl.style.display = 'none';
    overlayEl.classList.remove('phone-drawer');
    hoverBridge = null;
    clearPinnedMarkerBoost();
    if (restoreView && phoneDrawerPreTapCenter) {
      const restoreCenter = phoneDrawerPreTapCenter;
      phoneDrawerPreTapCenter = null;
      suppressPinDismissOnMove = true;
      map.panTo(restoreCenter, { animate: true, duration: 0.3 });
      map.once('moveend', () => { suppressPinDismissOnMove = false; });
    } else {
      phoneDrawerPreTapCenter = null;
    }
  }

  // Repositions the pinned overlay to follow its dot after a pan/zoom/
  // resize, rather than dismissing it.
  //
  // Bails out entirely while anything on the page is in native fullscreen
  // (document.fullscreenElement set) — entering fullscreen on an embedded
  // YouTube video fires a viewport resize just like a rotation would, which
  // otherwise reaches this function via scheduleViewRefit and rebuilds the
  // overlay's innerHTML from stadium.fullBodyHtml. That destroys the very
  // <iframe> element that's mid-fullscreen: the browser briefly shows the
  // fullscreen frame, then the DOM node backing it is gone (video vanishes,
  // audio keeps playing from the detached element, and the page's own
  // interactivity is left stuck until Escape is pressed). Skipping the
  // rebuild while fullscreen is active avoids ever touching that DOM node;
  // exiting fullscreen fires its own resize event, so a normal reposition
  // still happens right afterward once currentFullscreenEl() is null again.
  function repositionPinned() {
    if (!pinnedStadiumName) return;
    if (currentFullscreenEl()) return;
    const marker = markerByName[pinnedStadiumName];
    const stadium = stadiumByName[pinnedStadiumName];
    if (marker && stadium) {
      suppressPhoneDrawerEntrance = true;
      showOverlay(stadium, marker, true);
      suppressPhoneDrawerEntrance = false;
    }
  }

  // --- Full-screen photo lightbox ---
  // Deliberately placed outside #map in the markup (see the body), so it
  // can never be mistaken for a map-contained element the way the
  // stadium overlay itself has to guard against below.
  const lightboxEl = document.getElementById('photo-lightbox');
  const lightboxImgEl = document.getElementById('photo-lightbox-img');
  const lightboxCreditEl = document.getElementById('photo-lightbox-credit');
  const lightboxFullscreenBtn = document.getElementById('photo-lightbox-fullscreen-btn');
  // Standard + WebKit-prefixed Fullscreen API, feature-detected once up
  // front. Desktop Chrome/Firefox/Edge/Safari and Android Chrome all
  // support requesting fullscreen on an arbitrary element; iPhone Safari
  // does not (only <video> gets its own native fullscreen there), so the
  // button is simply hidden rather than shown-but-broken.
  const FS_ENTER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  const FS_EXIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  function fullscreenSupported() {
    return !!(lightboxEl.requestFullscreen || lightboxEl.webkitRequestFullscreen);
  }
  function currentFullscreenEl() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  // Fixes an embedded YouTube video's own fullscreen button: the video
  // flashes fullscreen for an instant then goes invisible (audio keeps
  // playing, Escape is needed to get out) even though the Fullscreen API
  // correctly reports it active. Root cause is .stadium-overlay's
  // `overflow: hidden` (for its rounded corners) and .ov-scroll's
  // `overflow-y: auto; max-height: 50vh` (for the scrolling body) — Chrome
  // and Safari don't reliably promote a fullscreened CROSS-ORIGIN iframe
  // out of an ancestor's overflow-clip region, so it keeps getting clipped
  // to that ancestor's box even while "fullscreen". Toggling a class that
  // neutralizes both ancestors' clipping for exactly as long as something
  // inside the overlay is actually fullscreen sidesteps the bug without
  // touching their normal (non-fullscreen) behavior at all.
  function updateOverlayFullscreenClipping() {
    const fsEl = currentFullscreenEl();
    overlayEl.classList.toggle('has-fullscreen-descendant', !!(fsEl && overlayEl.contains(fsEl)));
  }
  document.addEventListener('fullscreenchange', updateOverlayFullscreenClipping);
  document.addEventListener('webkitfullscreenchange', updateOverlayFullscreenClipping);
  function requestLightboxFullscreen() {
    if (lightboxEl.requestFullscreen) return lightboxEl.requestFullscreen();
    if (lightboxEl.webkitRequestFullscreen) return lightboxEl.webkitRequestFullscreen();
  }
  function exitFullscreen() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  }
  function updateFullscreenBtnState() {
    const active = currentFullscreenEl() === lightboxEl;
    lightboxFullscreenBtn.innerHTML = active ? FS_EXIT_ICON : FS_ENTER_ICON;
    lightboxFullscreenBtn.setAttribute('aria-label', active ? 'Exit full screen' : 'Full screen');
  }
  if (fullscreenSupported()) {
    updateFullscreenBtnState();
    lightboxFullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFullscreenEl() === lightboxEl) {
        exitFullscreen();
      } else {
        requestLightboxFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenBtnState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnState);
  } else {
    lightboxFullscreenBtn.style.display = 'none';
  }
  // The caption/credit box is explicitly pinned, in JS, to the photo's own
  // *rendered* width (rather than trusting CSS intrinsic sizing) so that a
  // long caption can never inflate the box wider than the image itself —
  // that mismatch previously showed up as a stray semi-transparent
  // (box-shadow) rectangle wider than the photo on long-caption photos.
  function syncLightboxCreditWidth() {
    if (lightboxImgEl.offsetWidth) {
      lightboxCreditEl.style.width = lightboxImgEl.offsetWidth + 'px';
    }
  }
  function openLightbox(photo, kind) {
    lightboxImgEl.src = photo.url;
    lightboxCreditEl.innerHTML = kind === 'personal'
      ? (photo.caption || '')
      : (photo.credit ? `Photo: <a href="${photo.creditUrl}" target="_blank" rel="noopener">${photo.credit}</a>` : '');
    lightboxCreditEl.style.width = '';
    lightboxEl.style.display = 'flex';
    lightboxImgEl.onload = syncLightboxCreditWidth;
    if (lightboxImgEl.complete) syncLightboxCreditWidth();
    window.addEventListener('resize', syncLightboxCreditWidth);
  }
  function closeLightbox() {
    if (fullscreenSupported() && currentFullscreenEl() === lightboxEl) exitFullscreen();
    lightboxEl.style.display = 'none';
    lightboxImgEl.src = '';
    window.removeEventListener('resize', syncLightboxCreditWidth);
  }
  // Closes on a click anywhere on the dark backdrop or the close button,
  // but not on the image or credit/caption themselves (children of the
  // backdrop too, so excluded explicitly).
  lightboxEl.addEventListener('click', (e) => {
    if (e.target === lightboxEl || e.target.closest('.photo-lightbox-close')) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightboxEl.style.display !== 'none') closeLightbox();
  });

  overlayEl.addEventListener('click', (e) => {
    e.stopPropagation(); // clicking inside the overlay must not bubble to the map
    if (e.target.closest('.ov-close')) { dismissPinned(); return; }
    const photoEl = e.target.closest('.ov-photo');
    // lastDragMoved (tracked below) tells a genuine click-to-expand apart
    // from the mouseup at the end of a click-and-drag scroll gesture that
    // happened to end up over a photo — only the former should open it.
    if (photoEl && !lastDragMoved) {
      const stadium = stadiumByName[pinnedStadiumName];
      const kind = photoEl.dataset.photoKind;
      const idx = Number(photoEl.dataset.photoIdx);
      const list = stadium && (kind === 'personal' ? stadium.personalPhotos : stadium.photos);
      if (list && list[idx]) openLightbox(list[idx], kind);
      return;
    }
    // Not pinned yet means this is still just the condensed hover preview
    // — clicking IT should pin/expand exactly like clicking its marker
    // does, so the panel itself is as much a click target as the dot.
    if (!pinnedStadiumName && hoveredStadiumName) {
      const stadium = stadiumByName[hoveredStadiumName];
      const marker = markerByName[hoveredStadiumName];
      if (stadium && marker) {
        pinnedStadiumName = hoveredStadiumName;
        showOverlay(stadium, marker, true);
      }
    }
  });

  // Leaflet's own map-drag and scroll-wheel-zoom handlers listen on the
  // map container, which the overlay lives inside — so without stopping
  // these here too, a mousedown/touchstart/wheel that starts on the
  // overlay (e.g. trying to drag-scroll its content) bubbles up and
  // Leaflet treats it as "start panning/zooming the map," which then
  // dismisses the overlay via the movestart/zoomstart listener below.
  // Stopping them at the source is what lets the overlay's own scrolling
  // work at all, and keeps outside interactions (actually dragging the
  // map) still panning — and dismissing — normally.
  overlayEl.addEventListener('wheel', (e) => { e.stopPropagation(); });
  overlayEl.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });

  // Click-and-drag-to-scroll with the mouse: browsers only do this
  // natively for touch, so the mouse version is hand-rolled — track the
  // pointer's Y on mousedown, adjust .ov-scroll's scrollTop by the delta
  // on every subsequent mousemove, and stop on mouseup. Listening on
  // window (not just the overlay) for move/up means the drag keeps
  // tracking correctly even if the cursor slips outside the overlay's
  // bounds mid-drag. The "moved" flag (surfaced as lastDragMoved on
  // mouseup) is what lets the click handler above tell a real click on a
  // photo apart from a drag-to-scroll that ends on top of one.
  let scrollDrag = null;
  let lastDragMoved = false;
  overlayEl.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    const scrollEl = e.target.closest('.ov-scroll');
    if (!scrollEl || e.target.closest('a, button')) return;
    scrollDrag = { scrollEl, startY: e.clientY, startScrollTop: scrollEl.scrollTop, moved: false };
    scrollEl.classList.add('ov-dragging');
    e.preventDefault(); // avoid native text selection while dragging
  });
  window.addEventListener('mousemove', (e) => {
    if (!scrollDrag) return;
    const dy = e.clientY - scrollDrag.startY;
    if (Math.abs(dy) > 3) scrollDrag.moved = true;
    scrollDrag.scrollEl.scrollTop = scrollDrag.startScrollTop - dy;
  });
  window.addEventListener('mouseup', () => {
    if (!scrollDrag) return;
    lastDragMoved = scrollDrag.moved;
    scrollDrag.scrollEl.classList.remove('ov-dragging');
    scrollDrag = null;
  });

  // Dismiss the pinned overlay on any interaction with the filters menu
  // (checkbox clicks, "show all" toggles, the collapse button, or clicking
  // a filter row).
  const filtersPanelEl = document.getElementById('filters-panel');
  filtersPanelEl.addEventListener('click', () => { if (pinnedStadiumName) dismissPinned(); });
  filtersPanelEl.addEventListener('change', () => { if (pinnedStadiumName) dismissPinned(); });

  // Any pan or zoom dismisses the overlay outright (pinned or not) — EXCEPT
  // when we're the ones driving that pan/zoom ourselves (the phone
  // drawer's marker-centering pan, or its dismiss-time restore pan; see
  // suppressPinDismissOnMove). And when it IS a real user gesture, don't
  // restore the phone drawer's pre-tap view on top of it — they're already
  // navigating somewhere else on purpose, so just get out of the way
  // (restoreView: false).
  map.on('movestart zoomstart', () => {
    if (!suppressPinDismissOnMove) dismissPinned(false);
  });

  stadiums.forEach(s => {
    const style = STYLES[s.category];
    // Current stadiums (visited or not) render as their team logo inside a
    // bordered white circle. Demolished stadiums — both former-visited and
    // historic-demolished — get a plain dot with a small white center dot,
    // to distinguish them from their "still exists" counterparts, which
    // otherwise share the same fill color. Everything else is a plain dot
    // (dotIcon) — a divIcon like the other two, not a raw circleMarker;
    // see dotIcon's own comment for why that switch mattered.
    const isCurrent = s.category === 'current_visited' || s.category === 'current_not_visited';
    const isDemolished = s.category === 'former_demolished' || s.category === 'historic_demolished';
    const currentLogoSrc = s.logoUrl || `https://www.mlbstatic.com/team-logos/${s.teamId}.svg`;
    // Historic (not-visited) dots get a dark-green border — the same
    // hunter green used for former-visited dots — to tie the two "former
    // stadium" categories together visually while keeping the lighter sage
    // fill that sets this one apart. Both demolished and still-exists dots
    // share this same border-color rule.
    const dotBorderColor = s.category === 'historic_not_visited' || s.category === 'historic_demolished'
      ? STYLES.former_exists.color
      : style.color;
    const dotWeight = s.category === 'historic_not_visited' ? 1 : 1.5;
    const marker = isCurrent
      ? L.marker([s.lat, s.lon], { pane: 'pane-' + s.category, icon: logoIcon(style.color, currentLogoSrc, s.rating) })
      : isDemolished
        ? L.marker([s.lat, s.lon], {
            pane: 'pane-' + s.category,
            icon: demolishedDotIcon(style.color, dotBorderColor)
          })
        : L.marker([s.lat, s.lon], {
            pane: 'pane-' + s.category,
            icon: dotIcon(style.color, dotBorderColor, dotWeight, MARKER_RADIUS)
          });

    // Track every marker so its size can be re-evaluated on zoom/viewport
    // changes — see updateGrowingMarkerSizes. Former/historic/future dots
    // grow on every device; team-logo markers only actually change size
    // on mobile (logoDiameterForZoom returns the fixed LOGO_ICON_SIZE on
    // desktop/tablet, so the regenerated icon there is a no-op). name is
    // used to look up whether THIS marker is the one currently boosted by
    // the phone drawer (see pinnedBoostMarkerName).
    growingMarkers.push(isCurrent
      ? { marker, name: s.name, kind: 'logo', color: style.color, logoSrc: currentLogoSrc, rating: s.rating }
      : isDemolished
        ? { marker, name: s.name, kind: 'demolished', fillColor: style.color, borderColor: dotBorderColor }
        : { marker, name: s.name, kind: 'dot', fillColor: style.color, borderColor: dotBorderColor, weight: dotWeight });

    {
      // Green Monster overlay content — one unified builder for every
      // category. Historic entries (no teamId) simply omit the logo chip
      // and the personal-visit fields (rating/ranking/games/milestones),
      // which fall away naturally since those data fields are absent.
      const hasTeamId = !!s.teamId;
      const logoSrc = s.logoUrl || (hasTeamId ? `https://www.mlbstatic.com/team-logos/${s.teamId}.svg` : null);
      // logoChipBg: optional per-stadium override for the chip's backing
      // color. A few historic logo images already have their own white
      // rectangular background baked in, which clashes against the chip's
      // default cream backing (visible seam/edge) — those entries set
      // logoChipBg: "#fff" so the chip matches the image's own background.
      const chipBgStyle = s.logoChipBg ? ` style="background:${s.logoChipBg}"` : '';
      const logoChipHtml = logoSrc
        ? `<div class="b-logo-chip"${chipBgStyle}><img src="${logoSrc}" onerror="this.style.display='none'"></div>`
        : '';
      const headerHtml =
        `<div class="b-name-band">
           ${logoChipHtml}
           <div class="b-name-stack">
             <div class="b-name">${s.displayName || s.name}</div>
             <div class="b-team">${teamLineHtml(s)}</div>
           </div>
         </div>`;

      const visited = s.gamesAttended != null;
      // A not-yet-visited stadium I actually expect to get to (current or
      // future-planned) gets a third metadata row noting when; a purely
      // historical reference entry (never on my list to visit) does not.
      const showNextVisit = !visited && (s.category === 'current_not_visited' || s.category === 'future_planned');
      const nextVisitLine = showNextVisit
        ? `<div class="b-meta-row"><span class="fs2">${
            s.projectedOpening
              ? `Projected opening: <span class="hl">${s.projectedOpening}</span>`
              : `Next visit: <span class="hl">${s.firstVisited || 'TBD'}</span>`
          }</span></div>`
        : '';
      // Section 1: city + star rating (top row, baseline-aligned), the
      // building's own built-through-demolished years + ranking phrase
      // (bottom row) — ranking omitted when there isn't one.
      const section1 =
        `<div class="b-slot">
           <div class="b-meta-row">
             <span class="fs1">${categoryStatusLabel(s.category)}&nbsp;MLB&nbsp;ballpark in&nbsp;${s.city.replace(/ /g, '&nbsp;')},&nbsp;${s.state}</span>
             <span class="b-stars">${s.rating ? starsHtml(s.rating) : ''}</span>
           </div>
           <div class="b-meta-row">
             <span class="fs2">${buildingYears(s)}</span>
             <span class="fs2">${s.ranking ? `My <span class="hl">#${s.ranking}</span> Stadium` : ''}</span>
           </div>
           ${nextVisitLine}
         </div>`;

      // Section 2: MLB years (one line per team that's called this stadium
      // home) combined with Formerly (or, for historic entries, Also
      // Known As) into one module.
      const altNames = stripYearsFromAltNames(s.formerNames || s.akaNames);
      const altLabel = s.formerNames ? 'Formerly' : 'Also Known As';
      const altBlock = altNames
        ? `<div class="b-formerly-block"><div class="b-slot-label">${altLabel}</div><div class="fs1">${altNames}</div></div>`
        : '';
      const tenants = getTenants(s);
      // A not-yet-built future_planned stadium has neither an MLB-years
      // history nor a former name yet, so the whole module is omitted.
      const section2 = (tenants.length || altNames)
        ? `<div class="b-slot">
             ${tenants.length ? `<div class="b-slot-label">MLB Years</div>
             <div class="b-tenant-list">
               ${tenants.map(t => `<div class="b-tenant-line"><span class="fs1">${t.years}</span><span class="fs2">${t.team}</span></div>`).join('')}
             </div>` : ''}
             ${altBlock}
           </div>`
        : '';

      // Then, in order: public photos, commentary (visit sentences +
      // personal notes combined), personal photos — each only if present.
      const publicPhotos = buildPublicPhotosHtml(s);
      const publicPhotosHtml = publicPhotos ? `<div class="b-section-gap">${publicPhotos}</div>` : '';

      const video = buildVideoHtml(s);
      const videoHtml = video ? `<div class="b-section-gap">${video}</div>` : '';

      const commentaryParas = commentaryParagraphs(s);
      const commentaryHtml = commentaryParas.length
        ? `<div class="b-commentary b-section-gap">${commentaryParas.map(p => `<p>${p}</p>`).join('')}</div>`
        : '';

      const personalPhotos = buildPersonalPhotosHtml(s);
      const personalPhotosHtml = personalPhotos ? `<div class="b-section-gap">${personalPhotos}</div>` : '';

      const scrollBodyHtml =
        `<div class="b-meta-stack">${section1}${section2}</div>`
        + publicPhotosHtml + videoHtml + commentaryHtml + personalPhotosHtml;

      s.fullBodyHtml =
        `<div class="ov-pinned-header">${headerHtml}</div>
         <div class="ov-scroll-wrap">
           <div class="ov-scroll">${scrollBodyHtml}</div>
           <div class="ov-fade-top"></div>
           <div class="ov-fade-bottom"></div>
         </div>`;

      // Condensed hover preview: just the header band (logo, stadium name,
      // team name) — the rest is what click-to-expand is for.
      s.condensedHtml = headerHtml;
    }

    // Hover/click interactivity for every marker is handled by one global
    // hit-test below (see "Unified hover/click hit-testing"), not by
    // per-marker listeners — see that comment for why.
    marker.addTo(map);

    markersByCategory[s.category].push(marker);
    markerByName[s.name] = marker;
    stadiumByName[s.name] = s;
  });

  // Sync every marker to the correct size for the initial view (a no-op
  // for dots at the true default zoom, and a no-op for logo markers on
  // desktop/tablet — but harmless/correct to call either way).
  updateGrowingMarkerSizes();

  // Keeps every stadium marker (and, via resolveStateLabelOverlaps further
  // down, every state label) drawn on whichever copy of the world is
  // nearest the current view, so panning indefinitely east/west always has
  // North America — and its stadiums — right there rather than only ever
  // at their one true longitude. Bound to 'move' rather than 'moveend' so
  // this tracks live WHILE dragging, not just once you release, per the
  // "stadiums need to be there as I pan" requirement. Cheap to call on
  // every move frame: it's a no-op unless the rounded world count has
  // actually changed, which only happens once the view has panned roughly
  // 180° past whatever the last reference point was.
  const worldOffsetBaseLng = stadiumBounds.getCenter().lng;
  function updateWorldOffset() {
    const worldsAway = Math.round((map.getCenter().lng - worldOffsetBaseLng) / 360);
    const newOffset = worldsAway * 360;
    if (newOffset === worldOffsetDeg) return;
    worldOffsetDeg = newOffset;
    stadiums.forEach(s => {
      const m = markerByName[s.name];
      if (m) m.setLatLng([s.lat, s.lon + worldOffsetDeg]);
    });
    resolveStateLabelOverlaps();
  }
  map.on('move', updateWorldOffset);

  // --- Unified hover/click hit-testing ---
  // Every marker type (team-logo circle, plain dot, demolished dot) used to
  // wire its own mouseover/mouseout/click, relying on the browser's DOM
  // hit-testing to decide which marker the cursor is over. That broke down
  // whenever two markers' bounding boxes overlapped — e.g. a 5-star team
  // logo's large icon box (needed for the star badge) sitting on top of a
  // smaller, nearby former-stadium dot (Petco Park / Qualcomm Stadium in
  // San Diego is a real example): the logo marker's own transparent space
  // would swallow the hover intended for the dot underneath, no matter how
  // its own hit-radius check was written, because that check only governs
  // what the logo marker itself does — it can't hand the event to a
  // completely different DOM element. CSS pointer-events tricks to let
  // events "pass through" to whatever's underneath were tried and proved
  // unreliable across cases.
  //
  // Instead, this ignores DOM hit-testing (and therefore z-order/stacking)
  // entirely: one mousemove/click listener on the map itself computes the
  // real on-screen distance from the cursor to every visible stadium's
  // true center, and picks whichever stadium's own circle (its actual
  // visual radius, never the larger box around a star badge) the cursor is
  // genuinely inside — closest one wins if more than one circle overlaps
  // at that point. This is pure geometry, so it's correct regardless of
  // which marker happens to be painted on top of which.
  function hitRadiusPx(s) {
    // Logo markers (current stadiums) are a fixed size on desktop/tablet,
    // so their hit radius is fixed there too — but on mobile they grow
    // with zoom just like every other dot (see logoDiameterForZoom), so
    // the hit radius has to track that growth on both fronts, or the
    // clickable/hoverable area stays stuck at the tiny default-zoom size
    // while the marker visibly grows past it.
    if (isLogoIconActive(s)) return logoDiameterForZoom(map.getZoom()) / 2 - 2.5;
    return dotRadiusForZoom(map.getZoom());
  }

  function findHoveredStadium(clientX, clientY) {
    const mapRect = map.getContainer().getBoundingClientRect();
    let best = null, bestDist = Infinity;
    for (const s of stadiums) {
      const marker = markerByName[s.name];
      if (!marker || !map.hasLayer(marker)) continue;
      const pt = map.latLngToContainerPoint(marker.getLatLng());
      const dx = clientX - (mapRect.left + pt.x);
      const dy = clientY - (mapRect.top + pt.y);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= hitRadiusPx(s) && dist < bestDist) {
        best = s;
        bestDist = dist;
      }
    }
    return best;
  }

  let hoveredStadiumName = null;
  const mapContainerEl = map.getContainer();

  // Hover preview only makes sense for an input that can genuinely hover
  // (a real mouse or trackpad) — not a finger tap, which has no hover
  // state at all and would otherwise flash the condensed preview open
  // right as (or just after) the tap's click pins the full overlay open.
  //
  // Checked per-event via the Pointer Events API's pointerType, rather
  // than once via the CSS (hover: hover)/(pointer: fine) media features —
  // those are unreliable on iPadOS specifically: a connected Bluetooth
  // trackpad doesn't consistently flip them to true the way a laptop's
  // built-in trackpad does. pointerType is the signal that actually holds
  // up across cases: 'mouse' for both a real desktop mouse AND an iPad's
  // trackpad-driven cursor, 'touch' for a finger, 'pen' for Apple Pencil.
  // Using pointermove/pointerleave (instead of mousemove/mouseleave) with
  // this per-event check means: a finger tap never triggers hover at all
  // (goes straight through the click handler below to the full pinned
  // overlay), while moving an iPad's trackpad cursor gets the exact same
  // hover-then-click behavior as a laptop, with no separate device
  // detection needed.
  // True if the cursor is either directly over the condensed preview's own
  // DOM box, or inside the invisible hoverBridge corridor connecting it to
  // its marker (see computeHoverBridge) — the two places a mouse can be
  // while genuinely on its way from one to the other without having
  // "left" the hoverable area.
  function isInHoverLeewayZone(clientX, clientY) {
    const rect = overlayEl.getBoundingClientRect();
    if (overlayEl.style.display !== 'none' &&
        clientX >= rect.left && clientX <= rect.right &&
        clientY >= rect.top && clientY <= rect.bottom) {
      return true;
    }
    if (hoverBridge) {
      const mapRect = mapContainerEl.getBoundingClientRect();
      const x = clientX - mapRect.left, y = clientY - mapRect.top;
      if (x >= hoverBridge.left && x <= hoverBridge.right &&
          y >= hoverBridge.top && y <= hoverBridge.bottom) {
        return true;
      }
    }
    return false;
  }

  mapContainerEl.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    // Checked FIRST, before even looking for a new marker under the
    // cursor: if a condensed preview is up and the cursor is still inside
    // its leeway zone (its own panel, or the bridge corridor to its
    // marker), stay locked onto it — full stop — even if some OTHER
    // marker's hit-circle also geometrically covers that exact point. A
    // marker sitting visually behind the hovered one (partially obscured
    // by it, e.g. the demolished former Busch Stadium marker sitting
    // right behind — and partly under — the current Busch Stadium
    // marker) can end up positioned right in that gap; without this check
    // running first, passing through its hit-circle on the way to the
    // panel would hijack the hover mid-transit. Deliberately no attempt
    // to distinguish "just passing through" from "actually wants to
    // hover that other marker now" — the leeway zone is narrow, and this
    // is simpler and more predictable than z-order tricks.
    if (hoveredStadiumName && !pinnedStadiumName && isInHoverLeewayZone(e.clientX, e.clientY)) {
      return;
    }
    const hit = findHoveredStadium(e.clientX, e.clientY);
    if (hit) {
      if (hit.name === hoveredStadiumName) return;
      hoveredStadiumName = hit.name;
      debouncedShowOverlay(hit, markerByName[hit.name]);
      return;
    }
    if (hoveredStadiumName) {
      hoveredStadiumName = null;
      debouncedHideOverlay();
    }
  });
  mapContainerEl.addEventListener('pointerleave', (e) => {
    if (e.pointerType !== 'mouse') return;
    if (hoveredStadiumName) {
      hoveredStadiumName = null;
      debouncedHideOverlay();
    }
  });
  mapContainerEl.addEventListener('click', (e) => {
    // Let Leaflet's own controls (zoom buttons, reset view) work normally.
    if (e.target.closest('.leaflet-control-container')) return;
    const hit = findHoveredStadium(e.clientX, e.clientY);
    if (hit) {
      // Always goes straight to the full pinned overlay — on a hover-
      // capable device this replaces whatever condensed preview was
      // already showing; on touch, this is the ONLY overlay a tap ever
      // shows, since the mousemove handler above is a no-op there.
      pinnedStadiumName = hit.name;
      showOverlay(hit, markerByName[hit.name], true);
    } else if (pinnedStadiumName) {
      // Clicks on the overlay itself never reach here (it stops
      // propagation), so any other click on the map — empty water, land,
      // another part of the basemap — means "outside the overlay": close it.
      dismissPinned();
    }
  });

  // --- Combined filtering: a stadium is shown when its category checkbox is
  // on AND (no people filter is active, or at least one checked person was
  // there) AND (no ratings filter is active, or its rating is checked).
  // Each "Show all" is a bulk toggle for its section and reflects the
  // section's aggregate state (checked / unchecked / indeterminate).
  const PEOPLE = ["jessie", "andrew", "fender", "howard", "jim", "rob", "kim", "serena", "heather"];
  const RATINGS = [5, 4, 3, 2, 1];

  // Show a live "(count)" next to each People/Ratings filter item — the
  // number of stadiums that match — computed straight from the data so it
  // always stays accurate.
  PEOPLE.forEach(p => {
    const count = stadiums.filter(s => s.people && s.people.includes(p)).length;
    const el = document.querySelector(`.filter-count[data-person="${p}"]`);
    if (el) el.textContent = `(${count})`;
  });
  RATINGS.forEach(r => {
    const count = stadiums.filter(s => s.rating === r).length;
    const el = document.querySelector(`.filter-count[data-rating="${r}"]`);
    if (el) el.textContent = `(${count})`;
  });

  const categoryCheckboxes = {};
  Object.keys(markersByCategory).forEach(cat => {
    categoryCheckboxes[cat] = document.getElementById('cb-' + cat);
  });
  const peopleAllCb = document.getElementById('cb-people-all');
  const personCheckboxes = {};
  PEOPLE.forEach(p => { personCheckboxes[p] = document.getElementById('cb-person-' + p); });

  const ratingsAllCb = document.getElementById('cb-ratings-all');
  const ratingCheckboxes = {};
  RATINGS.forEach(r => { ratingCheckboxes[r] = document.getElementById('cb-rating-' + r); });

  function updateVisibility() {
    if (roadTripModeActive) {
      // All-or-nothing mode: category/people/rating filters are irrelevant
      // while the 2007 Road Trip layer is on — only its fixed stadium list
      // is shown, everything else is hidden.
      stadiums.forEach(s => {
        const marker = markerByName[s.name];
        if (activeRoadTripStadiumNames.has(s.name)) { marker.addTo(map); } else { map.removeLayer(marker); }
      });
      // Whichever stadiums are now on/off the map changes who's eligible
      // to collide, so re-settle nudged positions (see resolveOverlaps).
      resolveOverlaps();
      return;
    }
    const selectedPeople = new Set(PEOPLE.filter(p => personCheckboxes[p].checked));
    const peopleFilterActive = selectedPeople.size < PEOPLE.length;

    const selectedRatings = new Set(RATINGS.filter(r => ratingCheckboxes[r].checked));
    const ratingsFilterActive = selectedRatings.size < RATINGS.length;

    stadiums.forEach(s => {
      const marker = markerByName[s.name];
      const categoryOn = categoryCheckboxes[s.category].checked;
      let show = categoryOn;
      if (categoryOn && (s.category === 'historic_not_visited' || s.category === 'historic_demolished')) {
        // The historic layer has no personal visit/rating data, so ratings
        // don't apply to it — but since narrowing to specific people implies
        // "stadiums those people visited," it only makes sense to show these
        // never-visited stadiums when the People filter is showing everyone.
        show = !peopleFilterActive;
      } else if (categoryOn) {
        const peopleOk = !peopleFilterActive || s.people.some(p => selectedPeople.has(p));
        const ratingOk = !ratingsFilterActive || (s.rating != null && selectedRatings.has(s.rating));
        show = peopleOk && ratingOk;
      }
      if (show) { marker.addTo(map); } else { map.removeLayer(marker); }
    });
    // Whichever stadiums are now on/off the map changes who's eligible to
    // collide, so re-settle nudged positions (see resolveOverlaps) — e.g.
    // a former stadium nudged aside by a current one snaps back to its
    // exact spot once that current stadium's layer is filtered off.
    resolveOverlaps();
  }

  function updateShowAllState() {
    const checkedCount = PEOPLE.filter(p => personCheckboxes[p].checked).length;
    peopleAllCb.checked = checkedCount === PEOPLE.length;
    peopleAllCb.indeterminate = checkedCount > 0 && checkedCount < PEOPLE.length;
  }

  function updateRatingsAllState() {
    const checkedCount = RATINGS.filter(r => ratingCheckboxes[r].checked).length;
    ratingsAllCb.checked = checkedCount === RATINGS.length;
    ratingsAllCb.indeterminate = checkedCount > 0 && checkedCount < RATINGS.length;
  }

  Object.values(categoryCheckboxes).forEach(cb => cb.addEventListener('change', updateVisibility));

  PEOPLE.forEach(p => {
    personCheckboxes[p].addEventListener('change', () => {
      updateShowAllState();
      updateVisibility();
    });
  });

  peopleAllCb.addEventListener('change', () => {
    const checked = peopleAllCb.checked;
    PEOPLE.forEach(p => { personCheckboxes[p].checked = checked; });
    peopleAllCb.indeterminate = false;
    updateVisibility();
  });

  RATINGS.forEach(r => {
    ratingCheckboxes[r].addEventListener('change', () => {
      updateRatingsAllState();
      updateVisibility();
    });
  });

  ratingsAllCb.addEventListener('change', () => {
    const checked = ratingsAllCb.checked;
    RATINGS.forEach(r => { ratingCheckboxes[r].checked = checked; });
    ratingsAllCb.indeterminate = false;
    updateVisibility();
  });

  // Sync initial visibility with the checkbox states above (the historic
  // layer starts unchecked even though its markers were added to the map).
  updateVisibility();

  // Streets & highways basemap toggle — swaps the clean, label-free tile
  // layer for CARTO Voyager (roads, highways, place labels), off by default.
  const HISTORIC_DEFAULT_COLOR = STYLES.historic_not_visited.color;
  const HISTORIC_VOYAGER_COLOR = '#a9d1a9'; // same light green as the default — no swap needed, kept for symmetry
  document.getElementById('cb-basemap-voyager').addEventListener('change', (e) => {
    const historicColor = e.target.checked ? HISTORIC_VOYAGER_COLOR : HISTORIC_DEFAULT_COLOR;
    // Both historic subsets (still-exists circleMarkers and demolished
    // icon-based markers, now separate filter categories) share the same
    // fill color and swap together.
    [...markersByCategory.historic_not_visited, ...markersByCategory.historic_demolished].forEach(marker => {
      // Border stays the fixed dark-green outline; only the fill swaps.
      // Demolished entries are icon-based markers (white center dot), so
      // they need a regenerated icon rather than setStyle (which only
      // exists on circleMarker-based "still exists" entries).
      if (marker.setIcon) {
        marker.setIcon(demolishedDotIcon(historicColor, STYLES.former_exists.color));
      } else {
        marker.setStyle({ fillColor: historicColor });
      }
    });
    document.getElementById('swatch-historic_not_visited').style.background = historicColor;
    document.getElementById('swatch-historic_demolished').style.background =
      `radial-gradient(circle, #fff 0 22%, ${historicColor} 22% 100%)`;
    if (e.target.checked) {
      map.removeLayer(lightBaseLayer);
      voyagerBaseLayer.addTo(map);
      // Voyager already labels states/provinces itself, so hide our own
      // state-name labels to avoid duplicating them.
      map.getPane('pane-state-labels').style.display = 'none';
    } else {
      map.removeLayer(voyagerBaseLayer);
      lightBaseLayer.addTo(map);
      map.getPane('pane-state-labels').style.display = '';
    }
  });

  // --- Road trips: all-or-nothing mode ---
  // Turning any one trip on replaces every other filter selection with a
  // fixed view (that trip's route + its specific stadium list) and screens
  // the rest of the filters menu behind an opaque scrim so nothing else can
  // be toggled while a trip is active. The only interactions still allowed
  // in the filters menu are picking a different trip (switches instantly,
  // no need to deselect first) or unchecking the active trip, which
  // restores exactly the filter selections that were in place beforehand.
  const filtersScrimEl = document.getElementById('filters-scrim');
  const voyagerCb = document.getElementById('cb-basemap-voyager');
  let savedFilterState = null;
  let activeTripId = null;
  const roadTripCheckboxes = {};

  function snapshotFilterState() {
    const state = { categories: {}, people: {}, ratings: {}, voyager: voyagerCb.checked };
    Object.keys(categoryCheckboxes).forEach(cat => { state.categories[cat] = categoryCheckboxes[cat].checked; });
    PEOPLE.forEach(p => { state.people[p] = personCheckboxes[p].checked; });
    RATINGS.forEach(r => { state.ratings[r] = ratingCheckboxes[r].checked; });
    return state;
  }

  function restoreFilterState(state) {
    Object.keys(state.categories).forEach(cat => { categoryCheckboxes[cat].checked = state.categories[cat]; });
    PEOPLE.forEach(p => { personCheckboxes[p].checked = state.people[p]; });
    RATINGS.forEach(r => { ratingCheckboxes[r].checked = state.ratings[r]; });
    updateShowAllState();
    updateRatingsAllState();
    if (voyagerCb.checked !== state.voyager) {
      voyagerCb.checked = state.voyager;
      voyagerCb.dispatchEvent(new Event('change'));
    }
  }

  // Shows a trip's route + stadiums and applies its logo overrides.
  // updateVisibility() must run BEFORE the overrides: it operates on
  // whatever markerByName currently points to (the originals), and the
  // overrides then swap those pointers to temporary logo markers.
  // Bumped on every activate/deactivate so any pending moveend listener,
  // setTimeout, or in-flight rAF loop from a superseded trip can recognize
  // it's stale and bail out instead of drawing on top of whatever trip is
  // active now.
  let roadTripAnimationToken = 0;
  function activateTrip(trip) {
    const token = ++roadTripAnimationToken;
    roadTripModeActive = true;
    activeRoadTripStadiumNames = trip.stadiumNames;
    activeRoadTripLogoOverrideNames = trip.logoOverrideNames;
    updateVisibility();
    // updateVisibility() just added every stop's marker (even the
    // "current" ones, like Fenway or T-Mobile, that are normally always
    // shown) — immediately hide them all again so animateTripDraw can pop
    // each one in fresh as the drawn route actually reaches it. This is
    // synchronous with no render in between, so it isn't a visible flash.
    const stopNames = new Set(trip.stops.map(s => s.name));
    stopNames.forEach(name => {
      const marker = markerByName[name];
      if (marker && map.hasLayer(marker)) map.removeLayer(marker);
    });
    // Recenter/re-zoom to fit the whole route right away — trip.bounds is
    // computed from trip.coords directly (not trip.layer.getBounds()),
    // since the layer itself is about to be reset to empty and drawn in
    // progressively below, so its own bounds aren't usable yet. The draw-in
    // animation itself doesn't start until this camera move fully settles
    // (moveend) plus one extra beat — starting it immediately used to run
    // the line-drawing and the camera's pan/zoom at the same time, so the
    // first sliver of drawn line would visibly swing/stretch across the
    // screen as the camera moved, before either had really begun in a way
    // that read as intentional.
    flyToTripBounds(trip.bounds, Object.assign({ duration: 1 }, viewportFitPadding()));
    map.once('moveend', () => {
      if (token !== roadTripAnimationToken) return;
      setTimeout(() => {
        if (token !== roadTripAnimationToken) return;
        animateTripDraw(trip, token);
      }, 1000);
    });
  }

  // Makes a stop's marker visible (creating the temporary logo-override
  // marker if this stop needs one, or just re-adding the normal marker
  // that activateTrip hid), pops it in with the stadiumPop animation, and
  // re-runs the same collision-avoidance pass the base map uses so a
  // freshly-popped marker doesn't land stacked on top of one already shown.
  function revealStop(trip, name) {
    if (trip.logoOverrideNames.has(name)) {
      applyLogoOverride(name);
    } else {
      const marker = markerByName[name];
      if (marker && !map.hasLayer(marker)) marker.addTo(map);
    }
    popStadiumIcon(name);
    resolveOverlaps();
  }

  // Draws a trip's route progressively, like it's being sketched onto the
  // map in real time, and "pops" each stop's stadium icon in the moment
  // the drawn line actually reaches it — rather than dumping the whole
  // polyline and every stop's marker on screen at once. Paced by real-world
  // distance (see ROAD_TRIP_PACE_MS_PER_KM above) so the 2002 trip always
  // takes ~2.5s and the longer trips take proportionally longer, not the
  // same fixed duration regardless of length.
  //
  // trip.deferredNames (2002's Fenway Park, 2007's T-Mobile Park) covers
  // the trips that start and end at the same home stadium: rather than pop
  // it in at the very first stop (indistinguishable from just always being
  // visible), it stays hidden through every earlier occurrence and only
  // pops in at its last one — the "arriving home" moment.
  function animateTripDraw(trip, token) {
    trip.layer.setLatLngs([]);
    trip.layer.addTo(map);
    const total = trip.coords.length;
    const lengthKm = trip.lengthKm;
    const cumKm = trip.cumKm;
    const deferred = trip.deferredNames || new Set();
    const lastStopIdxForName = {};
    trip.stops.forEach((s, i) => { if (deferred.has(s.name)) lastStopIdxForName[s.name] = i; });
    function shouldReveal(stopArrayIdx) {
      const name = trip.stops[stopArrayIdx].name;
      return !deferred.has(name) || stopArrayIdx === lastStopIdxForName[name];
    }
    let nextStopIdx = 0; // pointer into trip.stops, in order
    const start = performance.now();
    // Every time a stop actually pops in, the draw holds there for half a
    // second before the line continues — accumulatedPauseMs is subtracted
    // out of elapsed time so those holds don't eat into the ~2.5s (2002
    // baseline) drawing pace itself, they just add on top of it.
    const STOP_PAUSE_MS = 500;
    let accumulatedPauseMs = 0;
    let pauseEndAt = null;
    function frame(now) {
      if (token !== roadTripAnimationToken) return; // superseded by a switch/deactivate
      if (pauseEndAt !== null) {
        if (now < pauseEndAt) { requestAnimationFrame(frame); return; }
        accumulatedPauseMs += STOP_PAUSE_MS;
        pauseEndAt = null;
      }
      const elapsed = now - start - accumulatedPauseMs;
      const targetKm = Math.min(lengthKm, (elapsed / trip.durationMs) * lengthKm);
      // Advance to the furthest point whose cumulative distance is still
      // within the drawn-so-far distance (cumKm is monotonic, so a linear
      // scan from the last position would also work, but index count here
      // is small enough — at most a few hundred — that this is plenty fast).
      let i = 1;
      while (i < total && cumKm[i] <= targetKm) i++;
      trip.layer.setLatLngs(trip.coords.slice(0, i));
      let revealedAny = false;
      while (nextStopIdx < trip.stops.length && trip.stops[nextStopIdx].idx <= i - 1) {
        if (shouldReveal(nextStopIdx)) { revealStop(trip, trip.stops[nextStopIdx].name); revealedAny = true; }
        nextStopIdx++;
      }
      if (revealedAny && nextStopIdx < trip.stops.length) {
        // A stop just popped and more of the route is still to come — hold
        // here briefly before continuing to draw.
        pauseEndAt = now + STOP_PAUSE_MS;
        requestAnimationFrame(frame);
        return;
      }
      if (elapsed < trip.durationMs) {
        requestAnimationFrame(frame);
      } else {
        // Land exactly on the full route and make sure every stop has
        // popped, in case the last frame landed short of the final index.
        trip.layer.setLatLngs(trip.coords);
        while (nextStopIdx < trip.stops.length) {
          if (shouldReveal(nextStopIdx)) revealStop(trip, trip.stops[nextStopIdx].name);
          nextStopIdx++;
        }
      }
    }
    requestAnimationFrame(frame);
  }

  // Hides a trip's route and reverts its logo overrides back to normal.
  function deactivateTrip(trip) {
    roadTripAnimationToken++; // stop any in-flight draw-in animation
    map.removeLayer(trip.layer);
    trip.logoOverrideNames.forEach(revertLogoOverride);
  }

  ROAD_TRIPS.forEach(trip => {
    const cb = document.getElementById('cb-' + trip.id);
    roadTripCheckboxes[trip.id] = cb;
    cb.addEventListener('change', (e) => {
      if (e.target.checked) {
        if (activeTripId === null) {
          // First trip selected: enter road-trip mode — snapshot, blank,
          // and screen every other filter control.
          savedFilterState = snapshotFilterState();
          Object.values(categoryCheckboxes).forEach(c => { c.checked = false; });
          PEOPLE.forEach(p => { personCheckboxes[p].checked = false; });
          peopleAllCb.checked = false;
          peopleAllCb.indeterminate = false;
          RATINGS.forEach(r => { ratingCheckboxes[r].checked = false; });
          ratingsAllCb.checked = false;
          ratingsAllCb.indeterminate = false;
          if (voyagerCb.checked) {
            voyagerCb.checked = false;
            voyagerCb.dispatchEvent(new Event('change'));
          }
          filtersScrimEl.style.display = 'block';
        } else if (activeTripId !== trip.id) {
          // Switching directly from another trip: swap without touching
          // the saved snapshot or the scrim.
          const prevTrip = ROAD_TRIPS_BY_ID[activeTripId];
          deactivateTrip(prevTrip);
          roadTripCheckboxes[activeTripId].checked = false;
        }
        activeTripId = trip.id;
        activateTrip(trip);
      } else if (activeTripId === trip.id) {
        // Deselecting the active trip: exit road-trip mode entirely.
        deactivateTrip(trip);
        activeTripId = null;
        roadTripModeActive = false;
        activeRoadTripStadiumNames = null;
        activeRoadTripLogoOverrideNames = null;
        filtersScrimEl.style.display = 'none';
        if (savedFilterState) {
          restoreFilterState(savedFilterState);
          savedFilterState = null;
        }
        updateVisibility();
        flyToDefaultView();
      }
    });
  });

  // Also allow clicking a filter row (not just the checkbox itself) to toggle
  document.querySelectorAll('.filter-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('input, label')) return;
      const cb = row.querySelector('input[type=checkbox]');
      if (!cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });

  // Collapsible filters panel — collapsed by default. Floats over the
  // map (see viewportFitPadding above), so opening/closing it never
  // touches the map's size or fit — no refit needed here.
  const filtersToggleBtn = document.getElementById('filters-toggle');
  const filtersToggleArrow = document.querySelector('.filters-toggle-arrow');
  const filtersBody = document.getElementById('filters-body');
  filtersToggleBtn.addEventListener('click', () => {
    const expanding = filtersBody.style.display === 'none';
    filtersBody.style.display = expanding ? '' : 'none';
    filtersToggleArrow.innerHTML = expanding ? '&#9662;' : '&#9656;';
    filtersToggleBtn.setAttribute('aria-expanded', String(expanding));
    filtersToggleBtn.title = expanding ? 'Collapse layers & filters' : 'Expand layers & filters';
    filtersPanelEl.classList.toggle('expanded', expanding);
  });

  // --- Overlap avoidance: when two stadium markers are closer together on
  // screen than needed to keep each one at least half-visible, nudge them
  // apart along the axis connecting their centers, at every zoom level.
  // Recomputed from the canonical coordinates on every zoom change so it
  // settles correctly at each zoom level, and only considers stadiums
  // currently ON the map — a stadium hidden by the filters can't cause (or
  // need) a nudge, so switching a colliding layer off automatically lets
  // whatever it had displaced settle back to its exact true location the
  // next time this runs.
  //
  // The minimum separation for a given pair is sized to each marker's own
  // on-screen radius (a small former/historic dot needs far less clearance
  // than a large current-team logo, and a 5-star logo with its star badge
  // needs more still) rather than one uniform worst-case gap for every
  // pair — d >= max(radiusA, radiusB) is exactly the distance at which
  // each circle keeps at least half its diameter clear of the other.
  //
  // Current stadiums (visited or not) always win the exact spot: when a
  // current stadium collides with a non-current one, only the non-current
  // one moves, absorbing the entire gap. Pairs with no current stadium
  // involved (e.g. two former stadiums) split the gap evenly as before, as
  // do the rare pairs of two current stadiums close enough to collide —
  // there's no priority to apply between two of the same kind.
  // Reads the marker's CURRENT on-screen radius live (dotRadiusForZoom /
  // logoDiameterForZoom), not a fixed base value — former/historic/future
  // dots and, on mobile, logo markers too, grow with zoom (see
  // updateGrowingMarkerSizes), so collision-avoidance has to separate them
  // using however big they actually are RIGHT NOW or a grown marker can
  // end up closer to a neighbor than its larger visible size needs.
  function markerRadiusPx(s) {
    if (!isLogoIconActive(s)) return dotRadiusForZoom(map.getZoom());
    const d = logoDiameterForZoom(map.getZoom());
    return (s.rating === 5 ? d * STAR_SCALE : d) / 2;
  }

  function isCurrentCategory(s) {
    return s.category === 'current_visited' || s.category === 'current_not_visited';
  }

  function resolveOverlaps() {
    const zoom = map.getZoom();
    // r uses each marker's CURRENT on-screen radius (markerRadiusPx reads
    // dotRadiusForZoom/logoDiameterForZoom live) — this only gives correct
    // separation if it runs AFTER updateGrowingMarkerSizes has applied the
    // real size for this zoom (see the 'zoomend' wiring below); called
    // with a stale pre-growth radius, grown markers can end up closer
    // together on screen than their now-larger visible size needs,
    // reading as one marker disappearing behind another.
    // + worldOffsetDeg (see updateWorldOffset) so collision-avoidance
    // projects from wherever the markers actually are right now, not their
    // one true home longitude — otherwise this would drag every marker
    // back to the original world copy the instant it next runs.
    const pts = stadiums
      .filter(s => map.hasLayer(markerByName[s.name]))
      .map(s => ({ s, p: map.project([s.lat, s.lon + worldOffsetDeg], zoom), r: markerRadiusPx(s), current: isCurrentCategory(s) }));
    // Snapshot each marker's true, un-nudged position before collision
    // avoidance touches it — used below to tell "already on screen, don't
    // let it get pushed off" apart from "was never on screen to begin
    // with," which the edge-clamp must never drag into view.
    pts.forEach(pt => { pt.p0 = { x: pt.p.x, y: pt.p.y }; });

    const maxIterations = 8;
    for (let iter = 0; iter < maxIterations; iter++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const minSep = Math.max(a.r, b.r);
          const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < minSep) {
            moved = true;
            let ux, uy;
            if (dist < 1e-6) {
              const angle = ((i * 37 + j * 53) % 360) * Math.PI / 180;
              ux = Math.cos(angle); uy = Math.sin(angle);
              dist = 0;
            } else {
              ux = dx / dist; uy = dy / dist;
            }
            const gap = minSep - dist;
            // Weight 0 = fixed (current stadium), 1 = movable. Splitting
            // the gap by weight share means: current-vs-non-current moves
            // only the non-current point the full gap, while same-kind
            // pairs (both weight 1, or both weight 0 as a fallback) still
            // split it evenly exactly like before.
            const wa = a.current ? 0 : 1, wb = b.current ? 0 : 1;
            const total = wa + wb;
            const fa = total === 0 ? 0.5 : wa / total;
            const fb = total === 0 ? 0.5 : wb / total;
            a.p.x -= ux * gap * fa; a.p.y -= uy * gap * fa;
            b.p.x += ux * gap * fb; b.p.y += uy * gap * fb;
          }
        }
      }
      if (!moved) break;
    }

    // A marker that starts ON SCREEN near the edge of the fitted view
    // (Miami is the recurring example) can get nudged further toward that
    // edge while separating from a neighbor, right off the visible map
    // entirely — clamp those back in, by their own radius. Critically,
    // this only applies per-axis when the marker's TRUE, un-nudged
    // position (p0) was already within the visible area on that axis; a
    // marker that's legitimately off-screen to begin with (e.g. Boston
    // while zoomed into California) must never get dragged onto screen
    // just because collision-avoidance happened to move it — that was the
    // bug in the first version of this clamp, which pulled EVERY marker
    // onto screen unconditionally and lined the whole roster up around
    // the edges the instant you zoomed in anywhere.
    const pixelBounds = map.getPixelBounds(zoom);
    pts.forEach(({ p, p0, r }) => {
      const margin = r + 2;
      const minX = pixelBounds.min.x + margin, maxX = pixelBounds.max.x - margin;
      const minY = pixelBounds.min.y + margin, maxY = pixelBounds.max.y - margin;
      if (minX <= maxX && p0.x >= minX && p0.x <= maxX) {
        p.x = Math.min(Math.max(p.x, minX), maxX);
      }
      if (minY <= maxY && p0.y >= minY && p0.y <= maxY) {
        p.y = Math.min(Math.max(p.y, minY), maxY);
      }
    });

    pts.forEach(({ s, p }) => {
      markerByName[s.name].setLatLng(map.unproject(p, zoom));
    });
  }

  // --- State-label sizing + overlap avoidance + viewport clamping. Font
  // size ramps with zoom (see fontSizeForZoom), each label's icon container
  // is resized to its true measured footprint so the text is never clipped
  // by its own box, overlapping labels are pushed apart using a
  // minimum-translation-vector approach on those true bounding boxes, and
  // finally any label that's partly on-screen gets nudged fully inside the
  // visible map area so it's never cut off at the window edge. Recomputed
  // on every zoom change, pan, and window resize.
  function resolveStateLabelOverlaps() {
    const zoom = map.getZoom();
    const fontSizePx = fontSizeForZoom(zoom);

    const pts = stateLabels.map(st => {
      const size = measureLabel(st.name, fontSizePx);
      // + worldOffsetDeg keeps labels on the same world copy the stadium
      // markers were just shifted to (see updateWorldOffset) — projecting
      // the true, un-shifted lon here would place labels a full world away
      // from view the moment the user pans past one.
      return { st, p: map.project([st.lat, st.lon + worldOffsetDeg], zoom), w: size.width, h: size.height };
    });

    const padding = 1.5; // small buffer so labels don't sit edge-to-edge
    const maxIterations = 12;
    for (let iter = 0; iter < maxIterations; iter++) {
      let moved = false;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const a = pts[i], b = pts[j];
          const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y;
          const overlapX = (a.w / 2 + b.w / 2 + padding) - Math.abs(dx);
          const overlapY = (a.h / 2 + b.h / 2 + padding) - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            moved = true;
            if (overlapX < overlapY) {
              const sign = dx === 0 ? (i < j ? -1 : 1) : Math.sign(dx);
              const shift = (overlapX / 2) * (sign || 1);
              a.p.x -= shift; b.p.x += shift;
            } else {
              const sign = dy === 0 ? (i < j ? -1 : 1) : Math.sign(dy);
              const shift = (overlapY / 2) * (sign || 1);
              a.p.y -= shift; b.p.y += shift;
            }
          }
        }
      }
      if (!moved) break;
    }

    const size = map.getSize(); // current container size in px, tracks window size
    const edgeMargin = 2;

    pts.forEach(({ st, p, w, h }) => {
      const marker = stateMarkerByName[st.name];
      const boxW = Math.ceil(w) + 4;
      const boxH = Math.ceil(h) + 2;
      marker.setIcon(L.divIcon({
        className: 'state-label',
        html: st.name,
        iconSize: [boxW, boxH],
        iconAnchor: [boxW / 2, boxH / 2]
      }));
      const el = marker.getElement();
      if (el) el.style.fontSize = fontSizePx + 'px';

      let latlng = map.unproject(p, zoom);

      // Keep the label fully inside the visible window: only nudge it if
      // it's already at least partly on-screen (never yank an off-screen
      // state into view).
      const cp = map.latLngToContainerPoint(latlng);
      const halfW = boxW / 2, halfH = boxH / 2;
      const intersects = (cp.x + halfW > 0) && (cp.x - halfW < size.x) &&
                          (cp.y + halfH > 0) && (cp.y - halfH < size.y);
      if (intersects) {
        let cx = cp.x, cy = cp.y;
        if (boxW + edgeMargin * 2 <= size.x) {
          cx = Math.min(Math.max(cx, halfW + edgeMargin), size.x - halfW - edgeMargin);
        } else {
          cx = size.x / 2;
        }
        if (boxH + edgeMargin * 2 <= size.y) {
          cy = Math.min(Math.max(cy, halfH + edgeMargin), size.y - halfH - edgeMargin);
        } else {
          cy = size.y / 2;
        }
        latlng = map.containerPointToLatLng([cx, cy]);
      }

      marker.setLatLng(latlng);
    });
  }

  // moveend alone (a pure pan, no zoom change) never changes any marker's
  // radius, so collision-avoidance can run immediately.
  map.on('moveend', () => { resolveOverlaps(); resolveStateLabelOverlaps(); });
  // The REAL size is only ever applied once the zoom has settled
  // (zoomend), not on every frame of an animated zoom. Calling
  // setRadius/setIcon mid-animation forces an immediate reprojection to
  // the new zoom on top of Leaflet's still-in-flight pane transform,
  // which is exactly what was throwing the former/historic/future dots
  // out of place during the filters-panel squeeze/expand transition and
  // snapping them back at the end. The zoom-compensation transform above
  // handles keeping the visual SIZE steady during the transition; this
  // handler just clears that compensation and swaps in the true size the
  // instant the transition ends — and only THEN re-runs collision
  // avoidance, so it separates markers using their real, just-grown radii
  // instead of whatever they measured before the zoom (which was leaving
  // a grown marker close enough to a neighbor to visibly hide behind it).
  map.on('zoomend', () => {
    clearZoomCompensation();
    lastSettledZoom = map.getZoom();
    updateGrowingMarkerSizes();
    resolveOverlaps();
    resolveStateLabelOverlaps();
  });
  // On a phone rotation specifically, the viewport size can report a
  // TRANSITIONAL value for a little while — mid rotation, or while the
  // browser's own address-bar chrome is still expanding or collapsing to
  // its final state — before settling on the real new dimensions. A
  // single fixed delay after 'resize' isn't reliable against this: how
  // long it takes to settle varies by device and even by which direction
  // you're rotating. So instead of trusting one delayed read, this waits
  // for two consecutive size readings (150ms apart) to come back
  // IDENTICAL before treating it as settled and actually refitting — if
