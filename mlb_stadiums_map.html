  // the size is still moving between checks, it keeps waiting rather than
  // refitting against a still-transitional value. A generation counter
  // lets a newer resize cancel whatever an older, still-settling one was
  // waiting on, so a burst of events (a dragged desktop window resize, or
  // a rotation firing several) always converges on the LAST one's final
  // state rather than an earlier one's.
  //
  // Reads window.visualViewport's own width/height where available rather
  // than window.innerWidth/innerHeight — visualViewport is the API
  // specifically meant to track the REAL currently-visible viewport
  // (chrome and all) live as it changes, and is the more trustworthy
  // signal during exactly this kind of address-bar-chrome transition on
  // iOS Safari; innerWidth/innerHeight can occasionally report a size
  // that "looks" stable across two 150ms-apart checks while the visual
  // viewport is still one more reflow away from its true final state —
  // which reads as this settling on a transitional size and refitting
  // against it, i.e. exactly the "rotate back to portrait and it's
  // zoomed in with the sides clipped" symptom. Falls back to
  // innerWidth/innerHeight on any browser without visualViewport support.
  function currentViewportSize() {
    if (window.visualViewport) {
      return { w: window.visualViewport.width, h: window.visualViewport.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }
  let refitGeneration = 0;
  function scheduleViewRefit() {
    const myGen = ++refitGeneration;
    const waitForStable = () => {
      if (myGen !== refitGeneration) return;
      const { w, h } = currentViewportSize();
      setTimeout(() => {
        if (myGen !== refitGeneration) return;
        const now = currentViewportSize();
        if (now.w === w && now.h === h) {
          // invalidateSize first — it's what tells Leaflet the container's
          // actual new pixel dimensions, and both the refit below
          // (fitBounds) and the growth-curve's recompute (see the other
          // resize listener above, which reads defaultZoom) need that to
          // be accurate or they end up solving for the OLD size.
          map.invalidateSize();
          // Rotating the phone changes which zoom actually fits all the
          // stadiums (a tall portrait viewport and a wide landscape one
          // need very different zoom levels for the same US-spanning
          // bounds) — but invalidateSize alone only adjusts Leaflet's
          // internal pixel bookkeeping for the new container size, it
          // doesn't re-solve for a new zoom/center. Only do this if the
          // user hasn't manually navigated away from the default view
          // (see userDivergedFromDefault above) — don't yank someone back
          // to the all-stadiums view if they've panned off to look at
          // something, or out of an active road trip's own framing. When
          // they HAVE diverged, leaving the center/zoom untouched here is
          // exactly right — invalidateSize alone keeps the same
          // geographic point centered at the same zoom level through the
          // rotation, just reprojected into the new dimensions.
          if (!userDivergedFromDefault) applyDefaultView();
          resolveOverlaps();
          resolveStateLabelOverlaps();
          repositionPinned();
        } else {
          waitForStable(); // still moving — keep waiting for it to settle
        }
      }, 150);
    };
    waitForStable();
  }
  window.addEventListener('resize', scheduleViewRefit);
  // visualViewport fires its own 'resize' independently of window's, and
  // on iOS Safari specifically can catch address-bar chrome show/hide
  // transitions that don't always produce a timely window resize event —
  // an extra trigger source, still funneled through the same settle-
  // confirm generation-counter logic above, so redundant firings are
  // harmless no-ops once the view has already settled.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleViewRefit);
  }
  resolveOverlaps();
  resolveStateLabelOverlaps();
  // The very first fit (the plain applyDefaultView() call up near
  // stadiumBounds) runs synchronously during initial script execution, at
  // whatever container size the browser happens to report at that instant
  // — on some mobile browsers that's before the page's true, final
  // viewport has settled (e.g. the address bar chrome hasn't finished its
  // initial collapse/expand yet). Running the same settle-confirm refit
  // once more right after load catches that without waiting for an actual
  // rotation to trigger it — harmless if the initial fit was already
  // correct, since it'll just confirm the same size and redo the same fit.
  scheduleViewRefit();

  // --- TEMPORARY debug overlay (build stamp + live growth diagnostics) ---
  // Remove this whole block once the portrait marker-growth issue is
  // resolved and confirmed on-device. Two purposes: (1) a build stamp so
  // it's obvious on the phone whether GitHub Pages has actually propagated
  // the latest upload yet, and (2) live readouts of exactly the values the
  // growth math depends on, since reasoning about them from here hasn't
  // been enough to pin down why portrait still isn't growing — actual
  // numbers off the device will.
  const DEBUG_BUILD_STAMP = '2026-08-14 07:41 UTC (fix video fullscreen clipped by overlay overflow)';
  let debugVisible = false;
  // A plain fixed-position DOM element, not a Leaflet marker — so it's
  // always centered on the actual screen (see the .debug-overlay CSS)
  // instead of only appearing when its old real-world anchor point
  // happened to be in view.
  const debugOverlayEl = document.createElement('div');
  debugOverlayEl.className = 'debug-overlay';
  document.body.appendChild(debugOverlayEl);
  function setDebugVisible(v) {
    debugVisible = v;
    debugOverlayEl.classList.toggle('visible', debugVisible);
  }
  function updateDebugOverlay() {
    const el = debugOverlayEl;
    const zoom = map.getZoom();
    const vv = window.visualViewport;
    const w = window.innerWidth, h = window.innerHeight;
    const vw = vv ? vv.width : null, vh = vv ? vv.height : null;
    const mobile = isMobileViewport();
    el.innerHTML =
      `<span class="debug-close">&times;</span>` +
      `build ${DEBUG_BUILD_STAMP}<br>` +
      `viewport ${w}x${h} (short edge ${Math.min(w, h)})<br>` +
      `visualViewport ${vv ? vw + 'x' + vh : 'n/a'}<br>` +
      `orientation ${w >= h ? 'landscape' : 'portrait'}<br>` +
      `mobile? ${mobile}<br>` +
      `zoom ${zoom.toFixed(2)} / defaultZoom ${defaultZoom.toFixed(2)} / minZoom ${map.getMinZoom()}<br>` +
      `userDivergedFromDefault: ${userDivergedFromDefault}<br>` +
      `refitGeneration ${refitGeneration}<br>` +
      (lastApplyDefaultViewError ? `<b>applyDefaultView ERROR: ${lastApplyDefaultViewError}</b><br>` : '') +
      `dotRadius ${dotRadiusForZoom(zoom).toFixed(1)}px<br>` +
      `logoDiam ${logoDiameterForZoom(zoom).toFixed(1)}px`;
    el.classList.toggle('visible', debugVisible);
  }
  updateDebugOverlay();
  map.on('zoom zoomend moveend', updateDebugOverlay);
  window.addEventListener('resize', () => setTimeout(updateDebugOverlay, 250));

  // Delegated click on the debug overlay's own "x" close box — the div
  // itself is stable across innerHTML updates, so one listener covers
  // every future re-render.
  debugOverlayEl.addEventListener('click', (e) => {
    if (e.target.closest('.debug-close')) {
      setDebugVisible(false);
    }
  });

  // Tap/click over the Yucatan Peninsula toggles the debug overlay.
  // Invisible circle marker, generous radius for an easy touch target.
  const yucatanToggle = L.circleMarker([19.5, -89.5], {
    radius: 26,
    stroke: false,
    fillOpacity: 0,
    interactive: true
  }).addTo(map);
  yucatanToggle.on('click', () => setDebugVisible(!debugVisible));
</script>
</body>
</html>
