  // Each road trip is a polyline + a fixed stadium list. Some of those
  // stadiums are former (demolished or still-exists-but-not-current) ones
  // that normally render as a small dot; logoOverrideNames names the subset
  // that instead gets swapped to the same team-logo circle used for current
  // stadiums while its trip is active — see "Road trips: all-or-nothing
  // mode" below, which applies/reverts that swap and enforces that only one
  // trip is ever shown at a time (selecting one deselects any other).
  // stops: the ordered list of cities actually visited, each paired with
  // the index into this trip's coords array where the route reaches that
  // city (captured at route-assembly time from the OSRM leg boundaries —
  // see the "real driving-route geometry" note above). Drives both which
  // marker pops in when (see syncTripVisual) and the pace calculation below.
  const ROAD_TRIPS = [
    {
      id: 'road-trip-2002',
      title: '2002 Road Trip',
      coords: ROAD_TRIP_2002_COORDS,
      color: '#0f766e',
      stadiumNames: new Set(["Olympic Stadium", "Yankee Stadium (I)", "Veterans Stadium", "Orioles Park at Camden Yards", "Fenway Park"]),
      logoOverrideNames: new Set(["Olympic Stadium", "Yankee Stadium (I)", "Veterans Stadium"]),
      // Real order: Boston -> Montreal -> back to Boston -> New York ->
      // Philadelphia -> Baltimore -> Boston. Fenway is stop 0/2/6 (start,
      // the Montreal-return, and the finish) — deferredNames keeps it
      // hidden through the first two and only pops it at the last one.
      stops: [{ name: "Fenway Park", idx: 0 }, { name: "Olympic Stadium", idx: 27 }, { name: "Fenway Park", idx: 55 }, { name: "Yankee Stadium (I)", idx: 85 }, { name: "Veterans Stadium", idx: 111 }, { name: "Orioles Park at Camden Yards", idx: 137 }, { name: "Fenway Park", idx: 161 }],
      deferredNames: new Set(["Fenway Park"])
    },
    {
      id: 'road-trip-2006',
      title: '2006 Road Trip',
      coords: ROAD_TRIP_2006_COORDS,
      color: '#7c3aed',
      // T-Mobile Park is included here (unlike before) because
      // updateVisibility() only shows a stadium while a trip is active if
      // its name is in this set — without it, Seattle's own marker would
      // vanish for the one trip that actually starts and ends there.
      stadiumNames: new Set(["T-Mobile Park", "Oracle Park", "Angel Stadium", "Petco Park", "Uniqlo Field at Dodger Stadium", "Oakland Coliseum"]),
      logoOverrideNames: new Set(["Oakland Coliseum"]),
      stops: [{ name: "T-Mobile Park", idx: 0 }, { name: "Oracle Park", idx: 36 }, { name: "Angel Stadium", idx: 58 }, { name: "Petco Park", idx: 78 }, { name: "Uniqlo Field at Dodger Stadium", idx: 101 }, { name: "Oakland Coliseum", idx: 119 }, { name: "T-Mobile Park", idx: 155 }],

  ROAD_TRIPS.forEach(trip => {
    trip.layer = L.polyline(trip.coords, {
      pane: 'pane-route-road-trip',
      color: trip.color,
      weight: 3,
      opacity: 0.85,
      lineJoin: 'round',

  const ROAD_TRIPS_BY_ID = {};
  ROAD_TRIPS.forEach(trip => { ROAD_TRIPS_BY_ID[trip.id] = trip; });

  // Real-world path length per trip (haversine sum over its coords), used
  // both to fit the camera to the whole route before it's drawn (trip.layer
  // has no points yet at that moment, so trip.bounds — computed from the
  // coords directly — stands in for trip.layer.getBounds()) and to pace the
  // draw-in animation: the 2002 trip is the ~5s baseline, and every other
  // trip draws at that same real-world speed, so a longer trip just takes
  // proportionally longer rather than all trips taking the same time.
  function haversineKm(a, b) {
    const R = 6371;
    const dLat = (b[0] - a[0]) * Math.PI / 180;
    const dLon = (b[1] - a[1]) * Math.PI / 180;
    const lat1 = a[0] * Math.PI / 180, lat2 = b[0] * Math.PI / 180;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  ROAD_TRIPS.forEach(trip => {
    trip.bounds = L.latLngBounds(trip.coords);
    const cumKm = [0];
    for (let i = 1; i < trip.coords.length; i++) {
      cumKm.push(cumKm[i - 1] + haversineKm(trip.coords[i - 1], trip.coords[i]));
    }
    trip.cumKm = cumKm;
    trip.lengthKm = cumKm[cumKm.length - 1];
    // Distance-along-route (km) at each stop's actual "reveal moment" — for
    // a deferred stop (one appearing more than once in trip.stops, e.g. a
    // trip's home stadium at both its start and finish) that's only its
    // LAST occurrence, matching whichever occurrence actually pops the
    // marker in. Used by the transport bar's step-back/step-forward
    // buttons to jump cleanly between one revealed stop and the next.
    const deferred = trip.deferredNames || new Set();
    const lastStopIdxForName = {};
    trip.stops.forEach((s, idx) => { if (deferred.has(s.name)) lastStopIdxForName[s.name] = idx; });
    trip.waypointsKm = trip.stops
      .filter((s, idx) => !deferred.has(s.name) || idx === lastStopIdxForName[s.name])
      .map(s => cumKm[s.idx]);
  });
  const ROAD_TRIP_BASE_DURATION_MS = 2500;
  const ROAD_TRIP_PACE_MS_PER_KM = ROAD_TRIP_BASE_DURATION_MS / ROAD_TRIPS_BY_ID['road-trip-2002'].lengthKm;
  ROAD_TRIPS.forEach(trip => { trip.durationMs = trip.lengthKm * ROAD_TRIP_PACE_MS_PER_KM; });

  // 'all' | 'visited'. Defaults to 'all' with only Current checked, i.e.
  // exactly the 30 current stadiums, matching the HTML's initial
  // checked/unchecked state below. Declared up here (rather than down by
  // setMode/updateVisibility, where it's actually driven from) because
  // updateGrowingMarkerSizes — defined and first CALLED further up, well
  // before that code runs — already needs to read it on every zoom/resize
  // to decide whether a not-yet-visited current stadium should render
  // dimmed; a `let` declared down there wouldn't be initialized yet the
  // first time updateGrowingMarkerSizes actually runs.
  let activeMode = 'all';
  let roadTripModeActive = false;
  let activeRoadTripStadiumNames = null;
  let activeRoadTripLogoOverrideNames = null;
  // "Stadiums Over the Years" story state — declared up here alongside
  // roadTripModeActive for the same reason (read by updateGrowingMarkerSizes
  // and updateStarsVisible before their own "natural" location further down
  // would otherwise have initialized it).
  let yearStoryModeActive = false;
  let yearStoryYear = YEAR_STORY_MIN;
  // "Ballparks I've Visited" story state — same declared-up-here reasoning as
  // yearStoryModeActive above.
  let journeyModeActive = false;
  let journeyYear = JOURNEY_MIN;
  // Stacking order for whichever story is popping stadiums in right now —
  // road trips (revealStop) or Ballparks I've Visited (popStadiumIcon's
  // callers) — name -> a strictly-increasing z-index offset, bumped inside
  // popStadiumIcon itself every time it runs, so a stadium that just popped
  // in always draws on top of every one that popped in before it. Leaflet's
  // own default stacking is purely latitude-based and has no idea about
  // reveal order. Shared by both stories rather than kept separate, since
  // only one story is ever active at a time. Read by updateGrowingMarkerSizes
  // (guarded by roadTripModeActive || journeyModeActive) so the order
  // survives any later resize/zoom that would otherwise reset every
  // marker's zIndexOffset back to 0.
  let storyPopZIndexByName = {};
  let storyPopZIndexCounter = 0;
  // The green star badge behind a 5-star stadium's logo marker should only
  // show up in personal/story contexts — the "Stadiums I've Visited" filter
  // tab, or a road trip — not in the plain "All MLB Stadiums" existence
  // view, where a personal ranking doesn't belong. Recomputed by
  // updateStarsVisible() (defined down with the two-mode filter panel,
  // where activeMode lives) on every mode switch and road-trip
  // activate/deactivate; read here at marker-creation time as its initial
  // default (false, matching the default "All MLB Stadiums / Current only"
  // view) and by updateGrowingMarkerSizes below on every resize.
  let starsVisible = false;
  function isLogoIconActive(s) {
    const isCurrent = s.category === 'current_visited' || s.category === 'current_not_visited';
    // Every stadium shown in the year-slider story, or in "My Stadium
    // Journey," gets current-stadium styling (see startYearStory and
    // startJourney, which override every non-current one of them to logo
    // markers the same way road trips override the former stadiums along
    // their route) — for the year story, whichever ballparks were in use
    // in a given year WERE the "current" MLB ballparks at that moment; for
    // the journey, every stadium Marco's actually visited deserves the
    // same full-color treatment regardless of whether it's still standing.
    return isCurrent || (roadTripModeActive && activeRoadTripLogoOverrideNames.has(s.name)) || yearStoryModeActive || journeyModeActive;
  }

  // Generalized marker-swap: works whether the stadium's normal rendering
  // is an L.marker (former_demolished's dot icon) or an L.circleMarker
  // (former_exists' plain vector dot) — circleMarker has no setIcon, so the
  // only way to show a divIcon-based logo circle in its place is to swap in
  // a whole new L.marker instance and keep markerByName pointed at whichever
  // instance is currently the "real" one on the map.
  const originalMarkerByName = {};
  function applyLogoOverride(name) {
    if (originalMarkerByName[name]) return;
    const s = stadiumByName[name];
    const original = markerByName[name];
    originalMarkerByName[name] = original;
    if (map.hasLayer(original)) map.removeLayer(original);
    const logoSrc = s.logoUrl || `https://www.mlbstatic.com/team-logos/${s.teamId}.svg`;
    // + worldOffsetDeg so a swapped-in logo marker lands on the same world
    // copy everything else is currently shifted to (see updateWorldOffset),
    // rather than snapping back to the true home longitude.
    // Sized via logoDiameterForZoom (not the flat LOGO_ICON_SIZE) and
    // registered in growingMarkers below so this stand-in marker keeps
    // growing in lockstep with the real current-stadium logo markers as the
    // road trip's camera zooms in — otherwise it stayed pinned at its
    // initial size while the current stadiums' markers grew past it,
    // making former stadiums along the trip look smaller.
    const temp = L.marker([s.lat, s.lon + worldOffsetDeg], {
      pane: 'pane-' + s.category,
      icon: logoIcon(STYLES[s.category].color, logoSrc, s.rating, logoDiameterForZoom(map.getZoom()), false, starsVisible)
    });
    temp.addTo(map);
    markerByName[name] = temp;
    growingMarkers.push({ marker: temp, name: s.name, kind: 'logo', color: STYLES[s.category].color, logoSrc, rating: s.rating });
  }
  function revertLogoOverride(name) {
    const original = originalMarkerByName[name];
    if (!original) return;
    const temp = markerByName[name];
    if (map.hasLayer(temp)) map.removeLayer(temp);
    // Drop the stand-in's growingMarkers entry (added in applyLogoOverride)
    // now that it's gone for good — a fresh one is created next time this
    // stadium's trip is activated, so nothing carries over stale.
    const gmIdx = growingMarkers.findIndex(gm => gm.marker === temp);
    if (gmIdx !== -1) growingMarkers.splice(gmIdx, 1);
    // The original marker may have sat out an intervening world-copy shift
    // while the temp logo marker was standing in for it — resync it to the
    // current offset before handing it back off.
    const s = stadiumByName[name];
    original.setLatLng([s.lat, s.lon + worldOffsetDeg]);
    markerByName[name] = original;
    delete originalMarkerByName[name];
  }

  // --- Year-story team markers: one persistent Leaflet marker per
  // TEAM+STADIUM pair that's ever active in the year-slider story, reused
  // across year changes — and across separate story sessions — rather
  // than destroyed and recreated. Reachable via yearStoryMarkerByKey,
  // keyed by teamStadiumKey(team, stadium.name). A stadium-keyed registry
  // (like markerByName) can only ever point at ONE marker per stadium
  // name, which can't represent two teams sharing one ballpark in the same
  // season; a team-keyed registry (the old yearStoryMarkerByTeam) can't
  // represent one team shown at two DIFFERENT stadiums in the same season
  // — this dataset has both, so the registry key is the pair. See
  // activeTeamAssignmentsForYear above for how each year's full set of
  // tenancies is resolved. Every ordinary per-stadium marker is simply
  // hidden for the duration of the story (see startYearStory/
  // deactivateActiveStory) — these markers are the ONLY thing on the map
  // while it's active.
  const yearStoryMarkerByKey = {};
  function teamStadiumKey(team, stadiumName) { return team + '||' + stadiumName; }
  function renderYearStoryMarkersForYear(year) {
    const zoom = map.getZoom();
    const assignments = activeTeamAssignmentsForYear(year);
    const activeKeys = new Set();
    assignments.forEach(te => {
      const s = te.stadium;
      const logoSrc = te.logoSrc;
      const color = STYLES[s.category].color;
      const key = teamStadiumKey(te.team, s.name);
      activeKeys.add(key);
      let entry = yearStoryMarkerByKey[key];
      if (!entry) {
        const marker = L.marker([s.lat, s.lon + worldOffsetDeg], {
          pane: 'pane-' + s.category,
          icon: logoIcon(color, logoSrc, null, logoDiameterForZoom(zoom), false, starsVisible)
        });
        entry = { marker, team: te.team, stadium: s };
        yearStoryMarkerByKey[key] = entry;
        growingMarkers.push({ marker, name: s.name, kind: 'year-team-logo', color, logoSrc, rating: null });
      } else {
        entry.stadium = s;
        entry.marker.setLatLng([s.lat, s.lon + worldOffsetDeg]);
        const gm = growingMarkers.find(g => g.marker === entry.marker);
        if (gm) { gm.name = s.name; gm.color = color; gm.logoSrc = logoSrc; }
      }
      if (!map.hasLayer(entry.marker)) entry.marker.addTo(map);
    });
    // Every team+stadium pair NOT active this year just gets hidden — its
    // marker object stays around for reuse the next time that exact pair
    // resurfaces (e.g. the Nationals vanish 1972-2004, then reappear in
    // 2005; or a team that splits time between two parks for a stretch,
    // stops, then later splits again).
    Object.keys(yearStoryMarkerByKey).forEach(key => {
      if (activeKeys.has(key)) return;
      const entry = yearStoryMarkerByKey[key];
      if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
    });
    updateGrowingMarkerSizes();
    resolveOverlaps();
  }
  // Hides every year-story team marker without forgetting them (see
  // renderYearStoryMarkersForYear's reuse-across-sessions comment above).
  function hideAllYearStoryMarkers() {
    Object.values(yearStoryMarkerByKey).forEach(entry => {
      if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
    });
  }

  // Re-triggers the stadiumPop keyframe animation on a marker's icon —
  // used by revealStop as the drawn route reaches each stop, and by every
  // Ballparks I've Visited reveal path (setJourneyYear/advanceJourneyReveal/
  // startJourney's intro). Targets the inner <svg> (see the
  // .stadium-pop-svg CSS comment) so it never fights Leaflet's own
  // positioning transform on the outer icon element.
  //
  // Also the one shared place that bumps storyPopZIndexByName — every
  // stadium that pops in this way, in either story, gets the next-highest
  // z-index offset so far, so it draws above everything that popped in
  // before it (see updateGrowingMarkerSizes). Applied both immediately
  // (setZIndexOffset) and persisted (storyPopZIndexByName) so it survives
  // any later resize/zoom. Runs even if the marker has no element yet
  // (nothing to animate, but the stacking order should still advance).
  function popStadiumIcon(name) {
    const marker = markerByName[name];
    storyPopZIndexByName[name] = ++storyPopZIndexCounter;
    if (marker && marker.setZIndexOffset) marker.setZIndexOffset(storyPopZIndexByName[name]);
    const el = marker && marker.getElement && marker.getElement();
    const svg = el && el.querySelector('svg');
    if (!svg) return;
    svg.classList.remove('stadium-pop-svg');
    void svg.offsetWidth; // force reflow so re-adding the class re-triggers it
    svg.classList.add('stadium-pop-svg');
  }

  // Same logo-URL fallback applyLogoOverride uses, pulled out standalone so
  // the transport-bar "current marker" thumbnail (see setBarMarkerThumb)
  // can resolve it too without duplicating the mlbstatic.com fallback URL.
  function stadiumLogoSrc(s) {
    return s.logoUrl || `https://www.mlbstatic.com/team-logos/${s.teamId}.svg`;
  }

  // Plain baseball, drawn at the same 22x22 footprint as a real team-logo
  // thumbnail — sits in a transport bar's ".year-story-marker" slot before
  // any stop's popped in yet (see setBarMarkerThumb), so that slot is never
  // actually empty/collapsed the way it would be if the marker started
  // blank; swapping this out for a real logo is just a same-size icon
  // swap, not new content appearing where there was none, so the title bar
  // never changes height or re-flows its text once playback starts.
  const BASEBALL_ICON_SVG = '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="#f5efd8" stroke="#5b5a3f" stroke-width="1"/><path d="M 5.5 4 Q 11 11 5.5 18" fill="none" stroke="#b91c1c" stroke-width="1"/><path d="M 16.5 4 Q 11 11 16.5 18" fill="none" stroke="#b91c1c" stroke-width="1"/></svg>';

  // Fills a transport bar's small ".year-story-marker" thumbnail with a
  // miniature of a stadium's real map marker — reuses logoIcon()'s own SVG
  // markup (its .options.html) rather than reimplementing the circle/ring/
  // logo drawing, so the thumbnail always matches the real marker's look.
  // No star badge (showStar: false) — there isn't room for one at this
  // size, and it's a "which stadium" indicator, not a ratings display.
  // Used by road trips (current = furthest-reached stop, see
  // syncTripVisual) and Ballparks I've Visited (current = most recently
  // popped ballpark) — Stadiums Over the Years has no thumbnail element at
  // all, since a given year has no single "current" stadium. name === null
  // (nothing popped yet, or the story just closed) reverts to the plain
  // baseball placeholder rather than emptying the slot.
  function setBarMarkerThumb(el, name) {
    if (!el) return;
    const s = name && stadiumByName[name];
    if (!s) { el.innerHTML = BASEBALL_ICON_SVG; return; }
    const icon = logoIcon(STYLES[s.category].color, stadiumLogoSrc(s), null, 22, false, false);
    el.innerHTML = icon.options.html;
  }

  // --- Big watermark number for the two timeline stories (see
  // .story-big-number CSS) — south-central Idaho, real MLB-stadium-free
  // territory between Idaho and Wyoming, so it never sits behind or on top
  // of an actual marker. One shared marker (only one of these two stories
  // is ever active at a time), created lazily on first use and just
  // re-iconed on every later update rather than destroyed/recreated.
  const STORY_BIG_NUMBER_LATLNG = [42.9, -113.6];
  // "About the size of Wyoming" at the stories' normal near-default-view
  // zoom for a 1-2 digit stadium count; the year is always 4 digits, so
  // it's sized down (not the same font-size) to land at roughly the same
  // on-screen WIDTH / visual weight rather than the same character height
  // — four digits at half the font-size of two digits works out to
  // almost exactly the same total width.
  const JOURNEY_BIG_NUMBER_FONT_PX = 160;
  const YEAR_STORY_BIG_NUMBER_FONT_PX = 80;
  let storyBigNumberMarker = null;
  function storyBigNumberIcon(text, fontSizePx) {
    // Generous fixed box, well beyond the widest realistic text (a 4-digit
    // year at 80px, or a 2-digit count at 160px) — only used to center the
    // flex content on the anchor point, doesn't need to hug the text.
    const boxW = 640, boxH = Math.round(fontSizePx * 1.3);
    return L.divIcon({
      className: 'story-big-number',
      html: `<span style="font-size:${fontSizePx}px;">${text}</span>`,
      iconSize: [boxW, boxH],
      iconAnchor: [boxW / 2, boxH / 2]
    });
  }
  function renderStoryBigNumber(text, fontSizePx) {
    if (!storyBigNumberMarker) {
      storyBigNumberMarker = L.marker(
        [STORY_BIG_NUMBER_LATLNG[0], STORY_BIG_NUMBER_LATLNG[1] + worldOffsetDeg],
        { pane: 'pane-story-big-number', interactive: false, keyboard: false, icon: storyBigNumberIcon(text, fontSizePx) }
      );
    } else {
      storyBigNumberMarker.setIcon(storyBigNumberIcon(text, fontSizePx));
    }
    if (!map.hasLayer(storyBigNumberMarker)) storyBigNumberMarker.addTo(map);
  }
  function hideStoryBigNumber() {
    if (storyBigNumberMarker && map.hasLayer(storyBigNumberMarker)) map.removeLayer(storyBigNumberMarker);
  }

  // State name labels (static, non-interactive)
  const stateMarkerByName = {};
  stateLabels.forEach(st => {
    const marker = L.marker([st.lat, st.lon], {
      pane: 'pane-state-labels',
      interactive: false,
      keyboard: false,
      icon: L.divIcon({
        className: 'state-label',
        html: st.name,
        iconSize: [140, 14],
        iconAnchor: [70, 7]
      })
    }).addTo(map);
    stateMarkerByName[st.name] = marker;
  });

  // State-label font ramps with zoom (subtle when zoomed out, readable when
  // zoomed in), anchored so it equals BASE_FONT at the default fit-to-bounds
  // zoom. Clamped so it never gets too small or too large.
  const STATE_LABEL_LETTER_SPACING = 1;
  const STATE_LABEL_BASE_FONT = 5.5;
  const STATE_LABEL_MIN_FONT = 4.5;
  const STATE_LABEL_MAX_FONT = 16;
  function fontSizeForZoom(zoom) {
    const ratio = Math.pow(1.14, zoom - defaultZoom);
    return Math.min(STATE_LABEL_MAX_FONT, Math.max(STATE_LABEL_MIN_FONT, STATE_LABEL_BASE_FONT * ratio));
  }

  // Measures a label's true pixel footprint at a given font size, so overlap
  // detection and the icon container always match what's actually on screen.
  const labelMeasureCtx = document.createElement('canvas').getContext('2d');
  function measureLabel(name, fontSizePx) {
    labelMeasureCtx.font = `300 ${fontSizePx}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif`;
    const upper = name.toUpperCase();
    const base = labelMeasureCtx.measureText(upper).width;
    const width = base + STATE_LABEL_LETTER_SPACING * (upper.length - 1);
    const height = fontSizePx * 1.5;
    return { width, height };
  }

  const markersByCategory = { current_visited: [], current_not_visited: [], former_demolished: [], former_exists: [], historic_not_visited: [], historic_demolished: [], future_planned: [] };
  const markerByName = {};
  const stadiumByName = {};

  // Non-current dots (former/historic/future) start smaller than the
  // current-stadium logo markers and grow to match their size as the user
  // zooms in, reaching full size partway through the zoom range — so the
  // size difference reads clearly at the default view but stops competing
  // with the logo markers once you're zoomed in close. growingMarkers holds
  // enough per-marker info to rebuild any marker kind (dot, demolished, or
  // team logo — all divIcons under the hood) via a regenerated icon
  // whenever the zoom or viewport changes.
  //
  // On mobile specifically, EVERY marker (including the team-logo ones,
  // which are otherwise a fixed size at every zoom) also grows, capping
  // out at MOBILE_GROWTH_MULTIPLIER times its own base diameter — tap
  // targets and stadium logos are too small to make out on a phone at the
  // default zoom otherwise. "Mobile" is judged by the device's physical
  // short edge (Math.min of the two viewport dimensions), not raw width,
  // so it's correct in both portrait and landscape and doesn't misfire on
  // a rotated iPad: an iPhone's short edge stays under ~430px in either
  // orientation, an iPad's stays over ~740px in either orientation, and
  // this threshold sits well inside that gap. Keep this pixel value in
  // sync with whatever the mobile CSS layout breakpoints end up using.
  const growingMarkers = [];
  const MOBILE_MAX_SHORT_EDGE = 600;
  const MOBILE_GROWTH_MULTIPLIER = 4;
  function isMobileViewport() {
    return Math.min(window.innerWidth, window.innerHeight) < MOBILE_MAX_SHORT_EDGE;
  }
  // isMobileViewport is purely a SIZE check — true any time the short edge
  // is under 600px, which also happens to a perfectly ordinary desktop
  // browser window someone's manually narrowed down (a completely normal
  // way to test responsive behavior). That's fine for marker growth,
  // where "small viewport" is exactly the right trigger regardless of
  // why it's small. It's NOT fine for deciding which overlay-placement
  // algorithm to use — that needs to know whether this is genuinely a
  // small-screen PHONE, since a narrowed desktop window should keep
  // getting the desktop placement rules no matter how far it's shrunk.
  // pointer:coarse is true for a touch-primary device (a phone) and false
  // for a mouse/trackpad-primary one (any laptop/desktop, even a
  // touchscreen 2-in-1, since a connected mouse/trackpad remains the
  // PRIMARY pointer there) — combined with the existing size check, this
  // reliably tells the two apart. iPad never reaches this at all: its
  // short edge stays well above MOBILE_MAX_SHORT_EDGE in any orientation,
  // so it's already excluded before this even needs to run.
  function isPhoneFormFactor() {
    return isMobileViewport() && window.matchMedia('(pointer: coarse)').matches;
  }
  // The zoom level growth starts FROM has to reflect the CURRENT
  // viewport's own aspect ratio, not whatever it was at page load:
  // fitting all 76 US-spanning stadiums into a tall, narrow portrait
  // viewport needs a much lower zoom (more zoomed OUT — a narrow width
  // fits far less longitude per zoom level than a wide one) than fitting
  // them into a wide landscape one. defaultZoom already IS exactly that
  // real, correctly-fitted zoom, computed by applyDefaultView()'s actual
  // fitBounds call (same asymmetric panel-aware padding as the real view)
  // — and, since applyDefaultView() now re-runs on every resize/rotation
  // (see the resize listener further down), defaultZoom always reflects
  // whichever orientation you're actually holding the phone in right now.
  // Reading it directly here (rather than approximating separately with
  // getBoundsZoom, which doesn't accept the real fit's asymmetric
  // padding) keeps this exactly in sync with the real view instead of
  // subtly drifting from it — that drift, worth more of the narrow
  // portrait width than the wide landscape one, was exactly why growth
  // wasn't visibly working in portrait: the approximated start was
  // ending up noticeably higher than the real resting zoom, so the dots
  // were already most of the way (or all the way) grown before you even
  // started zooming in, with no room left to visibly grow into.
  //
  // How far through the [defaultZoom, maxZoom] range each device class
  // reaches full grown size — desktop/tablet dots reach it halfway in;
  // mobile (both dots and, on mobile only, the logo markers) take longer,
  // reaching it three-quarters of the way in, since on a phone the growth
  // is much more noticeable (larger multiplier) and was hitting full size
  // uncomfortably fast at the halfway mark.
  const DESKTOP_GROWTH_FRACTION = 0.5;
  const MOBILE_GROWTH_FRACTION = 0.75;
  function zoomEndFor(fraction) {
    return defaultZoom + (map.getMaxZoom() - defaultZoom) * fraction;
  }
  // Interpolates from base to max between defaultZoom (the real,
  // currently-fitted default view's zoom — see above) and the fraction-
  // determined end zoom, holding flat outside that range — shared timing
  // curve for every kind of marker growth, just with a different
  // base/max/fraction per kind and device class.
  function growValueForZoom(zoom, base, max, fraction) {
    const end = zoomEndFor(fraction);
    if (end <= defaultZoom) return max;
    if (zoom <= defaultZoom) return base;
    if (zoom >= end) return max;
    const t = (zoom - defaultZoom) / (end - defaultZoom);
    return base + t * (max - base);
  }
  // Dedicated multiplier for former/historic/future dots on mobile —
  // deliberately separate from MOBILE_GROWTH_MULTIPLIER (which still
  // governs the current-stadium logo markers' own mobile growth) so
  // doubling how big these dots get to doesn't also double the logo
  // markers, which weren't part of this request.
  const DOT_MOBILE_GROWTH_MULTIPLIER = MOBILE_GROWTH_MULTIPLIER * 2;
  // The logo marker's circleSize parameter (whatever logoDiameterForZoom
  // returns) is NOT the radius of its visible white circle — logoIcon
  // insets that circle by 2.5*scale (see logoIcon's own bg circle), so
  // the actual rendered edge sits noticeably inside circleSize/2 (15.5px
  // of an 18px half-diameter at the base size, for example). Clamping
  // dot growth to the naive circleSize/2 was exactly this gap too
  // generous — about 16% — which is why dots were still visibly
  // outgrowing the logo markers despite the clamp. This mirrors that same
  // inset math so the two actually match.
  function logoVisibleRadiusForZoom(zoom) {
    const circleSize = logoDiameterForZoom(zoom);
    const scale = circleSize / LOGO_ICON_SIZE;
    return circleSize / 2 - 2.5 * scale;
  }
  // Even after matching the logo marker's true visible radius exactly
  // (see logoVisibleRadiusForZoom), a fully-grown dot still read as
  // slightly bigger than the logo markers next to it — plausibly the
  // dot's own stroke outline (drawn straddling its path, so it adds a
  // little beyond the plain radius) plus a filled circle simply reading
  // as a bit more visually "present" than a bordered-white-circle logo
  // badge at identical geometric size. Rather than chase that precisely,
  // clamp at a flat 90% of the logo's own radius as a safety margin.
  const DOT_MAX_VS_LOGO_FACTOR = 0.9;
  // Former/historic/future dot radius for the given zoom: on desktop/
  // tablet this aims for FULL_MARKER_RADIUS; on mobile it aims for
  // DOT_MOBILE_GROWTH_MULTIPLIER times the dot's own base radius. Either
  // way, the result is then hard-clamped to DOT_MAX_VS_LOGO_FACTOR times
  // logoVisibleRadiusForZoom, so these dots grow noticeably but stay
  // visibly no larger than the "real" current-stadium markers.
  function dotRadiusForZoom(zoom) {
    const mobile = isMobileViewport();
    const max = mobile ? MARKER_RADIUS * DOT_MOBILE_GROWTH_MULTIPLIER : FULL_MARKER_RADIUS;
    const raw = growValueForZoom(zoom, MARKER_RADIUS, max, mobile ? MOBILE_GROWTH_FRACTION : DESKTOP_GROWTH_FRACTION);

    // Computed BEFORE measureEl is repointed at the real html below —
    // computeHeaderFit uses measureEl itself as scratch space for its own
    // pinned-width probe (cached after the first call per stadium), so it
    // has to finish before this function overwrites measureEl's content
    // with what's actually being measured here.
    const fit = computeHeaderFit(stadium);
    measureEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    // Must mirror whatever showOverlay() sets on the real element below —
    // .expanded is display:flex, and measuring it as display:block (this
    // element's static default) would let its flex-only sizing rules
    // (min-height:0 on the scroll wrap, in particular) silently not apply,
    // risking a measured height that doesn't match what's actually shown.
    measureEl.style.display = pinned ? 'flex' : 'block';
    measureEl.innerHTML = html;
    applyHeaderFit(measureEl, fit);
    return { w: measureEl.offsetWidth, h: measureEl.offsetHeight };
  }

  // Phone form factor's pinned/full panel: a fixed drawer, not a box
  // sized/positioned around the marker (see computePlacementSimple just
  // below, kept only as a defensive fallback — see showOverlay). Portrait
  // fills the bottom two-thirds of the screen at full width; landscape
  // fills the right HALF at full height — the marker itself gets panned
  // clear of whichever edge borders the drawer instead (see showOverlay's
  // phone branch's clearance check, which reads this same fraction so the
  // two stay in sync). Pure function of the current screen size, nothing
  // else.
  const PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION = 2 / 3;
  function computePlacementPhoneDrawer(mapSize) {
    const landscape = mapSize.x >= mapSize.y;
    if (landscape) return { left: mapSize.x / 2, top: 0, width: mapSize.x / 2, height: mapSize.y };
    const height = mapSize.y * PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION;
    return { left: 0, top: mapSize.y - height, width: mapSize.x, height };
  }

  // Mobile placement only (see computeStadiumPlacement below for desktop/
  // tablet) — mobile skips the condensed hover step entirely and taps
  // straight to the full panel. Superseded by computePlacementPhoneDrawer
  // above for the pinned case (the only case that actually reaches this
  // on a real phone — see showOverlay); kept as a defensive fallback for
  // the (currently theoretical) unpinned/condensed phone case.
  // Prefers placing the box below the dot; if it doesn't fit, to the
  // right; if that doesn't fit either, above-and-left of the dot; and as
  // an absolute last resort, centered over the dot. Always clamped to
  // stay fully inside the current window.
  function computePlacementSimple(anchor, w, h, mapSize) {
    let mode, left, top;
    if (anchor.x - OV_INSET + w + OV_MARGIN <= mapSize.x && anchor.y + OV_GAP + h + OV_MARGIN <= mapSize.y) {
      mode = 'below';
      left = anchor.x - OV_INSET;
      top = anchor.y + OV_GAP;
    } else if (anchor.x + OV_GAP + w + OV_MARGIN <= mapSize.x && anchor.y - OV_INSET + h + OV_MARGIN <= mapSize.y) {
      mode = 'right';
      left = anchor.x + OV_GAP;
      top = anchor.y - OV_INSET;
    } else if (anchor.x - OV_GAP - w >= OV_MARGIN && anchor.y - OV_GAP - h >= OV_MARGIN) {
      mode = 'above-left';
      left = anchor.x - OV_GAP - w;
      top = anchor.y - OV_GAP - h;
    } else {
      mode = 'over-dot';
      left = anchor.x - w / 2;
      top = anchor.y - h / 2;
    }
    left = Math.min(Math.max(left, OV_MARGIN), Math.max(OV_MARGIN, mapSize.x - w - OV_MARGIN));
    top = Math.min(Math.max(top, OV_MARGIN), Math.max(OV_MARGIN, mapSize.y - h - OV_MARGIN));
    return { mode, left, top };
  }

  // Desktop/laptop/iPad placement — anything that isn't a genuine phone
  // (see isPhoneFormFactor; deliberately NOT isMobileViewport alone, which
  // would also catch an ordinary narrowed desktop browser window). The
  // condensed preview and the pinned full
  // panel have to agree in advance on which side of the marker they're
  // both going to live on, since the whole point is that clicking to pin
  // reads as an in-place expansion, never a jump to a different spot:
  //
  // Preferred side is the marker's right, top-edge-aligned with the
  // marker's own top — that's checked against the FULL panel's size
  // (fixed ~340px wide, height varies per stadium's content), not the
  // condensed preview's own smaller size, because the side has to work
  // for whichever one ends up showing. Left is the fallback if right
  // doesn't fit, and centered-over-the-marker is the last resort if
  // neither side has room (only really happens at a very small window
  // size).
  //
  // Vertically, the preferred behavior is also top-aligned with the
  // marker, letting the full panel extend straight downward from there —
  // but if the full panel is tall enough that this would clip it at the
  // bottom of the window, it instead hugs the bottom (OV_EDGE_MARGIN up
  // from the window's bottom edge) and grows upward only as far as it
  // needs to, rather than clipping. The condensed preview always stays
  // top-aligned with the marker regardless — it's short enough that this
  // essentially never clips, and that's what makes the RIGHT-side expand
  // read as "in place": both states share the same top-left corner, so
  // expanding only ever adds space to the right and below, never
  // relocating anything already on screen.
  //
  // On the LEFT side that same "share a corner" trick can't rely on the
  // literal same corner — the panel's felt anchor there is its RIGHT edge
  // (nearest the marker), with everything extending leftward from it. If
  // the condensed preview were left at its own (narrower) natural width,
  // expanding it to the full panel's width would widen it further to the
  // LEFT, visibly shifting the header text left as it expands. So on this
  // side the condensed preview is pre-sized to the FULL panel's width
  // from the start (blank space trailing the short header content is the
  // trade-off), giving both states the exact same left edge and leaving
  // the text that's actually there completely still.
  const OV_MARKER_GAP = 8;    // gap between the marker's own edge and the panel
  const OV_EDGE_MARGIN = 10;  // margin kept from the window edge
  function computeStadiumPlacement(anchor, r, fullSize, condensedSize, mapSize) {
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
    const rightEdge = anchor.x + r;
    const leftEdge = anchor.x - r;
    const topEdge = anchor.y - r;

    const fitsRight = rightEdge + OV_MARKER_GAP + fullSize.w + OV_EDGE_MARGIN <= mapSize.x;
    const fitsLeft = leftEdge - OV_MARKER_GAP - fullSize.w - OV_EDGE_MARGIN >= 0;

    if (!fitsRight && !fitsLeft) {
      // Last resort: neither side has room for the full panel. Dead-
      // centering it directly over the marker was the original approach
      // here, but that hides the very marker the panel is describing —
      // not legible, and not what "last resort" should mean. Stack it
      // below the marker instead (above, if below doesn't fit either),
      // horizontally centered on the marker and pre-sized to the full
      // panel's width — the same "shared edges" trick as the left-side
      // case above, so there's still no horizontal shift on expand. This
      // keeps both the marker and the panel visible and legible at
      // essentially any window size; only a window too short for even the
      // condensed preview's own small height would still clip it, which
      // in practice shouldn't happen outside a genuinely pathological
      // window.
      const sharedLeft = clamp(anchor.x - fullSize.w / 2, OV_EDGE_MARGIN, mapSize.x - fullSize.w - OV_EDGE_MARGIN);
      const bottomEdge = anchor.y + r;
      const stackVertical = (size) => {
        if (bottomEdge + OV_MARKER_GAP + size.h + OV_EDGE_MARGIN <= mapSize.y) {
          return bottomEdge + OV_MARKER_GAP; // below the marker
        }
        if (topEdge - OV_MARKER_GAP - size.h - OV_EDGE_MARGIN >= 0) {
          return topEdge - OV_MARKER_GAP - size.h; // above the marker
        }
        // Neither direction has full clearance — pick below and let the
        // outer clamp pull it back fully on screen.
        return clamp(bottomEdge + OV_MARKER_GAP, OV_EDGE_MARGIN, mapSize.y - size.h - OV_EDGE_MARGIN);
      };
      return {
        full: { left: sharedLeft, top: stackVertical(fullSize) },
        condensed: { left: sharedLeft, top: stackVertical(condensedSize), width: fullSize.w }
      };
    }

    const side = fitsRight ? 'right' : 'left';
    const sharedLeft = clamp(
      side === 'right' ? rightEdge + OV_MARKER_GAP : leftEdge - OV_MARKER_GAP - fullSize.w,
      OV_EDGE_MARGIN,
      Math.max(OV_EDGE_MARGIN, mapSize.x - fullSize.w - OV_EDGE_MARGIN)
    );

    const fitsBelow = topEdge + fullSize.h + OV_EDGE_MARGIN <= mapSize.y;
    const fullTop = fitsBelow
      ? topEdge
      : Math.max(OV_EDGE_MARGIN, mapSize.y - OV_EDGE_MARGIN - fullSize.h);

    const condensedTop = clamp(topEdge, OV_EDGE_MARGIN, mapSize.y - condensedSize.h - OV_EDGE_MARGIN);

    return {
      full: { left: sharedLeft, top: fullTop },
      condensed: { left: sharedLeft, top: condensedTop, width: side === 'left' ? fullSize.w : null }
    };
  }

  // Shows/hides each fade strip to match actual scroll position — top
  // fade hidden while already at the top (nothing hidden above yet),
  // bottom fade hidden once scrolled all the way down (or if the content
  // never overflowed in the first place).
  function updateScrollFades(scrollEl) {
    const wrap = scrollEl.parentElement;
    const fadeTop = wrap.querySelector('.ov-fade-top');
    const fadeBottom = wrap.querySelector('.ov-fade-bottom');
    const atTop = scrollEl.scrollTop <= 1;
    const atBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 1;
    if (fadeTop) fadeTop.style.opacity = atTop ? '0' : '1';
    if (fadeBottom) fadeBottom.style.opacity = atBottom ? '0' : '1';
  }

  // The invisible corridor connecting a marker to its condensed preview
  // panel, so a mouse crossing the small gap between the two — genuinely
  // empty map, not marker and not panel — doesn't read as "left the
  // hoverable area." Exactly one marker-diameter (2r) wide, running along
  // whichever axis actually separates the two boxes: a horizontal strip
  // centered on the marker's own vertical center when the panel sits to
  // its left or right, or a vertical strip centered on the marker's
  // horizontal center when the panel sits above or below. Returns null if
  // the two boxes already touch/overlap (last-resort placements can land
  // right up against the marker) — no corridor is needed there.
  function computeHoverBridge(anchor, r, panelLeft, panelTop, panelW, panelH) {
    const mLeft = anchor.x - r, mRight = anchor.x + r;
    const mTop = anchor.y - r, mBottom = anchor.y + r;
    const pLeft = panelLeft, pRight = panelLeft + panelW;
    const pTop = panelTop, pBottom = panelTop + panelH;
    if (pLeft >= mRight || pRight <= mLeft) {
      return {
        left: Math.min(mRight, pRight), right: Math.max(mLeft, pLeft),
        top: anchor.y - r, bottom: anchor.y + r
      };
    }
    if (pTop >= mBottom || pBottom <= mTop) {
      return {
        left: anchor.x - r, right: anchor.x + r,
        top: Math.min(mBottom, pBottom), bottom: Math.max(mTop, pTop)
      };
    }
    return null;
  }

  function showOverlay(stadium, marker, pinned) {
    // Two-stage overlay: hovering shows just the condensed header (logo,
    // stadium name, team name); clicking pins it open and swaps in the full
    // info (stars, years, visit history, etc.).
    const html = pinned ? stadium.fullBodyHtml : stadium.condensedHtml;
    const anchor = map.latLngToContainerPoint(marker.getLatLng());
    const mapSize = map.getSize();
    const fit = computeHeaderFit(stadium);

    let left, top, forcedWidth = null, forcedHeight = null, isPhoneDrawer = false, phoneDrawerLandscape = false;
    if (isPhoneFormFactor()) {

      // shows on a real phone at all (see isPhoneFormFactor's own
      // comment: the hover preview is gated to pointerType 'mouse',
      // which a touch tap never is). The unpinned branch below is a
      // defensive fallback, not a real path.
      if (pinned) {
        isPhoneDrawer = true;

        // pinned "session" — see phoneDrawerPreTapCenter's own comment.
        // Deliberately not overwritten on a later call caused by tapping
        // a DIFFERENT marker while one's already pinned, or by a
        // rotation re-running this via repositionPinned.
        if (phoneDrawerPreTapCenter === null) phoneDrawerPreTapCenter = map.getCenter();
        // Only pan if the marker isn't ALREADY comfortably clear of the
        // drawer — "clear" meaning at least PHONE_DRAWER_CLEARANCE px from
        // the drawer's near edge (its top edge in portrait, its left edge
        // in landscape). When a pan IS needed, move the minimum amount to
        // bring it exactly to that clearance, not all the way to the
        // center of the open half — the marker just needs to be visible
        // and unambiguous, not perfectly centered. Single-axis only:
        // vertical in portrait, horizontal in landscape, matching
        // computePlacementPhoneDrawer's own split — the other axis is
        // never touched. Panning by a pixel offset rather than computing
        // a new LatLng directly keeps this exact regardless of projection.
        const landscape = mapSize.x >= mapSize.y;
        phoneDrawerLandscape = landscape;
        let dx = 0, dy = 0;
        if (landscape) {
          const maxX = mapSize.x / 2 - PHONE_DRAWER_CLEARANCE;
          if (anchor.x > maxX) dx = anchor.x - maxX;
        } else {
          const maxY = mapSize.y * (1 - PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION) - PHONE_DRAWER_CLEARANCE;
          if (anchor.y > maxY) dy = anchor.y - maxY;
        }
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
          suppressPinDismissOnMove = true;
          map.panBy([dx, dy], { animate: true, duration: 0.3 });
          map.once('moveend', () => { suppressPinDismissOnMove = false; });
        }
        const placement = computePlacementPhoneDrawer(mapSize);
        left = placement.left;
        top = placement.top;
        forcedWidth = placement.width;
        forcedHeight = placement.height;
        // The drawer doesn't sit next to the marker the way the desktop
        // overlay does, so grow the marker itself to keep the connection
        // between the two obvious — see setPinnedMarkerBoost's own
        // comment. Restored on dismiss (see dismissPinned).
        setPinnedMarkerBoost(stadium.name);
      } else {
        const size = measureBox(html, pinned, stadium);
        const placement = computePlacementSimple(anchor, size.w, size.h, mapSize);
        left = placement.left;
        top = placement.top;
      }
      hoverBridge = null; // hover-leeway only applies on hover-capable desktop/laptop/iPad
    } else {
      // Both sizes are needed regardless of which one is actually being
      // shown right now — see computeStadiumPlacement's own comment for
      // why the placement decision always has to be made from the FULL
      // panel's size, even while only the condensed preview is on screen.
      const fullSize = measureBox(stadium.fullBodyHtml, true, stadium);
      const condensedSize = measureBox(stadium.condensedHtml, false, stadium);
      const r = hitRadiusPx(stadium);
      const plan = computeStadiumPlacement(anchor, r, fullSize, condensedSize, mapSize);
      const chosen = pinned ? plan.full : plan.condensed;
      left = chosen.left;
      top = chosen.top;
      forcedWidth = pinned ? null : chosen.width;
      // Only the condensed (unpinned) preview ever gets dismissed by mouse
      // movement — a pinned panel stays open regardless — so the bridge
      // only needs to exist for that case.
      hoverBridge = pinned ? null : computeHoverBridge(
        anchor, r, left, top,
        forcedWidth != null ? forcedWidth : condensedSize.w,
        condensedSize.h
      );
    }

    overlayEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + (isPhoneDrawer ? ' phone-drawer' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    overlayEl.innerHTML = html + (pinned ? '<button type="button" class="ov-close" aria-label="Close">&times;</button>' : '');
    // Forced only for the condensed preview's left-side placement, or the
    // phone drawer (see computeStadiumPlacement/computePlacementPhoneDrawer)
    // — every other case relies on the CSS default (auto-width for
    // condensed, the fixed pinned width for expanded; auto-height always,
    // except the phone drawer's fixed half-screen height).
    overlayEl.style.width = forcedWidth != null ? forcedWidth + 'px' : '';
    overlayEl.style.height = forcedHeight != null ? forcedHeight + 'px' : '';
    overlayEl.style.left = left + 'px';
    overlayEl.style.top = top + 'px';
    // .expanded is display:flex (pinned header + independently-scrolling
    // body); the condensed hover preview stays a plain block box.
    overlayEl.style.display = pinned ? 'flex' : 'block';
    // Subtle slide+fade entrance for the phone drawer only: rather than
    // animating the drawer's full travel from off-screen, we deliberately
    // only show the LAST 10% of that slide — it starts already 90% of the
    // way to its resting position (translateX/Y(10%), which resolves
    // against the drawer's own width/height, whatever that is for the
    // current portrait/landscape size) and opacity 0, then transitions to
    // translate(0)/opacity 1. Re-applied on every call that opens/updates
    // the drawer (a fresh tap, or switching to a different pinned stadium
    // while it's already open) since each is functionally a fresh
    // appearance. The non-phone-drawer branch explicitly clears these so
    // no stale transform/opacity ever leaks into the desktop overlay.
    if (isPhoneDrawer && !suppressPhoneDrawerEntrance) {
      overlayEl.style.transition = 'none';
      overlayEl.style.opacity = '0';
      overlayEl.style.transform = phoneDrawerLandscape ? 'translateX(10%)' : 'translateY(10%)';
      // Force a reflow so the browser commits the pre-animation state
      // above before transitions are re-enabled — otherwise the two style
      // writes coalesce into one and there's nothing left to animate.
      void overlayEl.offsetHeight;
      overlayEl.style.transition = 'transform 200ms ease-out, opacity 200ms ease-out';
      overlayEl.style.opacity = '1';
      overlayEl.style.transform = phoneDrawerLandscape ? 'translateX(0)' : 'translateY(0)';
    } else if (!isPhoneDrawer) {
      overlayEl.style.transition = '';
      overlayEl.style.opacity = '';
      overlayEl.style.transform = '';
    }
    // else: isPhoneDrawer && suppressPhoneDrawerEntrance — a reposition of
    // an already-open drawer, so deliberately leave transform/opacity/
    // transition untouched and just let the left/top/width/height changes
    // above take effect instantly.
    // applyHeaderFit just assigns the already-computed (pinned-width-based)
    // font-size/letter-spacing values — no live measurement here, so it
    // doesn't matter that this runs on both modes and doesn't need the box
    // laid out first.
    applyHeaderFit(overlayEl, fit);

    // The scrollable body is rebuilt fresh every call (innerHTML above),
    // so its fade state and scroll listener need re-wiring each time too.
    if (pinned) {
      const scrollEl = overlayEl.querySelector('.ov-scroll');
      if (scrollEl) {
        // Inset the fades from the right edge by however wide the actual
        // scrollbar is on this system (0 on systems with overlay
        // scrollbars, ~15-17px on Windows/some Linux) — otherwise the
        // fade paints straight over the scrollbar track, including its
        // clickable up/down arrow buttons where present.
        const scrollbarWidth = scrollEl.offsetWidth - scrollEl.clientWidth;
        const wrap = scrollEl.parentElement;
        const fadeTop = wrap.querySelector('.ov-fade-top');
        const fadeBottom = wrap.querySelector('.ov-fade-bottom');
        if (fadeTop) fadeTop.style.right = scrollbarWidth + 'px';
        if (fadeBottom) fadeBottom.style.right = scrollbarWidth + 'px';
        updateScrollFades(scrollEl);
        scrollEl.addEventListener('scroll', () => updateScrollFades(scrollEl));
      }
    }
  }

  // restoreView defaults to true (deliberate dismissal: the X button, a
  // tap on empty map, or interacting with the filters menu) — pass false
  // only for the "the user is already dragging/zooming away" case (see
  // the movestart/zoomstart listener below), where programmatically
  // panning back to the pre-tap center would fight the gesture already in
  // progress instead of just getting out of its way.
  function dismissPinned(restoreView) {
    if (restoreView === undefined) restoreView = true;
    pinnedStadiumName = null;
    pinnedMarkerRef = null;
    // display:none alone doesn't stop a cross-origin YouTube iframe from
    // playing — the video keeps running (and audible) in the background
    // since the element is still in the DOM. Force it to stop by knocking
    // any embedded video iframes off their YouTube src before hiding the
    // panel; buildVideoHtml() regenerates a fresh iframe with the real src
    // the next time this stadium's overlay is opened, so this has no
    // lasting effect beyond stopping the current playback.
    overlayEl.querySelectorAll('.ov-video-wrap iframe').forEach(f => { f.src = 'about:blank'; });
    overlayEl.style.display = 'none';
    overlayEl.classList.remove('phone-drawer');
    hoverBridge = null;
    clearPinnedMarkerBoost();
    if (restoreView && phoneDrawerPreTapCenter) {
      const restoreCenter = phoneDrawerPreTapCenter;
      phoneDrawerPreTapCenter = null;
      suppressPinDismissOnMove = true;
      map.panTo(restoreCenter, { animate: true, duration: 0.3 });
      map.once('moveend', () => { suppressPinDismissOnMove = false; });
    } else {
      phoneDrawerPreTapCenter = null;
    }
  }

  // Repositions the pinned overlay to follow its dot after a pan/zoom/
  // resize, rather than dismissing it.
  //
  // Bails out entirely while anything on the page is in native fullscreen
  // (document.fullscreenElement set) — entering fullscreen on an embedded
  // YouTube video fires a viewport resize just like a rotation would, which
  // otherwise reaches this function via scheduleViewRefit and rebuilds the
  // overlay's innerHTML from stadium.fullBodyHtml. That destroys the very
  // <iframe> element that's mid-fullscreen: the browser briefly shows the
  // fullscreen frame, then the DOM node backing it is gone (video vanishes,
  // audio keeps playing from the detached element, and the page's own
  // interactivity is left stuck until Escape is pressed). Skipping the
  // rebuild while fullscreen is active avoids ever touching that DOM node;
  // exiting fullscreen fires its own resize event, so a normal reposition
  // still happens right afterward once currentFullscreenEl() is null again.
  function repositionPinned() {
    if (!pinnedStadiumName) return;
    if (currentFullscreenEl()) return;
    const marker = pinnedMarkerRef;
    const stadium = stadiumByName[pinnedStadiumName];
    if (marker && stadium) {
      suppressPhoneDrawerEntrance = true;
      showOverlay(stadium, marker, true);
      suppressPhoneDrawerEntrance = false;
    }
  }

  // --- Full-screen photo lightbox ---
  // Deliberately placed outside #map in the markup (see the body), so it
  // can never be mistaken for a map-contained element the way the
  // stadium overlay itself has to guard against below.
  const lightboxEl = document.getElementById('photo-lightbox');
  const lightboxImgEl = document.getElementById('photo-lightbox-img');
  const lightboxCreditEl = document.getElementById('photo-lightbox-credit');
  const lightboxFullscreenBtn = document.getElementById('photo-lightbox-fullscreen-btn');
  // Standard + WebKit-prefixed Fullscreen API, feature-detected once up
  // front. Desktop Chrome/Firefox/Edge/Safari and Android Chrome all
  // support requesting fullscreen on an arbitrary element; iPhone Safari
  // does not (only <video> gets its own native fullscreen there), so the
  // button is simply hidden rather than shown-but-broken.
  const FS_ENTER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
  const FS_EXIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
  function fullscreenSupported() {
    return !!(lightboxEl.requestFullscreen || lightboxEl.webkitRequestFullscreen);
  }
  function currentFullscreenEl() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  // Fixes an embedded YouTube video's own fullscreen button: the video
  // flashes fullscreen for an instant then goes invisible (audio keeps
  // playing, Escape is needed to get out) even though the Fullscreen API
  // correctly reports it active. Root cause is .stadium-overlay's
  // `overflow: hidden` (for its rounded corners) and .ov-scroll's
  // `overflow-y: auto; max-height: 50vh` (for the scrolling body) — Chrome
  // and Safari don't reliably promote a fullscreened CROSS-ORIGIN iframe
  // out of an ancestor's overflow-clip region, so it keeps getting clipped
  // to that ancestor's box even while "fullscreen". Toggling a class that
  // neutralizes both ancestors' clipping for exactly as long as something
  // inside the overlay is actually fullscreen sidesteps the bug without
  // touching their normal (non-fullscreen) behavior at all.
  function updateOverlayFullscreenClipping() {
    const fsEl = currentFullscreenEl();
    overlayEl.classList.toggle('has-fullscreen-descendant', !!(fsEl && overlayEl.contains(fsEl)));
  }
  document.addEventListener('fullscreenchange', updateOverlayFullscreenClipping);
  document.addEventListener('webkitfullscreenchange', updateOverlayFullscreenClipping);
  function requestLightboxFullscreen() {
    if (lightboxEl.requestFullscreen) return lightboxEl.requestFullscreen();
    if (lightboxEl.webkitRequestFullscreen) return lightboxEl.webkitRequestFullscreen();
  }
  function exitFullscreen() {
    if (document.exitFullscreen) return document.exitFullscreen();
    if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  }
  function updateFullscreenBtnState() {
    const active = currentFullscreenEl() === lightboxEl;
    lightboxFullscreenBtn.innerHTML = active ? FS_EXIT_ICON : FS_ENTER_ICON;
    lightboxFullscreenBtn.setAttribute('aria-label', active ? 'Exit full screen' : 'Full screen');
  }
  if (fullscreenSupported()) {
    updateFullscreenBtnState();
    lightboxFullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentFullscreenEl() === lightboxEl) {
        exitFullscreen();
      } else {
        requestLightboxFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenBtnState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnState);
  } else {
    lightboxFullscreenBtn.style.display = 'none';
  }
  // The caption/credit box is explicitly pinned, in JS, to the photo's own
  // *rendered* width (rather than trusting CSS intrinsic sizing) so that a
  // long caption can never inflate the box wider than the image itself —
  // that mismatch previously showed up as a stray semi-transparent
  // (box-shadow) rectangle wider than the photo on long-caption photos.
  function syncLightboxCreditWidth() {
    if (lightboxImgEl.offsetWidth) {
      lightboxCreditEl.style.width = lightboxImgEl.offsetWidth + 'px';
    }
  }
  function openLightbox(photo, kind) {
    lightboxImgEl.src = photo.url;
    lightboxCreditEl.innerHTML = kind === 'personal'
      ? (photo.caption || '')
      : (photo.credit ? `Photo: <a href="${photo.creditUrl}" target="_blank" rel="noopener">${photo.credit}</a>` : '');
    lightboxCreditEl.style.width = '';
    lightboxEl.style.display = 'flex';
    lightboxImgEl.onload = syncLightboxCreditWidth;
    if (lightboxImgEl.complete) syncLightboxCreditWidth();
    window.addEventListener('resize', syncLightboxCreditWidth);
  }
  function closeLightbox() {
    if (fullscreenSupported() && currentFullscreenEl() === lightboxEl) exitFullscreen();
    lightboxEl.style.display = 'none';
    lightboxImgEl.src = '';
    window.removeEventListener('resize', syncLightboxCreditWidth);
  }
  // Closes on a click anywhere on the dark backdrop or the close button,
  // but not on the image or credit/caption themselves (children of the
  // backdrop too, so excluded explicitly).
  lightboxEl.addEventListener('click', (e) => {
    if (e.target === lightboxEl || e.target.closest('.photo-lightbox-close')) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightboxEl.style.display !== 'none') closeLightbox();
  });

  overlayEl.addEventListener('click', (e) => {
    e.stopPropagation(); // clicking inside the overlay must not bubble to the map
    if (e.target.closest('.ov-close')) { dismissPinned(); return; }
    const photoEl = e.target.closest('.ov-photo');
    // lastDragMoved (tracked below) tells a genuine click-to-expand apart
    // from the mouseup at the end of a click-and-drag scroll gesture that
    // happened to end up over a photo — only the former should open it.
    if (photoEl && !lastDragMoved) {
      const stadium = stadiumByName[pinnedStadiumName];
      const kind = photoEl.dataset.photoKind;
      const idx = Number(photoEl.dataset.photoIdx);
      const list = stadium && (kind === 'personal' ? stadium.personalPhotos : stadium.photos);
      if (list && list[idx]) openLightbox(list[idx], kind);
      return;
    }
    // Not pinned yet means this is still just the condensed hover preview
    // — clicking IT should pin/expand exactly like clicking its marker
    // does, so the panel itself is as much a click target as the dot.
    if (!pinnedStadiumName && hoveredStadiumName) {
      const stadium = stadiumByName[hoveredStadiumName];
      const marker = hoveredMarkerRef;
      if (stadium && marker) {
        pinnedStadiumName = hoveredStadiumName;
        pinnedMarkerRef = marker;
        showOverlay(stadium, marker, true);
      }
    }
  });

  // Leaflet's own map-drag and scroll-wheel-zoom handlers listen on the
  // map container, which the overlay lives inside — so without stopping
  // these here too, a mousedown/touchstart/wheel that starts on the
  // overlay (e.g. trying to drag-scroll its content) bubbles up and
  // Leaflet treats it as "start panning/zooming the map," which then
  // dismisses the overlay via the movestart/zoomstart listener below.
  // Stopping them at the source is what lets the overlay's own scrolling
  // work at all, and keeps outside interactions (actually dragging the
  // map) still panning — and dismissing — normally.
  overlayEl.addEventListener('wheel', (e) => { e.stopPropagation(); });
  overlayEl.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });

  // Click-and-drag-to-scroll with the mouse: browsers only do this
  // natively for touch, so the mouse version is hand-rolled — track the
  // pointer's Y on mousedown, adjust .ov-scroll's scrollTop by the delta
  // on every subsequent mousemove, and stop on mouseup. Listening on
  // window (not just the overlay) for move/up means the drag keeps
  // tracking correctly even if the cursor slips outside the overlay's
  // bounds mid-drag. The "moved" flag (surfaced as lastDragMoved on
  // mouseup) is what lets the click handler above tell a real click on a
  // photo apart from a drag-to-scroll that ends on top of one.
  let scrollDrag = null;
  let lastDragMoved = false;
  overlayEl.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    const scrollEl = e.target.closest('.ov-scroll');
    if (!scrollEl || e.target.closest('a, button')) return;
    scrollDrag = { scrollEl, startY: e.clientY, startScrollTop: scrollEl.scrollTop, moved: false };
    scrollEl.classList.add('ov-dragging');
    e.preventDefault(); // avoid native text selection while dragging
  });
  window.addEventListener('mousemove', (e) => {
    if (!scrollDrag) return;
    const dy = e.clientY - scrollDrag.startY;
    if (Math.abs(dy) > 3) scrollDrag.moved = true;
    scrollDrag.scrollEl.scrollTop = scrollDrag.startScrollTop - dy;
  });
  window.addEventListener('mouseup', () => {
    if (!scrollDrag) return;
    lastDragMoved = scrollDrag.moved;
    scrollDrag.scrollEl.classList.remove('ov-dragging');
    scrollDrag = null;
  });

  // Dismiss the pinned overlay on any interaction with the filters menu
  // (checkbox clicks, "show all" toggles, the collapse button, or clicking
  // a filter row) — and likewise for the Stories menu.
  const filtersPanelEl = document.getElementById('filters-panel');
  const filtersBodyEl = document.getElementById('filters-body');
  filtersPanelEl.addEventListener('click', () => { if (pinnedStadiumName) dismissPinned(); });
  filtersPanelEl.addEventListener('change', () => { if (pinnedStadiumName) dismissPinned(); });
  const storiesPanelEl = document.getElementById('stories-panel');
  storiesPanelEl.addEventListener('click', () => { if (pinnedStadiumName) dismissPinned(); });
  storiesPanelEl.addEventListener('change', () => { if (pinnedStadiumName) dismissPinned(); });

  // Any pan or zoom dismisses the overlay outright (pinned or not) — EXCEPT
  // when we're the ones driving that pan/zoom ourselves (the phone
  // drawer's marker-centering pan, or its dismiss-time restore pan; see
  // suppressPinDismissOnMove). And when it IS a real user gesture, don't
  // restore the phone drawer's pre-tap view on top of it — they're already
  // navigating somewhere else on purpose, so just get out of the way
  // (restoreView: false).
  map.on('movestart zoomstart', () => {
    if (!suppressPinDismissOnMove) dismissPinned(false);
  });

  stadiums.forEach(s => {
    const style = STYLES[s.category];
    // Current stadiums (visited or not) render as their team logo inside a
    // bordered white circle. Demolished stadiums — both former-visited and
    // historic-demolished — get a plain dot with a small white center dot,
    // to distinguish them from their "still exists" counterparts, which
    // otherwise share the same fill color. Everything else is a plain dot
    // (dotIcon) — a divIcon like the other two, not a raw circleMarker;
    // see dotIcon's own comment for why that switch mattered.
    const isCurrent = s.category === 'current_visited' || s.category === 'current_not_visited';
    // Fill color (dark gray vs medium gray, set in STYLES above) encodes
    // still-standing vs demolished. No white center dot anymore — it used
    // to flag "visited" but wasn't adding anything useful, so every
    // former/historic stadium (visited or not) is now a plain dot,
    // distinguished only by that fill color.
    const currentLogoSrc = s.logoUrl || `https://www.mlbstatic.com/team-logos/${s.teamId}.svg`;
    const dotBorderColor = style.color;
    const dotWeight = 1.5;
    const marker = isCurrent
      ? L.marker([s.lat, s.lon], { pane: 'pane-' + s.category, icon: logoIcon(style.color, currentLogoSrc, s.rating, LOGO_ICON_SIZE, false, starsVisible) })
      : L.marker([s.lat, s.lon], {
          pane: 'pane-' + s.category,
          icon: dotIcon(style.color, dotBorderColor, dotWeight, MARKER_RADIUS)
        });

    // Track every marker so its size can be re-evaluated on zoom/viewport
    // changes — see updateGrowingMarkerSizes. Former/historic/future dots
    // grow on every device; team-logo markers only actually change size
    // on mobile (logoDiameterForZoom returns the fixed LOGO_ICON_SIZE on
    // desktop/tablet, so the regenerated icon there is a no-op). name is
    // used to look up whether THIS marker is the one currently boosted by
    // the phone drawer (see pinnedBoostMarkerName).
    growingMarkers.push(isCurrent
      ? { marker, name: s.name, kind: 'logo', color: style.color, logoSrc: currentLogoSrc, rating: s.rating }
      : { marker, name: s.name, kind: 'dot', fillColor: style.color, borderColor: dotBorderColor, weight: dotWeight });

    {
      // Green Monster overlay content — one unified builder for every
      // category. Historic entries (no teamId) simply omit the logo chip
      // and the personal-visit fields (rating/ranking/games/milestones),
      // which fall away naturally since those data fields are absent.
      const hasTeamId = !!s.teamId;
      const logoSrc = s.logoUrl || (hasTeamId ? `https://www.mlbstatic.com/team-logos/${s.teamId}.svg` : null);
      // logoChipBg: optional per-stadium override for the chip's backing
      // color. A few historic logo images already have their own white
      // rectangular background baked in, which clashes against the chip's
      // default cream backing (visible seam/edge) — those entries set
      // logoChipBg: "#fff" so the chip matches the image's own background.
      const chipBgStyle = s.logoChipBg ? ` style="background:${s.logoChipBg}"` : '';
      const logoChipHtml = logoSrc
        ? `<div class="b-logo-chip"${chipBgStyle}><img src="${logoSrc}" onerror="this.style.display='none'"></div>`
        : '';
      const headerHtml =
        `<div class="b-name-band">
           ${logoChipHtml}
           <div class="b-name-stack">
             <div class="b-name">${s.displayName || s.name}</div>
             <div class="b-team">${teamLineHtml(s)}</div>
           </div>
         </div>`;

      const visited = s.gamesAttended != null;
      // A not-yet-visited stadium I actually expect to get to (current or
      // future-planned) gets a third metadata row noting when; a purely
      // historical reference entry (never on my list to visit) does not.
      const showNextVisit = !visited && (s.category === 'current_not_visited' || s.category === 'future_planned');
      const nextVisitLine = showNextVisit
        ? `<div class="b-meta-row"><span class="fs2">${
            s.projectedOpening
              ? `Projected opening: <span class="hl">${s.projectedOpening}</span>`
              : `Next visit: <span class="hl">${s.firstVisited || 'TBD'}</span>`
          }</span></div>`
        : '';
      // Single merged metadata block: city + star rating (bold/bright, top
      // row), then everything else in the dimmer fs2 style — the
      // building's own built-through-demolished years + ranking phrase,
      // one line per team that's called this stadium home (no "MLB
      // Years" label anymore, just the plain list), and finally a single
      // "Formerly ..."/"Also known as ..." line (sentence case, not the
      // old uppercase label) when former names exist. Each sub-part is
      // only included when it applies, so a future_planned stadium with
      // no tenant history and no former name still renders cleanly.
      const altNames = stripYearsFromAltNames(s.formerNames || s.akaNames);
      const altLabel = s.formerNames ? 'Formerly' : 'Also known as';
      const tenants = getTenants(s);
      const tenantListHtml = tenants.length
        ? `<div class="b-tenant-list">
             ${tenants.map(t => `<div class="b-tenant-line"><span class="fs2">${t.years}</span><span class="fs2">${t.team}</span></div>`).join('')}
           </div>`
        : '';
      const formerlyLineHtml = altNames
        ? `<div class="b-formerly-block fs2">${altLabel}&nbsp;${altNames}</div>`
        : '';
      const section1 =
        `<div class="b-slot">
           <div class="b-meta-row">
             <span class="fs1">${categoryStatusLabel(s.category)}&nbsp;MLB&nbsp;ballpark in&nbsp;${s.city.replace(/ /g, '&nbsp;')},&nbsp;${s.state}</span>
             <span class="b-stars">${s.rating ? starsHtml(s.rating) : ''}</span>
           </div>
           <div class="b-meta-row">
             <span class="fs2">${buildingYears(s)}</span>
             <span class="fs2">${s.ranking ? `My <span class="hl">#${s.ranking}</span> Stadium` : ''}</span>
           </div>
           ${nextVisitLine}
           ${tenantListHtml}
           ${formerlyLineHtml}
         </div>`;

      // Then, in order: public photos, commentary (visit sentences +
      // personal notes combined), personal photos — each only if present.
      const publicPhotos = buildPublicPhotosHtml(s);
      const publicPhotosHtml = publicPhotos ? `<div class="b-section-gap">${publicPhotos}</div>` : '';

      const video = buildVideoHtml(s);
      const videoHtml = video ? `<div class="b-section-gap">${video}</div>` : '';

      const commentaryParas = commentaryParagraphs(s);
      const commentaryHtml = commentaryParas.length
        ? `<div class="b-commentary b-section-gap">${commentaryParas.map(p => `<p>${p}</p>`).join('')}</div>`
        : '';

      const personalPhotos = buildPersonalPhotosHtml(s);
      const personalPhotosHtml = personalPhotos ? `<div class="b-section-gap">${personalPhotos}</div>` : '';

      const scrollBodyHtml =
        `<div class="b-meta-stack">${section1}</div>`
        + publicPhotosHtml + videoHtml + commentaryHtml + personalPhotosHtml;

      s.fullBodyHtml =
        `<div class="ov-pinned-header">${headerHtml}</div>
         <div class="ov-scroll-wrap">
           <div class="ov-scroll">${scrollBodyHtml}</div>
           <div class="ov-fade-top"></div>
           <div class="ov-fade-bottom"></div>
         </div>`;

      // Condensed hover preview: just the header band (logo, stadium name,
      // team name) — the rest is what click-to-expand is for.
      s.condensedHtml = headerHtml;
    }

    // Hover/click interactivity for every marker is handled by one global
    // hit-test below (see "Unified hover/click hit-testing"), not by
    // per-marker listeners — see that comment for why.
    marker.addTo(map);

    markersByCategory[s.category].push(marker);
    markerByName[s.name] = marker;
    stadiumByName[s.name] = s;
  });

  // Sync every marker to the correct size for the initial view (a no-op
  // for dots at the true default zoom, and a no-op for logo markers on
  // desktop/tablet — but harmless/correct to call either way).
  updateGrowingMarkerSizes();

  // Keeps every stadium marker (and, via resolveStateLabelOverlaps further
  // down, every state label) drawn on whichever copy of the world is
  // nearest the current view, so panning indefinitely east/west always has
  // North America — and its stadiums — right there rather than only ever
  // at their one true longitude. Bound to 'move' rather than 'moveend' so
  // this tracks live WHILE dragging, not just once you release, per the
  // "stadiums need to be there as I pan" requirement. Cheap to call on
  // every move frame: it's a no-op unless the rounded world count has
  // actually changed, which only happens once the view has panned roughly
  // 180° past whatever the last reference point was.
  const worldOffsetBaseLng = stadiumBounds.getCenter().lng;
  function updateWorldOffset() {
    const worldsAway = Math.round((map.getCenter().lng - worldOffsetBaseLng) / 360);
    const newOffset = worldsAway * 360;
    if (newOffset === worldOffsetDeg) return;
    worldOffsetDeg = newOffset;
    stadiums.forEach(s => {
      const m = markerByName[s.name];
      if (m) m.setLatLng([s.lat, s.lon + worldOffsetDeg]);
    });
    // Also shift every live year-story team marker — these aren't reached
    // by the loop above since they're not registered in markerByName (see
    // yearStoryMarkerByKey).
    Object.values(yearStoryMarkerByKey).forEach(entry => {
      entry.marker.setLatLng([entry.stadium.lat, entry.stadium.lon + worldOffsetDeg]);
    });
    // Same for the big story-number watermark — it's parked at a fixed
    // real-world lat/lng (south Idaho), not registered in markerByName.
    if (storyBigNumberMarker) {
      storyBigNumberMarker.setLatLng([STORY_BIG_NUMBER_LATLNG[0], STORY_BIG_NUMBER_LATLNG[1] + worldOffsetDeg]);
    }
    resolveStateLabelOverlaps();
  }
  map.on('move', updateWorldOffset);

  // --- Unified hover/click hit-testing ---
  // Every marker type (team-logo circle, plain dot, demolished dot) used to
  // wire its own mouseover/mouseout/click, relying on the browser's DOM
  // hit-testing to decide which marker the cursor is over. That broke down
  // whenever two markers' bounding boxes overlapped — e.g. a 5-star team
  // logo's large icon box (needed for the star badge) sitting on top of a
  // smaller, nearby former-stadium dot (Petco Park / Qualcomm Stadium in
  // San Diego is a real example): the logo marker's own transparent space
  // would swallow the hover intended for the dot underneath, no matter how
  // its own hit-radius check was written, because that check only governs
  // what the logo marker itself does — it can't hand the event to a
  // completely different DOM element. CSS pointer-events tricks to let
  // events "pass through" to whatever's underneath were tried and proved
  // unreliable across cases.
  //
  // Instead, this ignores DOM hit-testing (and therefore z-order/stacking)
  // entirely: one mousemove/click listener on the map itself computes the
  // real on-screen distance from the cursor to every visible stadium's
  // true center, and picks whichever stadium's own circle (its actual
  // visual radius, never the larger box around a star badge) the cursor is
  // genuinely inside — closest one wins if more than one circle overlaps
  // at that point. This is pure geometry, so it's correct regardless of
  // which marker happens to be painted on top of which.
  function hitRadiusPx(s) {
    // Logo markers (current stadiums) are a fixed size on desktop/tablet,
    // so their hit radius is fixed there too — but on mobile they grow
    // with zoom just like every other dot (see logoDiameterForZoom), so
    // the hit radius has to track that growth on both fronts, or the
    // clickable/hoverable area stays stuck at the tiny default-zoom size
    // while the marker visibly grows past it.
    if (isLogoIconActive(s)) return logoDiameterForZoom(map.getZoom()) / 2 - 2.5;
    return dotRadiusForZoom(map.getZoom());
  }

  // Returns { stadium, marker } for whichever stadium's own circle the
  // cursor is genuinely inside (closest one wins if more than one
  // overlaps at that point), or null. During the year-slider story this
  // checks the dynamic per-TEAM markers instead of the normal one-per-
  // stadium set (which are all hidden for the story's duration — see
  // startYearStory): a shared ballpark can have two of those live at
  // once, each independently hoverable/clickable, both resolving back to
  // the same underlying stadium object (and so the same info panel),
  // since its overlay content already lists every tenant.
  function findHoveredStadium(clientX, clientY) {
    const mapRect = map.getContainer().getBoundingClientRect();
    let best = null, bestMarker = null, bestDist = Infinity;
    if (yearStoryModeActive) {
      for (const key in yearStoryMarkerByKey) {
        const entry = yearStoryMarkerByKey[key];
        if (!entry || !map.hasLayer(entry.marker)) continue;
        const s = entry.stadium;
        const pt = map.latLngToContainerPoint(entry.marker.getLatLng());
        const dx = clientX - (mapRect.left + pt.x);
        const dy = clientY - (mapRect.top + pt.y);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= hitRadiusPx(s) && dist < bestDist) {
          best = s; bestMarker = entry.marker; bestDist = dist;
        }
      }
    } else {
      for (const s of stadiums) {
        const marker = markerByName[s.name];
        if (!marker || !map.hasLayer(marker)) continue;
        const pt = map.latLngToContainerPoint(marker.getLatLng());
        const dx = clientX - (mapRect.left + pt.x);
        const dy = clientY - (mapRect.top + pt.y);
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= hitRadiusPx(s) && dist < bestDist) {
          best = s; bestMarker = marker; bestDist = dist;
        }
      }
    }
