<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MLB Stadiums Map</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23fdfdfb' stroke='%23c9c4b8' stroke-width='2.2'/%3E%3Cg transform='rotate(45 16 16)'%3E%3Cpath d='M8 5 Q17 16 8 27' fill='none' stroke='%23d43d3d' stroke-width='1.6'/%3E%3Cpath d='M24 5 Q15 16 24 27' fill='none' stroke='%23d43d3d' stroke-width='1.6'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #map { width: 100%; height: 100vh; background: #aad3df; position: relative; }

  .panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(255,255,255,0.8);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    font-size: 12px;
    color: #222;
    /* No padding here — it lives on the toggle button and on #filters-body
       instead, so the button's own box IS the entire visible surface with
       no unclickable margin around it (previously the panel's padding sat
       outside the button, so only the label/arrow themselves, not the
       full rounded box around them, actually responded to clicks). */
  }
  /* Only force the wider width while expanded — collapsed, the panel
     should shrink to fit just the toggle button (and its label). */
  .panel.expanded { min-width: 210px; }
  .panel-header {
    display: flex;
    align-items: center;
  }
  #filters-body { margin-top: 4px; padding: 0 14px 12px 14px; box-sizing: border-box; }
  /* The whole button — label and arrow together, plus all the padding
     around them — is the hit target, not just the little arrow glyph. */
  .filters-toggle-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: #222;
    padding: 12px 14px;
    line-height: 1;
    text-align: left;
    border-radius: 8px;
  }
  /* Expanded, the button's bottom padding shrinks and #filters-body's own
     top margin picks up the rest, so the header-to-body gap stays the
     same 8px it always was. */
  .panel.expanded .filters-toggle-btn { padding-bottom: 4px; }
  .filters-toggle-btn:hover { color: #000; }
  .filters-toggle-btn:hover .filters-toggle-arrow { color: #000; }
  .filters-toggle-label { flex: 1; }
  /* Hide the label once expanded — the panel body makes it redundant, and
     hiding it lets the collapsed button stay compact. */
  .panel.expanded .filters-toggle-label { display: none; }
  .filters-toggle-arrow { font-size: 11px; color: #555; margin-left: auto; }
  .filter-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin: 6px 0 2px 0;
  }
  .filter-divider {
    border: none;
    border-top: 1px solid #e2e2e2;
    margin: 10px 0;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }
  .filter-row input { margin: 0; cursor: pointer; }
  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.35);
    flex: none;
  }
  /* Route-layer legend swatches read as a short line rather than a dot. */
  .swatch-line {
    width: 14px;
    height: 3px;
    border-radius: 1.5px;
    border: none;
  }
  /* While the 2007 Road Trip layer is active, every other filter control
     is screened behind an opaque white scrim — visible but inert — so the
     road-trip toggle (outside this wrapper) is the only thing exposed. */
  #filters-dimmable-wrap {
    position: relative;
  }
  #filters-scrim {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.7);
  }
  .filter-row label { cursor: pointer; }
  .stars-label {
    letter-spacing: 1px;
    font-size: 12px;
  }
  .stars-label .filled { color: #d4a017; }
  .stars-label .empty { color: #d7d7d7; }
  .filter-count {
    margin-left: auto;
    padding-left: 8px;
    color: #999;
    font-size: 11px;
    flex: none;
  }

  /* Circle-only hit testing (excluding the star badge, and letting
     transparent space pass through to a smaller marker sitting nearby)
     is handled in JS via a cursor-distance check, not CSS pointer-events
     — that approach proved unreliable, so this stays a normal,
     fully-interactive element. */
  .logo-marker-icon { background: transparent; border: none; }
  /* Road-trip draw-in: pops a stadium's icon as the animated route reaches
     it. Applied to the inner <svg>, never the outer divIcon element itself
     — Leaflet positions that outer element with its own transform, and a
     competing transform there would make the marker jump on screen. */
  @keyframes stadiumPop {
    0% { transform: scale(0.2); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .stadium-pop-svg { animation: stadiumPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center; }
  .demolished-marker-icon { background: transparent; border: none; }

  /* ============================================================
     Stadium info overlay — "Green Monster" manual-scoreboard theme:
     painted-green panel, cream stenciled numerals, subtly-framed slots.
     Two font styles run throughout: Font Style 1 (fs1, bright cream —
     the "readout" numbers/values) and Font Style 2 (fs2, smaller/dimmer
     gold — secondary text), plus .hl to pop a specific number bright
     white within a dimmer run of text (e.g. the "#1" in "My #1 Stadium").
     ============================================================ */
  :root {
    /* Default ("current stadium") scheme — the original Green Monster
       palette. Other categories override every one of these variables on
       a scheme-* class applied alongside .stadium-overlay (see below);
       nothing here needs to change for those overrides to take effect,
       since every rule in this file reads color through these variables
       rather than hardcoding a value. */
    --gm-frame: #5b5a3f;       /* darkened, subtle "cream" framing line */
    --gm-frame-outer: #4d4c36;
    --gm-slot-bg: #08251c;     /* header band + individual metadata slots */
    --gm-green: #0b4a37;       /* card/scroll-body background */
    --gm-cream: #f5efd8;
    --gm-cream-dim: #a9a37c;
    --gm-star-dim: #2f5c4c;
    --gm-commentary-text: #e7e1c9;
    --gm-link: #bfe0ff;
    --gm-caption-text: #cfe3d8;
  }
  /* Current stadium, not yet visited: light blue — inverted like the
     light-green scheme below (dark text/accents on a light background). */
  .scheme-current-not-visited {
    --gm-frame: #7fb3d9;
    --gm-frame-outer: #5f9dcc;
    --gm-slot-bg: #cde3f2;
    --gm-green: #e4f1fa;
    --gm-cream: #0d3a5c;
    --gm-cream-dim: #3d6a8a;
    --gm-star-dim: #a9cde0;
    --gm-commentary-text: #16405e;
    --gm-link: #0b4f91;
    --gm-caption-text: #234f6e;
  }
  /* Former stadium, attended: medium-to-light grey — inverted like the
     light-green and light-blue schemes (dark text/accents on a pale
     background), rather than the dark-on-light structure this used to
     share with the default scheme. */
  .scheme-former-attended {
    --gm-frame: #a8a49c;
    --gm-frame-outer: #8f8b82;
    --gm-slot-bg: #d8d5cd;
    --gm-green: #ece9e2;
    --gm-cream: #2b2a26;
    --gm-cream-dim: #5c584f;
    --gm-star-dim: #b8b4ab;
    --gm-commentary-text: #37342e;
    --gm-link: #1a5fa8;
    --gm-caption-text: #45413a;
  }
  /* Former stadium, never attended: light green — inverted from the other
     three schemes (dark text/accents on a light background), since a pale
     background needs dark foreground colors to stay readable. --gm-cream
     is the "brightest/most prominent" text role in every scheme, so here
     it's the darkest green rather than the lightest cream. */
  .scheme-former-unattended {
    --gm-frame: #8fbf96;
    --gm-frame-outer: #6fa378;
    --gm-slot-bg: #c7e6cc;
    --gm-green: #e3f4e5;
    --gm-cream: #16321a;
    --gm-cream-dim: #4d6b50;
    --gm-star-dim: #a9cdae;
    --gm-commentary-text: #234828;
    --gm-link: #1a5fa8;
    --gm-caption-text: #2d4f31;
  }
  /* Future/planned stadium: light purple — inverted, matching the same
     tone/lightness as the light-blue current_not_visited scheme rather
     than the darker purple this used to be. */
  .scheme-future {
    --gm-frame: #b09bd9;
    --gm-frame-outer: #9683c9;
    --gm-slot-bg: #e5defa;
    --gm-green: #f1ecfb;
    --gm-cream: #3a2465;
    --gm-cream-dim: #6b5591;
    --gm-star-dim: #d3c4ea;
    --gm-commentary-text: #3f2a6b;
    --gm-link: #6a3fa3;
    --gm-caption-text: #4a3571;
  }
  .fs1 { font-size: 12px; color: var(--gm-cream); font-weight: 600; }
  .fs2 { font-size: 12px; color: var(--gm-cream-dim); font-weight: 400; }
  .hl { color: var(--gm-cream); font-weight: 700; }

  .b-name-band {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--gm-slot-bg); padding: 9px 12px;
  }
  /* Extra right-side room for the pinned view's close button — the
     condensed hover preview has no close button, so it doesn't need it. */
  .ov-pinned-header .b-name-band { padding-right: 34px; border-bottom: 1px solid var(--gm-frame); }
  .b-logo-chip {
    /* Sized to top-align with the stadium name and bottom-align with the
       team name line below it. Fixed cream/white rather than a scheme
       variable — team logos are drawn for a light backing regardless of
       which color scheme the surrounding card is in. */
    width: 44px; height: 44px; border-radius: 4px; background: #f5efd8;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .b-logo-chip img { width: 32px; height: 32px; object-fit: contain; }
  .b-name-stack { min-width: 0; }
  .b-name {
    font-size: 22px; font-weight: 700; color: var(--gm-cream); text-transform: uppercase;
    letter-spacing: 0.8px; line-height: 1.12;
  }
  .b-team {
    margin-top: 3px; font-size: 14px; font-weight: 700; line-height: 1.2;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .b-team-name { color: var(--gm-cream); }         /* team name: bright cream/white, keeps the bold from .b-team */
  /* (league division): dimmer gold, regular weight, one step smaller — in
     em (relative to .b-team's own font-size, 12/14) rather than a fixed
     px, so that if .b-team ever gets shrunk to fit (see fitOneLineToWidth)
     this scales down right along with it instead of staying fixed while
     everything around it gets smaller. */
  .b-team-leaguediv { color: var(--gm-cream-dim); font-weight: 400; font-size: 0.857em; }

  .b-meta-stack { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .b-slot { border: 1px solid var(--gm-frame); border-radius: 2px; padding: 9px 12px; background: var(--gm-slot-bg); }
  .b-slot-label { font-size: 10px; letter-spacing: 0.6px; color: var(--gm-cream-dim); text-transform: uppercase; font-weight: 700; }

  /* Section 1: city / stars / built-years / ranking. Each pair is its own
     baseline-aligned row so the two sides line up despite differing font
     sizes. */
  .b-meta-row { display: flex; align-items: baseline; justify-content: space-between; }
  .b-meta-row + .b-meta-row { margin-top: 4px; }
  .b-stars { color: var(--gm-cream); font-size: 17px; letter-spacing: 1px; line-height: 1; }
  .b-stars .dim { color: var(--gm-star-dim); }

  /* Section 2: MLB years (one line per team that has called the stadium
     home, baseline-aligned) combined with Formerly/Also-known-as into one
     module, with a little breathing room between the two sub-sections. */
  .b-tenant-list { margin-top: 3px; }
  .b-tenant-line { display: flex; align-items: baseline; gap: 6px; }
  .b-tenant-line + .b-tenant-line { margin-top: 2px; }
  .b-formerly-block { margin-top: 8px; }

  .b-section-gap { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gm-frame); }

  .b-commentary {
    padding: 9px 12px; border: 1px solid var(--gm-frame); border-radius: 2px;
    background: var(--gm-slot-bg); font-size: 13px; line-height: 1.55; color: var(--gm-commentary-text);
  }
  .b-commentary p { margin: 0 0 8px; }
  .b-commentary p:last-child { margin-bottom: 0; }
  /* A plain dark-blue link (the browser default) all but disappears
     against this dark green — light, slightly-blue-tinted and underlined
     reads clearly instead, for this and any future in-text links. Each
     scheme sets its own --gm-link so this stays legible against every
     background, including the light-green scheme's inverted contrast. */
  .b-commentary a { color: var(--gm-link); text-decoration: underline; }

  /* Hover preview + click-to-expand overlays: plain absolutely-positioned
     boxes (not Leaflet tooltips/popups) so we control placement exactly,
     never auto-pan the map, and can show a hover preview for one stadium
     while an expanded overlay for another stays open. Toggled via display
     only — no fade transition. */
  .stadium-overlay {
    position: absolute;
    z-index: 1001;
    display: none;
    background: var(--gm-slot-bg);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--gm-frame-outer), 0 8px 18px rgba(0,0,0,0.3);
    padding: 0;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 12px;
    line-height: 1.4;
    color: var(--gm-cream-dim);
    white-space: nowrap;
    /* While just previewing on hover (not pinned), the box must never be
       able to receive mouse events itself — otherwise, if it happens to
       render on top of part of the marker circle that triggered it, the
       browser re-evaluates what's under the (stationary) cursor and fires
       a spurious mouseout/mouseover pair on the marker, flashing the
       overlay off and back on once. Pinned mode re-enables interaction so
       the close button still works. */
    pointer-events: none;
  }
  /* Expanded (pinned/clicked) overlays get their own layout: a fixed
     width with normal text wrapping (rather than the hover preview's
     nowrap auto-sizing), and a two-part vertical layout — a pinned
     header that never scrolls, and a body capped at roughly half the
     viewport tall that scrolls independently once its content (metadata
     rows, photos, personal notes) exceeds that. The cap is a MAX height,
     not a fixed one: short entries with little content still size down
     to fit, and only grow toward — then stop at — the 50vh ceiling once
     there's enough to warrant it. */
  .stadium-overlay.expanded {
    z-index: 1002;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    width: 340px;
    white-space: normal;
    background: var(--gm-green);
  }
  .ov-pinned-header { flex: none; }
  .ov-scroll-wrap { position: relative; }
  .ov-scroll {
    /* The cap lives directly on the scrolling element itself (rather
       than on an ancestor, with this stretching to fill it via flex) —
       simpler and doesn't depend on flexbox's shrink negotiation to
       hand it a definite height. "About half the viewport": the pinned
       header adds a bit more on top of this. */
    max-height: 50vh;
    overflow-y: auto;
    padding: 0 14px 14px 14px;
    /* Keeps wheel/trackpad scrolling that reaches the top or bottom of
       this box from "chaining" into the map underneath and zooming it. */
    overscroll-behavior: contain;
    touch-action: pan-y;
    cursor: grab;
  }
  .ov-scroll.ov-dragging { cursor: grabbing; }
  /* Fade strips sit on top of the scrolling content (siblings, not
     children, so they never scroll away themselves) and hint that
     there's more above/below to scroll to. Their opacity is toggled by
     JS to match actual scroll position — hidden at the very top/bottom,
     shown otherwise — so nothing fades before there's something to hide. */
  .ov-fade-top, .ov-fade-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 22px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  /* Fades to fully transparent (not a 0-alpha copy of --gm-green) so the
     gradient's start color always matches whichever scheme is active
     without needing a second per-scheme "transparent version" variable. */
  .ov-fade-top { top: 0; background: linear-gradient(to bottom, var(--gm-green), transparent); }
  .ov-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--gm-green), transparent); }
  .ov-photo { width: 100%; height: auto; display: block; border-radius: 2px; cursor: zoom-in; }
  .ov-photo + .ov-photo { margin-top: 8px; }
  /* Zoom-crops a poorly-framed source photo for its overlay thumbnail only
     (the full original still shows in the lightbox) — see buildMediaHtml's
     p.cropPercent handling. The wrapper clips to the photo's normal
     (uncropped) box size; the inner .ov-photo is scaled up by a transform
     (which doesn't affect layout, so the wrapper's box stays put) enough
     that its outer cropPercent% margin on every edge falls outside the
     wrapper and gets clipped away. */
  .ov-photo-crop-wrap { overflow: hidden; border-radius: 2px; }
  .ov-photo-crop-wrap .ov-photo { border-radius: 0; transform-origin: center; }
  .ov-photo + .ov-photo-crop-wrap, .ov-photo-crop-wrap + .ov-photo, .ov-photo-crop-wrap + .ov-photo-crop-wrap { margin-top: 8px; }
  .ov-photo-credit {
    font-size: 10px;
    color: var(--gm-cream-dim);
    margin-top: 3px;
    margin-bottom: 8px;
  }
  .ov-photo-credit a { color: var(--gm-cream-dim); }
  /* Caption under a personal photo — same slot as .ov-photo-credit but
     no link. */
  .ov-photo-caption {
    font-size: 12px;
    color: var(--gm-caption-text);
    margin-top: 3px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .ov-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--gm-cream-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .ov-close:hover { color: var(--gm-cream); }

  .state-label {
    color: #b9bec7;
    font-size: 5.5px;
    font-weight: 300;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 3px rgba(255,255,255,0.8), 0 0 3px rgba(255,255,255,0.8);
  }

  /* Full-screen photo lightbox — sits outside #map entirely (see the
     body markup) so it's never a descendant of the Leaflet container and
     therefore can't have its clicks/drags mistaken for map interaction
     the way the stadium overlay itself has to guard against. Opened by
     clicking any .ov-photo; closed by clicking the backdrop, the close
     button, or pressing Escape — never by clicking the image itself. */
  .photo-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 48px;
    box-sizing: border-box;
    cursor: zoom-out;
  }
  .photo-lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
  }
  .photo-lightbox img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 136px);
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    cursor: default;
  }
  .photo-lightbox-credit {
    margin-top: 12px;
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    cursor: default;
  }
  .photo-lightbox-credit a { color: rgba(255,255,255,0.9); }
  .photo-lightbox-close {
    position: absolute;
    top: 16px;
    right: 20px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .photo-lightbox-close:hover { color: #ddd; }

  .reset-view-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: #fff;
    font-size: 15px;
    line-height: 1;
    color: #333;
    text-decoration: none;
  }
  .reset-view-btn:hover { background: #f4f4f4; color: #000; }
</style>
</head>
<body>
<div id="map">
  <div id="overlay-full" class="stadium-overlay"></div>
  <div id="overlay-measure" class="stadium-overlay" style="visibility:hidden; display:block; left:-9999px; top:-9999px;"></div>
</div>

<div id="photo-lightbox" class="photo-lightbox">
  <button type="button" class="photo-lightbox-close" aria-label="Close">&times;</button>
  <div class="photo-lightbox-content">
    <img id="photo-lightbox-img" alt="">
    <div id="photo-lightbox-credit" class="photo-lightbox-credit"></div>
  </div>
</div>

<div class="panel" id="filters-panel">
  <div class="panel-header">
    <button type="button" id="filters-toggle" class="filters-toggle-btn" title="Expand layers &amp; filters" aria-expanded="false">
      <span class="filters-toggle-label">Layers &amp; filters</span>
      <span class="filters-toggle-arrow">&#9656;</span>
    </button>
  </div>
  <div id="filters-body" style="display: none;">
    <div class="filter-section-label">Routes</div>
    <div class="filter-row" data-route="road-trip-2002">
      <input type="checkbox" id="cb-road-trip-2002">
      <span class="swatch swatch-line" style="background:#0f766e;"></span>
      <label for="cb-road-trip-2002">2002 Road Trip</label>
    </div>
    <div class="filter-row" data-route="road-trip-2006">
      <input type="checkbox" id="cb-road-trip-2006">
      <span class="swatch swatch-line" style="background:#7c3aed;"></span>
      <label for="cb-road-trip-2006">2006 Road Trip</label>
    </div>
    <div class="filter-row" data-route="road-trip-2007">
      <input type="checkbox" id="cb-road-trip-2007">
      <span class="swatch swatch-line" style="background:#b91c1c;"></span>
      <label for="cb-road-trip-2007">2007 Road Trip</label>
    </div>

    <hr class="filter-divider">

    <div id="filters-dimmable-wrap">
      <div id="filters-dimmable">
        <div class="filter-section-label">Current stadiums</div>
        <div class="filter-row" data-cat="current_visited">
          <input type="checkbox" id="cb-current_visited" checked>
          <span class="swatch" style="background:#1e7145;"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // category -> color / style. Kept in sync with the five overlay color
  // schemes (see the .scheme-* CSS rules): current-visited stays the
  // original dark green, current-not-visited is light blue, former
  // (attended) is dark grey, historic (never attended) is light green,
  // future is purple. This single object drives both the marker/ring/star
  // colors on the map AND (via schemeClassFor below) which overlay scheme
  // each stadium's hover/pinned panel uses, so updating a color here is
  // the one general place that needs to change for either to shift.
  const STYLES = {
    current_visited:     { color: '#1e7145' },
    current_not_visited: { color: '#5fa8dd' },
    former_demolished:   { color: '#7d7970' },
    former_exists:       { color: '#7d7970' },
    historic_not_visited: { color: '#a9d1a9' },
    historic_demolished:  { color: '#a9d1a9' },
    future_planned:       { color: '#a688d9' }
  };
  const MARKER_RADIUS = 6; // px, at default zoom (circleMarker; former/historic/future dots)
  // former/historic/future dots grow with zoom (see growRadiusForZoom below),
  // capping out at this radius so they never exceed the current-stadium
  // logo marker's own visible circle. That circle's outer edge sits at
  // LOGO_ICON_SIZE/2 - 2.5 = 15.5px (see logoIcon's white bg circle below);
  // 14.5 stays just under that once each dot's own stroke width is added on
  // top (a circleMarker/demolished dot's visible edge is radius + weight/2).
  const FULL_MARKER_RADIUS = 14.5;

  // Current stadiums (visited or not) are marked with their team logo inside
  // a white circle bordered in the category color, 36px across. 5-star
  // stadiums get the same circle, laid over a light-gold star 50% bigger
  // than the circle so its points show around the edge.
  const LOGO_ICON_SIZE = 36;
  const STAR_SCALE = 1.5;

  // 5-point star polygon centered at (cx, cy).
  function starPoints(cx, cy, outerR, innerR) {
    const pts = [];
    for (let i = 0; i < 5; i++) {
      const outerAngle = -Math.PI / 2 + i * (2 * Math.PI / 5);
      const innerAngle = outerAngle + Math.PI / 5;
      pts.push(`${(cx + outerR * Math.cos(outerAngle)).toFixed(2)},${(cy + outerR * Math.sin(outerAngle)).toFixed(2)}`);
      pts.push(`${(cx + innerR * Math.cos(innerAngle)).toFixed(2)},${(cy + innerR * Math.sin(innerAngle)).toFixed(2)}`);
    }
    return pts.join(' ');
  }

  function logoIcon(color, logoSrc, rating) {
    const circleSize = LOGO_ICON_SIZE;
    const starred = rating === 5;
    const iconSize = starred ? circleSize * STAR_SCALE : circleSize;
    const c = iconSize / 2;

    // Star behind the circle uses the same color as the circle's outline,
    // at 22% opacity (kept faint so it reads as a subtle badge, not a shape
    // competing with the circle itself).
    const starHtml = starred
      ? `<polygon points="${starPoints(c, c, iconSize / 2 * 0.98, iconSize / 2 * 0.98 * 0.42)}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-opacity="0.22" stroke-linejoin="round"/>`
      : '';
    const bg = `<circle cx="${c}" cy="${c}" r="${circleSize / 2 - 2.5}" fill="#fff"/>`;
    const ring = `<circle cx="${c}" cy="${c}" r="${circleSize / 2 - 4}" fill="none" stroke="${color}" stroke-width="3"/>`;
    const logoSize = circleSize * 0.56;
    const logoOffset = c - logoSize / 2;
    const logo = `<image href="${logoSrc}" x="${logoOffset}" y="${logoOffset}" width="${logoSize}" height="${logoSize}"/>`;

    return L.divIcon({
      className: 'logo-marker-icon',
      html: `<svg width="${iconSize}" height="${iconSize}" viewBox="0 0 ${iconSize} ${iconSize}">${starHtml}${bg}${ring}${logo}</svg>`,
      iconSize: [iconSize, iconSize],
      iconAnchor: [c, c]
    });
  }

  // Demolished dots (former-visited AND historic-not-visited) get a small
  // white center dot so they read distinctly from their "still exists"
  // counterparts, which otherwise share the same fill color. borderColor
  // defaults to fillColor so former_demolished's original single-color look
  // is unchanged; historic_not_visited passes its own dark-green border to
  // match the plain circleMarker styling used for its "still exists" peers.
  function demolishedDotIcon(fillColor, borderColor = fillColor, radius = MARKER_RADIUS) {
    const r = radius;
    const weight = 1.5;
    const size = (r + weight) * 2;
    const c = size / 2;
    const innerR = r * 0.28;
    return L.divIcon({
      className: 'demolished-marker-icon',
      html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
               <circle cx="${c}" cy="${c}" r="${r}" fill="${fillColor}" fill-opacity="0.9" stroke="${borderColor}" stroke-width="${weight}"/>
               <circle cx="${c}" cy="${c}" r="${innerR}" fill="#fff"/>
             </svg>`,
      iconSize: [size, size],
      iconAnchor: [c, c]
    });
  }

  // Formats 1 -> "1st", 2 -> "2nd", 11 -> "11th", 21 -> "21st", etc.
  function ordinal(n) {
    const v = n % 100;
    if (v >= 11 && v <= 13) return n + 'th';
    switch (n % 10) {
      case 1: return n + 'st';
      case 2: return n + 'nd';
      case 3: return n + 'rd';
      default: return n + 'th';
    }
  }

  // Renders a stadium's internet photo(s) (s.photos: [{url, credit,
  // creditUrl}]) — the whole credit line is itself the hyperlink, no
  // "Photo:" label — and personal photos (s.personalPhotos: [{url,
  // caption}]), captioned rather than credited. Each <img> carries
  // data-photo-kind/data-photo-idx so a click can look up the right entry
  // for the lightbox regardless of which section it's in.
  function buildPhotoImgHtml(p, i, kind) {
    // p.cropPercent (0-100), if present, zoom-crops the thumbnail display
    // only (via a scaled, overflow-hidden wrapper) to hide poor framing —
    // the lightbox still opens the original, uncropped image.
    const imgTag = `<img class="ov-photo" src="${p.url}" alt="" data-photo-kind="${kind}" data-photo-idx="${i}" onerror="this.parentElement && this.parentElement.classList.contains('ov-photo-crop-wrap') ? this.parentElement.style.display='none' : this.style.display='none'">`;
    if (p.cropPercent) {
      const scale = 100 / (100 - 2 * p.cropPercent);
      return `<div class="ov-photo-crop-wrap"><img class="ov-photo" src="${p.url}" alt="" data-photo-kind="${kind}" data-photo-idx="${i}" style="transform: scale(${scale});" onerror="this.parentElement.style.display='none'"></div>`;
    }
    return imgTag;
  }
  function buildPublicPhotosHtml(s) {
    if (!s.photos || !s.photos.length) return '';
    return s.photos.map((p, i) =>
      buildPhotoImgHtml(p, i, 'public')
      + `<div class="ov-photo-credit"><a href="${p.creditUrl}" target="_blank" rel="noopener">${p.credit}</a></div>`
    ).join('');
  }
  function buildPersonalPhotosHtml(s) {
    if (!s.personalPhotos || !s.personalPhotos.length) return '';
    return s.personalPhotos.map((p, i) =>
      buildPhotoImgHtml(p, i, 'personal')
      + (p.caption ? `<div class="ov-photo-caption">${p.caption}</div>` : '')
    ).join('');
  }

  // --- Green Monster overlay: shared text-building helpers ---
  // Short nicknames for the milestone sentence ("...the Red Sox were the
  // 1st team I saw play a home game"), keyed by each entry's own fullName
  // (not a fixed per-franchise name) so a relocated/renamed franchise
  // reads correctly for whichever era a given stadium represents (e.g.
  // the Expos at Olympic Stadium vs. the Nationals at Nationals Park).
  const TEAM_SHORT_NAMES = {
    'Anaheim Angels': 'Angels', 'Arizona Diamondbacks': 'Diamondbacks',
    'Baltimore Orioles': 'Orioles', 'Boston Red Sox': 'Red Sox',
    'Chicago Cubs': 'Cubs', 'Chicago White Sox': 'White Sox',
    'Cincinnati Reds': 'Reds', 'Cleveland Guardians': 'Guardians',
    'Colorado Rockies': 'Rockies', 'Detroit Tigers': 'Tigers',
    'Houston Astros': 'Astros', 'Kansas City Royals': 'Royals',
    'Los Angeles Dodgers': 'Dodgers', 'Montreal Expos': 'Expos',
    'Washington Nationals': 'Nationals', 'New York Mets': 'Mets',
    'Athletics': 'Athletics', "Oakland A's": "A's",
    'Pittsburgh Pirates': 'Pirates', 'San Diego Padres': 'Padres',
    'Seattle Mariners': 'Mariners', 'San Francisco Giants': 'Giants',
    'St. Louis Cardinals': 'Cardinals', 'Tampa Bay Rays': 'Rays',
    'Texas Rangers': 'Rangers', 'Toronto Blue Jays': 'Blue Jays',
    'Minnesota Twins': 'Twins', 'Philadelphia Phillies': 'Phillies',
    'Atlanta Braves': 'Braves', 'Miami Marlins': 'Marlins',
    'New York Yankees': 'Yankees', 'Milwaukee Brewers': 'Brewers'
  };
  // Most stadiums have hosted exactly one MLB tenant across their whole
  // history, so the "MLB Years" module's team list defaults to a single
  // entry derived from yearsUsed + fullName. A handful shared by two
  // franchises need the real split spelled out.
  const TENANTS_OVERRIDE = {
    'RFK Stadium': [
      { years: '1962–1971', team: 'Washington Senators' },
      { years: '2005–2007', team: 'Washington Nationals' }
    ],
    'Shibe Park': [
      { years: '1909–1954', team: 'Philadelphia Athletics' },
      { years: '1938–1970', team: 'Philadelphia Phillies' }
    ],
    "Sportsman's Park": [
      { years: '1909–1953', team: 'St. Louis Browns' },
      { years: '1920–1966', team: 'St. Louis Cardinals' }
    ],
    'Milwaukee County Stadium': [
      { years: '1953–1965', team: 'Milwaukee Braves' },
      { years: '1970–2000', team: 'Milwaukee Brewers' }
    ],
    // Giants' full tenure, plus two guest tenants: the Yankees (then still
    // called the Highlanders/Yankees) borrowed the Polo Grounds from 1913
    // until Yankee Stadium opened in 1923, and the expansion Mets played
    // here 1962–1963 (after the Giants left for SF) before Shea Stadium
    // opened.
    'Polo Grounds': [
      { years: '1911–1957', team: 'New York Giants' },
      { years: '1913–1922', team: 'New York Yankees' },
      { years: '1962–1963', team: 'New York Mets' }
    ],
    'Municipal Stadium': [
      { years: '1955–1967', team: 'Kansas City Athletics' },
      { years: '1969–1972', team: 'Kansas City Royals' }
    ],
    // The only stadium in MLB history that began its life shared by two
    // franchises: the Angels played their first four seasons (1962–1965,
    // calling it "Chavez Ravine") as the Dodgers' tenants before Angel
    // Stadium was ready.
    'Uniqlo Field at Dodger Stadium': [
      { years: '1962–present', team: 'Los Angeles Dodgers' },
      { years: '1962–1965', team: 'Los Angeles Angels' }
    ],
    // The Yankees played 1974–1975 as the Mets' tenants at Shea while the
    // original Yankee Stadium was closed for a full interior rebuild.
    'Shea Stadium': [
      { years: '1964–2008', team: 'New York Mets' },
      { years: '1974–1975', team: 'New York Yankees' }
    ],
    // The Braves played their final 1914 homestand (including that year's
    // World Series) and the first four-plus months of 1915 as the Red
    // Sox's tenants at Fenway — their own Braves Field wasn't ready until
    // August 1915.
    'Fenway Park': [
      { years: '1912–present', team: 'Boston Red Sox' },
      { years: '1914–1915', team: 'Boston Braves' }
    ]
  };
  function getTenants(s) {
    // A not-yet-built future_planned stadium (e.g. the new Las Vegas
    // ballpark) has no yearsUsed at all — nothing to list here yet.
    if (!s.yearsUsed) return [];
    return TENANTS_OVERRIDE[s.name] || [{ years: s.yearsUsed, team: s.fullName }];
  }
  // The building's own existence span — start year taken from the
  // earliest tenant (robust even when yearsUsed itself doesn't lead with
  // a clean start year), end year is the demolition year or "present".
  // Returns '' (nothing to show) for a not-yet-built stadium.
  function buildingYears(s) {
    const tenants = getTenants(s);
    if (!tenants.length) return '';
    const startYears = tenants.map(t => {
      const m = t.years.match(/\d{4}/);
      return m ? parseInt(m[0], 10) : Infinity;
    });
    const start = Math.min(...startYears);
    const end = s.demolishedYear ? String(s.demolishedYear) : 'present';
    // Any entry with a real end year (as opposed to "present") has been
    // physically demolished, per how demolishedYear is used throughout
    // this dataset — flag that explicitly rather than leaving a bare
    // year range to imply it.
    const suffix = s.demolishedYear ? ' (demolished)' : '';
    return `${isFinite(start) ? start : ''}–${end}${suffix}`;
  }
  // The last year MLB games were actually played here — distinct from
  // buildingYears' end date, which reflects when the building itself
  // came down (sometimes years after the last game). Takes the latest
  // 4-digit year mentioned across every tenant's years string (handles
  // "1915–1952", "through 1957", and a bare single-season "1969" alike).
  // Returns null for a stadium still hosting games today, or one with no
  // yearsUsed at all (future_planned).
  function lastYearUsed(s) {
    const tenants = getTenants(s);
    if (!tenants.length) return null;
    const endYears = tenants
      .map(t => {
        const matches = t.years.match(/\d{4}/g);
        return matches ? parseInt(matches[matches.length - 1], 10) : null;
      })
      .filter(y => y != null);
    return endYears.length ? Math.max(...endYears) : null;
  }
  // City/state line spells the state out in full — abbreviations only
  // for the couple of non-US entries whose full name would be unusual
  // to see spelled out (Washington D.C. keeps "DC").
  // Single source of truth for every "before/after I was born" comparison
  // in the never-visited fallback text below — a demolition year or last-
  // game year only counts as "before I was born" if it's actually earlier
  // than this, not just because the field happens to be set at all.
  const BIRTH_YEAR = 1962;
  const STATE_NAMES = {
    AZ: 'Arizona', CA: 'California', CO: 'Colorado', DC: 'D.C.', FL: 'Florida',
    GA: 'Georgia', IL: 'Illinois', MA: 'Massachusetts', MD: 'Maryland',
    MI: 'Michigan', MN: 'Minnesota', MO: 'Missouri', NV: 'Nevada', NY: 'New York',
    OH: 'Ohio', PA: 'Pennsylvania', TX: 'Texas', WA: 'Washington', WI: 'Wisconsin',
    ON: 'Ontario', QC: 'Quebec'
  };
  function stateFullName(state) { return STATE_NAMES[state] || state; }
  // Formerly/Also Known As metadata (s.formerNames / s.akaNames) is shown
  // as just the names, not the years each one was in use — strips any
  // parenthetical that contains a year ("(1912–1937)", "(pre-MLB,
  // 1965–71)") entirely, plus a bare trailing "in <year>" mention that
  // isn't in parens ("Renamed Busch Stadium in 1953"). A parenthetical
  // with no year in it is left alone since it isn't a year to begin
  // with (there are none left in the current data, but this stays
  // general for any that get added later).
  function stripYearsFromAltNames(str) {
    if (!str) return str;
    return str
      .replace(/\s*\([^)]*\d{4}[^)]*\)/g, '')
      .replace(/\s+in\s+\d{4}\b/gi, '')
      .replace(/\s{2,}/g, ' ')
      .replace(/\s+,/g, ',')
      .trim();
  }
  function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
  function joinWithAnd(arr) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return arr[0] + ' and ' + arr[1];
    return arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];
  }
  // Team name in bright cream, "(League Division)" suffix in the dimmer
  // gold — only current/projected stadiums carry league+division data.
  function teamLineHtml(s) {
    const leagueDiv = (s.league && s.division) ? ` <span class="b-team-leaguediv">(${s.league} ${s.division})</span>` : '';
    return `<span class="b-team-name">${s.fullName}</span>${leagueDiv}`;
  }
  function starsHtml(rating) {
    let out = '';
    for (let i = 0; i < 5; i++) out += i < rating ? '★' : '<span class="dim">★</span>';
    return out;
  }
  // "I've attended" for a stadium still in active MLB use, plain "I
  // attended" once it's no longer in use (demolished, or the team has
  // moved on) — game count and both visit years pop bright white. Folds
  // the "with {people}" clause into the same sentence, comma-separated
  // right before "with", e.g. "I've attended 123 games between 1971 and
  // 2026, with Jesse, Andrew, Fender, Jim, Rob, Kim, Heather, and Serena."
  function attendedSentence(s) {
    if (s.gamesAttended == null) return null;
    const inUse = s.category === 'current_visited' || s.category === 'current_not_visited';
    const subject = inUse ? "I've" : 'I';
    const word = s.gamesAttended === 1 ? 'game' : 'games';
    const n = `<span class="hl">${s.gamesAttended}</span>`;
    const span = s.firstVisited === s.lastVisited
      ? `in <span class="hl">${s.lastVisited}</span>`
      : `between <span class="hl">${s.firstVisited}</span> and <span class="hl">${s.lastVisited}</span>`;
    const peopleList = (s.people && s.people.length) ? joinWithAnd(s.people.map(cap)) : null;
    const withClause = peopleList ? `, with ${peopleList}` : '';
    return `${subject} attended ${n} ${word} ${span}${withClause}.`;
  }
  // Full sentence using the actual stadium/team names, e.g. "Fenway Park
  // was my 1st MLB stadium, and the Red Sox were the 1st team I saw play
  // a home game." The team-ordinal is tied to the franchise (via
  // TEAM_SHORT_NAMES/byTeamNum being pre-computed per teamId), so a
  // relocated franchise's later stadium still cites the year I first saw
  // that franchise, not this particular building.
  function milestoneSentence(s) {
    const shortName = TEAM_SHORT_NAMES[s.fullName] || s.fullName;
    const parts = [];
    if (s.byStadiumNum) parts.push(`${s.displayName || s.name} was my <span class="hl">${ordinal(s.byStadiumNum)}</span> MLB stadium`);
    if (s.byTeamNum) parts.push(`the ${shortName} were the <span class="hl">${ordinal(s.byTeamNum)}</span> team I saw play a home game`);
    if (!parts.length) return null;
    if (parts.length === 1) return cap(parts[0]) + '.';
    return cap(parts[0]) + ', and ' + parts[1] + '.';
  }

  // the free-text personal notes into one flowing "commentary" block.

  // A visited stadium always gets the structured attended+milestone

  // Kingdome, etc.) are appended as an extra paragraph on top of those —
  // NOT in place of them, and nothing here re-restates the same
  // games/years/people facts a second time in plain prose.
  function commentaryParagraphs(s) {
    const paras = [];
    const visited = s.gamesAttended != null;
    if (visited) {
      const attended = attendedSentence(s);
      if (attended) paras.push(attended);
      const milestone = milestoneSentence(s);
      if (milestone) paras.push(cap(milestone));
      if (s.personalNotes) paras.push(s.personalNotes);
    } else {

      // future_planned entry hasn't opened yet, a demolished historic
      // entry that came down before BIRTH_YEAR never had the chance, a

      // everything else — a current stadium not yet visited, or a

      // it has to actually predate BIRTH_YEAR (e.g. Atlanta-Fulton

      let fallback;
      if (s.category === 'future_planned') {

      paras.push(s.personalNotes || fallback);

  // The layers & filters panel docks top-right and covers part of the map
  // whenever it's expanded. Reserved right-edge padding always reflects
  // its ACTUAL current width — small when collapsed (just the toggle
  // button), larger when expanded — so every auto-fit frames whatever's
  // actually still visible, not a worst-case guess. Toggling the panel
  // re-runs the fit (see refitToCurrentBounds), so the visible content
  // grows to fill the freed space when it closes and shrinks to stay
  // clear of the panel when it opens. Uses plain getElementById rather
  // than any script-level const so it's safe to call this before the
  // rest of the panel's setup code below has run.
  function reservedRightPaddingPx() {
    const panel = document.getElementById('filters-panel');
    const width = panel.getBoundingClientRect().width;
    return width + 12 /* panel's own right offset */ + 8 /* small buffer */;
  }

  // Shared padding for every auto-fit (default view, road trips, anything
  // else that frames the map to a set of bounds): reserves space along the
  // right edge equal to the filters panel's expanded width, so "best fit"
  // always fits within the portion of the viewport the panel doesn't cover
  // — never letting fitted content land underneath it.
  function viewportFitPadding() {
    return { paddingTopLeft: [36, 36], paddingBottomRight: [reservedRightPaddingPx(), 36] };
  }

  // with modest padding, best-fit for whatever the window's aspect ratio is.
  const stadiumBounds = L.latLngBounds(stadiums.map(s => [s.lat, s.lon]));
  let defaultZoom = 4;
  function applyDefaultView() {
    map.fitBounds(stadiumBounds, viewportFitPadding());
    defaultZoom = map.getZoom();
  }

  // applyDefaultView, but eased into over exactly one second instead of
  // snapping instantly.
  function flyToDefaultView() {
    flyToDefaultViewSmooth(stadiumBounds, Object.assign({ duration: 1 }, viewportFitPadding()));

  // Road-trip bounding boxes are tall and narrow (e.g. the 2006 trip runs
  // Seattle-to-San-Diego-and-back), so fitting one in a wide window picks a
  // zoom driven by its height — and the resulting viewport width at that
  // zoom can span far more longitude than the route itself, enough to press
  // against MAP_MAX_BOUNDS. If maxBounds is still active when that happens,
  // Leaflet forcibly re-pans the instant the animation ends, which reads as
  // a little bounce right at the finish. So maxBounds stays fully off for
  // as long as any road trip is showing (only restored once we're back on
  // the guaranteed-safe default view), rather than merely being suspended
  // for the animation itself.
  function flyToTripBounds(bounds, options) {
    map.setMaxBounds(null);
    map.flyToBounds(bounds, options);
  }
  // Used only for the reset-to-default flight, whose target is by
  // construction within MAP_MAX_BOUNDS, so restoring right after it settles

  function flyToDefaultViewSmooth(bounds, options) {
    map.setMaxBounds(null);
    map.once('moveend', () => { map.setMaxBounds(MAP_MAX_BOUNDS); });

  // proportionally longer rather than all trips taking the same time.
  function haversineKm(a, b) {
    const R = 6371;
    const dLat = (b[0] - a[0]) * Math.PI / 180;
    const dLon = (b[1] - a[1]) * Math.PI / 180;
    const lat1 = a[0] * Math.PI / 180, lat2 = b[0] * Math.PI / 180;

    // out to be unreliable for some text/size combinations (confirmed via
    // a live-browser check: available and natural came back identical
    // even though the line was visibly still wrapping). Deriving the
    // width from the row instead sidesteps that circularity entirely.
    const band = lineEl.closest('.b-name-band');
    const stack = lineEl.parentElement;
    if (!band || !stack) return;
    const bandStyle = getComputedStyle(band);
    let available = band.clientWidth - parseFloat(bandStyle.paddingLeft || 0) - parseFloat(bandStyle.paddingRight || 0);
    const gapValue = parseFloat(bandStyle.columnGap || bandStyle.gap || 0) || 0;
    let siblingCount = 0;
    Array.prototype.forEach.call(band.children, function (child) {
      if (child !== stack) { available -= child.getBoundingClientRect().width; siblingCount++; }
    });
    if (siblingCount) available -= gapValue * siblingCount;
    if (!available || available <= 0) return;

    // The line's true single-line width is measured on a fully detached,
    // off-screen clone (same classes, so it picks up the same font
    // rules) rather than by forcing white-space: nowrap on the live
    // element and reading its scrollWidth back — for the same reason as
    // above, a value read off an element inside this shrinking flex
    // layout isn't dependable. A clone appended straight to <body> has no
    // such constraint and measures cleanly.
    const clone = lineEl.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.visibility = 'hidden';
    clone.style.left = '-9999px';
    clone.style.top = '-9999px';
    clone.style.width = 'auto';
    clone.style.maxWidth = 'none';
    clone.style.whiteSpace = 'nowrap';
    clone.style.fontSize = '';
    clone.style.letterSpacing = '';
    document.body.appendChild(clone);
    const baseSize = parseFloat(getComputedStyle(clone).fontSize);
    const baseLetterSpacing = parseFloat(getComputedStyle(clone).letterSpacing) || 0;
    const natural = clone.getBoundingClientRect().width;

    if (natural <= available) { document.body.removeChild(clone); return; } // already fits at full size

    // Letter-spacing is a per-character FIXED px add-on that doesn't
    // shrink on its own just because the font-size does — for a long line
    // that's several extra px of width that would otherwise force the
    // font down further than necessary, so scale it down in step with
    // the font size too. (Any child element whose own font-size needs to
    // track this, like .b-team-leaguediv inside .b-team, is defined in em
    // rather than a fixed px, so it rides along automatically.)
    const applySize = (px) => {
      clone.style.fontSize = px + 'px';
      clone.style.letterSpacing = (baseLetterSpacing * (px / baseSize)) + 'px';
    };
    let size = Math.max(minSize, Math.floor(baseSize * (available / natural)));
    applySize(size);
    // The proportional guess above is approximate (kerning/rounding aren't
    // perfectly linear with font-size), so nudge down further if it's
    // still slightly overflowing, down to the floor.
    let guard = 30;
    while (clone.getBoundingClientRect().width > available && size > minSize && guard-- > 0) {
      size -= 1;
      applySize(size);
    }
    document.body.removeChild(clone);
    lineEl.style.fontSize = size + 'px';
    lineEl.style.letterSpacing = (baseLetterSpacing * (size / baseSize)) + 'px';
  }
  const STADIUM_NAME_MIN_SIZE = 11;
  const TEAM_LINE_MIN_SIZE = 10;
  function fitStadiumName(rootEl) {
    fitOneLineToWidth(rootEl.querySelector('.ov-pinned-header .b-name'), STADIUM_NAME_MIN_SIZE);
    fitOneLineToWidth(rootEl.querySelector('.ov-pinned-header .b-team'), TEAM_LINE_MIN_SIZE);
  }

  // The condensed hover preview and the pinned expanded card render the
  // exact same header markup (stadium.condensedHtml) but in
  // differently-constrained boxes: the preview auto-sizes to its content
  // (nowrap, so it never needs to shrink), while the pinned card is a
  // fixed 340px wide. Running fitStadiumName against each mode's own live
  // width would let a long name/team line show full-size on hover and
  // only shrink once pinned — a visible font change on click that should
  // read as a pure expansion instead. Computing the fit once, always
  // against the pinned card's fixed width (via a scratch render into
  // measureEl), and reusing that one result in both modes keeps the
  // header text pixel-identical whichever mode is on screen. Cached on
  // the stadium object since it only depends on the stadium's own name/
  // team text, never on which mode is currently showing.
  function computeHeaderFit(stadium) {
    if (stadium._headerFit) return stadium._headerFit;
    measureEl.className = ('stadium-overlay expanded ' + schemeClassFor(stadium.category)).trim();
    measureEl.style.display = 'flex';
    measureEl.innerHTML = `<div class="ov-pinned-header">${stadium.condensedHtml}</div>`;
    fitStadiumName(measureEl);
    const nameEl = measureEl.querySelector('.ov-pinned-header .b-name');
    const teamEl = measureEl.querySelector('.ov-pinned-header .b-team');
    stadium._headerFit = {
      nameFontSize: nameEl ? nameEl.style.fontSize : '',
      nameLetterSpacing: nameEl ? nameEl.style.letterSpacing : '',
      teamFontSize: teamEl ? teamEl.style.fontSize : '',
      teamLetterSpacing: teamEl ? teamEl.style.letterSpacing : ''
    };
    return stadium._headerFit;
  }

  // Applies a previously-computed header fit (see computeHeaderFit above)
  // to whichever header is actually on screen. Plain .b-name/.b-team
  // selectors (not scoped to .ov-pinned-header) since the condensed
  // preview's header isn't wrapped in that element.
  function applyHeaderFit(rootEl, fit) {
    const nameEl = rootEl.querySelector('.b-name');
    const teamEl = rootEl.querySelector('.b-team');
    if (nameEl) { nameEl.style.fontSize = fit.nameFontSize; nameEl.style.letterSpacing = fit.nameLetterSpacing; }
    if (teamEl) { teamEl.style.fontSize = fit.teamFontSize; teamEl.style.letterSpacing = fit.teamLetterSpacing; }
  }

  // Maps a stadium's category to its overlay color-scheme class (see the
  // .scheme-* CSS rules) — current_visited has no override class since it
  // IS the default scheme defined at :root. Centralized here so both
  // measureBox (sizing) and showOverlay (the real element) always agree.
  function schemeClassFor(category) {
    switch (category) {
      case 'current_not_visited': return 'scheme-current-not-visited';
      case 'former_exists':
      case 'former_demolished': return 'scheme-former-attended';
      case 'historic_not_visited':
      case 'historic_demolished': return 'scheme-former-unattended';
      case 'future_planned': return 'scheme-future';
      default: return '';
    }
  }

  function measureBox(html, pinned, stadium) {
    // Computed BEFORE measureEl is repointed at the real html below —
    // computeHeaderFit uses measureEl itself as scratch space for its own
    // pinned-width probe (cached after the first call per stadium), so it
    // has to finish before this function overwrites measureEl's content
    // with what's actually being measured here.
    const fit = computeHeaderFit(stadium);
    measureEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    // Must mirror whatever showOverlay() sets on the real element below —
    // .expanded is display:flex, and measuring it as display:block (this
    // element's static default) would let its flex-only sizing rules
    // (min-height:0 on the scroll wrap, in particular) silently not apply,
    // risking a measured height that doesn't match what's actually shown.
    measureEl.style.display = pinned ? 'flex' : 'block';
    measureEl.innerHTML = html;
    applyHeaderFit(measureEl, fit);
    return { w: measureEl.offsetWidth, h: measureEl.offsetHeight };
  }

  // Prefers placing the box below the dot; if it doesn't fit, to the right;
  // if that doesn't fit either, above-and-left of the dot; and as an
  // absolute last resort, centered over the dot. Always clamped to stay
  // fully inside the current window.
  function computePlacement(anchor, w, h, mapSize) {
    let mode, left, top;
    if (anchor.x - OV_INSET + w + OV_MARGIN <= mapSize.x && anchor.y + OV_GAP + h + OV_MARGIN <= mapSize.y) {
      mode = 'below';
      left = anchor.x - OV_INSET;
      top = anchor.y + OV_GAP;
    } else if (anchor.x + OV_GAP + w + OV_MARGIN <= mapSize.x && anchor.y - OV_INSET + h + OV_MARGIN <= mapSize.y) {
      mode = 'right';
      left = anchor.x + OV_GAP;
      top = anchor.y - OV_INSET;
    } else if (anchor.x - OV_GAP - w >= OV_MARGIN && anchor.y - OV_GAP - h >= OV_MARGIN) {
      mode = 'above-left';
      left = anchor.x - OV_GAP - w;
      top = anchor.y - OV_GAP - h;
    } else {
      mode = 'over-dot';
      left = anchor.x - w / 2;
      top = anchor.y - h / 2;
    }
    left = Math.min(Math.max(left, OV_MARGIN), Math.max(OV_MARGIN, mapSize.x - w - OV_MARGIN));
    top = Math.min(Math.max(top, OV_MARGIN), Math.max(OV_MARGIN, mapSize.y - h - OV_MARGIN));
    return { mode, left, top };
  }

  // Shows/hides each fade strip to match actual scroll position — top
  // fade hidden while already at the top (nothing hidden above yet),
  // bottom fade hidden once scrolled all the way down (or if the content
  // never overflowed in the first place).
  function updateScrollFades(scrollEl) {
    const wrap = scrollEl.parentElement;
    const fadeTop = wrap.querySelector('.ov-fade-top');
    const fadeBottom = wrap.querySelector('.ov-fade-bottom');
    const atTop = scrollEl.scrollTop <= 1;
    const atBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 1;
    if (fadeTop) fadeTop.style.opacity = atTop ? '0' : '1';
    if (fadeBottom) fadeBottom.style.opacity = atBottom ? '0' : '1';
  }

  function showOverlay(stadium, marker, pinned) {
    // Two-stage overlay: hovering shows just the condensed header (logo,
    // stadium name, team name); clicking pins it open and swaps in the full
    // info (stars, years, visit history, etc.).
    const html = pinned ? stadium.fullBodyHtml : stadium.condensedHtml;
    const anchor = map.latLngToContainerPoint(marker.getLatLng());
    const mapSize = map.getSize();
    const fit = computeHeaderFit(stadium);
    const size = measureBox(html, pinned, stadium);
    const placement = computePlacement(anchor, size.w, size.h, mapSize);

    overlayEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    overlayEl.innerHTML = html + (pinned ? '<button type="button" class="ov-close" aria-label="Close">&times;</button>' : '');
    overlayEl.style.left = placement.left + 'px';
    overlayEl.style.top = placement.top + 'px';
    // .expanded is display:flex (pinned header + independently-scrolling
    // body); the condensed hover preview stays a plain block box.
    overlayEl.style.display = pinned ? 'flex' : 'block';
    // applyHeaderFit just assigns the already-computed (pinned-width-based)
    // font-size/letter-spacing values — no live measurement here, so it
    // doesn't matter that this runs on both modes and doesn't need the box
    // laid out first.
    applyHeaderFit(overlayEl, fit);

    // The scrollable body is rebuilt fresh every call (innerHTML above),
    // so its fade state and scroll listener need re-wiring each time too.
    if (pinned) {
      const scrollEl = overlayEl.querySelector('.ov-scroll');
      if (scrollEl) {

        // scrollbar is on this system (0 on systems with overlay
        // scrollbars, ~15-17px on Windows/some Linux) — otherwise the
        // fade paints straight over the scrollbar track, including its
        // clickable up/down arrow buttons where present.
        const scrollbarWidth = scrollEl.offsetWidth - scrollEl.clientWidth;
        const wrap = scrollEl.parentElement;
        const fadeTop = wrap.querySelector('.ov-fade-top');
        const fadeBottom = wrap.querySelector('.ov-fade-bottom');
        if (fadeTop) fadeTop.style.right = scrollbarWidth + 'px';
        if (fadeBottom) fadeBottom.style.right = scrollbarWidth + 'px';

        scrollEl.addEventListener('scroll', () => updateScrollFades(scrollEl));
      }
    }
  }

  function dismissPinned() {
    pinnedStadiumName = null;
    overlayEl.style.display = 'none';
  }

  // Repositions the pinned overlay to follow its dot after a pan/zoom/
  // resize, rather than dismissing it.
  function repositionPinned() {
    if (!pinnedStadiumName) return;
    const marker = markerByName[pinnedStadiumName];
    const stadium = stadiumByName[pinnedStadiumName];
    if (marker && stadium) showOverlay(stadium, marker, true);
  }

  // --- Full-screen photo lightbox ---
  // Deliberately placed outside #map in the markup (see the body), so it
  // can never be mistaken for a map-contained element the way the
  // stadium overlay itself has to guard against below.
  const lightboxEl = document.getElementById('photo-lightbox');
  const lightboxImgEl = document.getElementById('photo-lightbox-img');
  const lightboxCreditEl = document.getElementById('photo-lightbox-credit');
  // The caption/credit box is explicitly pinned, in JS, to the photo's own
  // *rendered* width (rather than trusting CSS intrinsic sizing) so that a
  // long caption can never inflate the box wider than the image itself —
  // that mismatch previously showed up as a stray semi-transparent
  // (box-shadow) rectangle wider than the photo on long-caption photos.
  function syncLightboxCreditWidth() {
    if (lightboxImgEl.offsetWidth) {
      lightboxCreditEl.style.width = lightboxImgEl.offsetWidth + 'px';
    }
  }
  function openLightbox(photo, kind) {
    lightboxImgEl.src = photo.url;
    lightboxCreditEl.innerHTML = kind === 'personal'
      ? (photo.caption || '')
      : (photo.credit ? `Photo: <a href="${photo.creditUrl}" target="_blank" rel="noopener">${photo.credit}</a>` : '');
    lightboxCreditEl.style.width = '';
    lightboxEl.style.display = 'flex';
    lightboxImgEl.onload = syncLightboxCreditWidth;
    if (lightboxImgEl.complete) syncLightboxCreditWidth();
    window.addEventListener('resize', syncLightboxCreditWidth);
  }
  function closeLightbox() {
    lightboxEl.style.display = 'none';
    lightboxImgEl.src = '';
    window.removeEventListener('resize', syncLightboxCreditWidth);
  }
  // Closes on a click anywhere on the dark backdrop or the close button,
  // but not on the image or credit/caption themselves (children of the
  // backdrop too, so excluded explicitly).
  lightboxEl.addEventListener('click', (e) => {
    if (e.target === lightboxEl || e.target.closest('.photo-lightbox-close')) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightboxEl.style.display !== 'none') closeLightbox();
  });

  overlayEl.addEventListener('click', (e) => {
    e.stopPropagation(); // clicking inside the overlay must not bubble to the map
    if (e.target.closest('.ov-close')) { dismissPinned(); return; }
    const photoEl = e.target.closest('.ov-photo');
    // lastDragMoved (tracked below) tells a genuine click-to-expand apart
    // from the mouseup at the end of a click-and-drag scroll gesture that
    // happened to end up over a photo — only the former should open it.
    if (photoEl && !lastDragMoved) {
      const stadium = stadiumByName[pinnedStadiumName];
      const kind = photoEl.dataset.photoKind;
      const idx = Number(photoEl.dataset.photoIdx);
      const list = stadium && (kind === 'personal' ? stadium.personalPhotos : stadium.photos);
      if (list && list[idx]) openLightbox(list[idx], kind);

  // map container, which the overlay lives inside — so without stopping
  // these here too, a mousedown/touchstart/wheel that starts on the
  // overlay (e.g. trying to drag-scroll its content) bubbles up and
  // Leaflet treats it as "start panning/zooming the map," which then
  // dismisses the overlay via the movestart/zoomstart listener below.
  // Stopping them at the source is what lets the overlay's own scrolling
  // work at all, and keeps outside interactions (actually dragging the
  // map) still panning — and dismissing — normally.
  overlayEl.addEventListener('wheel', (e) => { e.stopPropagation(); });
  overlayEl.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });

  // Click-and-drag-to-scroll with the mouse: browsers only do this
  // natively for touch, so the mouse version is hand-rolled — track the
  // pointer's Y on mousedown, adjust .ov-scroll's scrollTop by the delta
  // on every subsequent mousemove, and stop on mouseup. Listening on
  // window (not just the overlay) for move/up means the drag keeps
  // tracking correctly even if the cursor slips outside the overlay's
  // bounds mid-drag. The "moved" flag (surfaced as lastDragMoved on
  // mouseup) is what lets the click handler above tell a real click on a
  // photo apart from a drag-to-scroll that ends on top of one.

  let lastDragMoved = false;

  const filtersPanelEl = document.getElementById('filters-panel');
  filtersPanelEl.addEventListener('click', () => { if (pinnedStadiumName) dismissPinned(); });
  filtersPanelEl.addEventListener('change', () => { if (pinnedStadiumName) dismissPinned(); });

  map.on('movestart zoomstart', () => { dismissPinned(); });

  stadiums.forEach(s => {
    const style = STYLES[s.category];
    // Current stadiums (visited or not) render as their team logo inside a
    // bordered white circle. Demolished stadiums — both former-visited and
    // historic-demolished — get a plain dot with a small white center dot,
    // to distinguish them from their "still exists" counterparts, which
    // otherwise share the same fill color. Everything else stays a plain
    // circleMarker dot.
    const isCurrent = s.category === 'current_visited' || s.category === 'current_not_visited';
    const isDemolished = s.category === 'former_demolished' || s.category === 'historic_demolished';
    const marker = isCurrent
      ? L.marker([s.lat, s.lon], { pane: 'pane-' + s.category, icon: logoIcon(style.color, s.logoUrl || `https://www.mlbstatic.com/team-logos/${s.teamId}.svg`, s.rating) })
      : isDemolished
        ? L.marker([s.lat, s.lon], {
            pane: 'pane-' + s.category,
            // Historic dots use the same dark-green border as their

            // its original single-color look (border defaults to fill).
            icon: demolishedDotIcon(style.color, s.category === 'historic_demolished' ? STYLES.former_exists.color : style.color)
          })
        : L.circleMarker([s.lat, s.lon], {
            pane: 'pane-' + s.category,
            radius: MARKER_RADIUS,
            // Historic (not-visited) dots get a dark-green border — the
            // same hunter green used for former-visited dots — to tie the
            // two "former stadium" categories together visually while
            // keeping the lighter sage fill that sets this one apart.
            color: s.category === 'historic_not_visited' ? STYLES.former_exists.color : style.color,
            weight: s.category === 'historic_not_visited' ? 1 : 1.5,
            fillColor: style.color,
            fillOpacity: 0.9
