<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MLB Stadiums Map</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14.5' fill='%23fdfdfb' stroke='%23c9c4b8' stroke-width='2.2'/%3E%3Cg transform='rotate(45 16 16)'%3E%3Cpath d='M8 5 Q17 16 8 27' fill='none' stroke='%23d43d3d' stroke-width='1.6'/%3E%3Cpath d='M24 5 Q15 16 24 27' fill='none' stroke='%23d43d3d' stroke-width='1.6'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  /* 100vh on iOS Safari is the LARGEST possible viewport — as if the
     address bar/toolbar chrome were already hidden — not however much is
     actually visible right now. On first load (chrome still showing),
     that makes #map taller than the real visible window, so content
     centered within it (see applyDefaultView/fitBounds) sits centered in
     a box that's partly scrolled off past the bottom of what's actually
     on screen — reading as "positioned a bit low." 100dvh (the "dynamic"
     viewport height unit) tracks the REAL current visible height,
     chrome and all, and updates live as it shows/hides — falls back to
     the 100vh value above on any browser that doesn't recognize dvh yet
     (an unsupported unit is simply ignored, leaving the prior
     declaration in place, so this is safe everywhere). */
  #map { width: 100%; height: 100vh; height: 100dvh; background: #aad3df; position: relative; }

  .panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(255,255,255,0.8);
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.3);
    font-size: 12px;
    color: #222;
    /* No padding here — it lives on the toggle button and on #filters-body
       instead, so the button's own box IS the entire visible surface with
       no unclickable margin around it (previously the panel's padding sat
       outside the button, so only the label/arrow themselves, not the
       full rounded box around them, actually responded to clicks). */
  }
  /* Only force the wider width while expanded — collapsed, the panel
     should shrink to fit just the toggle button (and its label). */
  .panel.expanded { min-width: 210px; }
  .panel-header {
    display: flex;
    align-items: center;
  }
  #filters-body { margin-top: 4px; padding: 0 14px 12px 14px; box-sizing: border-box; }
  /* The whole button — label and arrow together, plus all the padding
     around them — is the hit target, not just the little arrow glyph. */
  .filters-toggle-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: #222;
    padding: 12px 14px;
    line-height: 1;
    text-align: left;
    border-radius: 8px;
  }
  /* Expanded, the button's bottom padding shrinks and #filters-body's own
     top margin picks up the rest, so the header-to-body gap stays the
     same 8px it always was. */
  .panel.expanded .filters-toggle-btn { padding-bottom: 4px; }
  .filters-toggle-btn:hover { color: #000; }
  .filters-toggle-btn:hover .filters-toggle-arrow { color: #000; }
  .filters-toggle-label { flex: 1; }
  /* Hide the label once expanded — the panel body makes it redundant, and
     hiding it lets the collapsed button stay compact. */
  .panel.expanded .filters-toggle-label { display: none; }
  .filters-toggle-arrow { font-size: 11px; color: #555; margin-left: auto; }
  .filter-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    margin: 6px 0 2px 0;
  }
  .filter-divider {
    border: none;
    border-top: 1px solid #e2e2e2;
    margin: 10px 0;
  }
  .filter-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
  }
  .filter-row input { margin: 0; cursor: pointer; }
  .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,0.35);
    flex: none;
  }
  /* Route-layer legend swatches read as a short line rather than a dot. */
  .swatch-line {
    width: 14px;
    height: 3px;
    border-radius: 1.5px;
    border: none;
  }
  /* While the 2007 Road Trip layer is active, every other filter control
     is screened behind an opaque white scrim — visible but inert — so the
     road-trip toggle (outside this wrapper) is the only thing exposed. */
  #filters-dimmable-wrap {
    position: relative;
  }
  #filters-scrim {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.7);
  }
  .filter-row label { cursor: pointer; }
  .stars-label {
    letter-spacing: 1px;
    font-size: 12px;
  }
  .stars-label .filled { color: #d4a017; }
  .stars-label .empty { color: #d7d7d7; }
  .filter-count {
    margin-left: auto;
    padding-left: 8px;
    color: #999;
    font-size: 11px;
    flex: none;
  }

  /* Circle-only hit testing (excluding the star badge, and letting
     transparent space pass through to a smaller marker sitting nearby)
     is handled in JS via a cursor-distance check, not CSS pointer-events
     — that approach proved unreliable, so this stays a normal,
     fully-interactive element. */
  .logo-marker-icon { background: transparent; border: none; }
  /* Road-trip draw-in: pops a stadium's icon as the animated route reaches
     it. Applied to the inner <svg>, never the outer divIcon element itself
     — Leaflet positions that outer element with its own transform, and a
     competing transform there would make the marker jump on screen. */
  @keyframes stadiumPop {
    0% { transform: scale(0.2); opacity: 0; }
    60% { transform: scale(1.25); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .stadium-pop-svg { animation: stadiumPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: center; }
  .demolished-marker-icon { background: transparent; border: none; }
  .plain-dot-marker-icon { background: transparent; border: none; }
  /* Phone drawer only: every marker except the tapped/pinned one gets
     muted like this while its panel is open, baked directly into the
     divIcon's className at icon-generation time (see updateGrowingMarkerSizes)
     rather than toggled after the fact — the icon element gets fully
     recreated by setIcon() on every zoom/resize/pin/unpin, so a class
     applied post-hoc here would just get wiped out the next time that
     happens. */
  .stadium-marker-dimmed { filter: grayscale(100%); opacity: 0.4; }

  /* ============================================================
     Stadium info overlay — "Green Monster" manual-scoreboard theme:
     painted-green panel, cream stenciled numerals, subtly-framed slots.
     Two font styles run throughout: Font Style 1 (fs1, bright cream —
     the "readout" numbers/values) and Font Style 2 (fs2, smaller/dimmer
     gold — secondary text), plus .hl to pop a specific number bright
     white within a dimmer run of text (e.g. the "#1" in "My #1 Stadium").
     ============================================================ */
  :root {
    /* Default ("current stadium") scheme — the original Green Monster
       palette. Other categories override every one of these variables on
       a scheme-* class applied alongside .stadium-overlay (see below);
       nothing here needs to change for those overrides to take effect,
       since every rule in this file reads color through these variables
       rather than hardcoding a value. */
    --gm-frame: #5b5a3f;       /* darkened, subtle "cream" framing line */
    --gm-frame-outer: #4d4c36;
    --gm-slot-bg: #08251c;     /* header band + individual metadata slots */
    --gm-green: #0b4a37;       /* card/scroll-body background */
    --gm-cream: #f5efd8;
    --gm-cream-dim: #a9a37c;
    --gm-star-dim: #2f5c4c;
    --gm-commentary-text: #e7e1c9;
    --gm-link: #bfe0ff;
    --gm-caption-text: #cfe3d8;
  }
  /* Current stadium, not yet visited: light blue — inverted like the
     light-green scheme below (dark text/accents on a light background). */
  .scheme-current-not-visited {
    --gm-frame: #7fb3d9;
    --gm-frame-outer: #5f9dcc;
    --gm-slot-bg: #cde3f2;
    --gm-green: #e4f1fa;
    --gm-cream: #0d3a5c;
    --gm-cream-dim: #3d6a8a;
    --gm-star-dim: #a9cde0;
    --gm-commentary-text: #16405e;
    --gm-link: #0b4f91;
    --gm-caption-text: #234f6e;
  }
  /* Former stadium, attended: medium-to-light grey — inverted like the
     light-green and light-blue schemes (dark text/accents on a pale
     background), rather than the dark-on-light structure this used to
     share with the default scheme. */
  .scheme-former-attended {
    --gm-frame: #a8a49c;
    --gm-frame-outer: #8f8b82;
    --gm-slot-bg: #d8d5cd;
    --gm-green: #ece9e2;
    --gm-cream: #2b2a26;
    --gm-cream-dim: #5c584f;
    --gm-star-dim: #b8b4ab;
    --gm-commentary-text: #37342e;
    --gm-link: #1a5fa8;
    --gm-caption-text: #45413a;
  }
  /* Former stadium, never attended: light green — inverted from the other
     three schemes (dark text/accents on a light background), since a pale
     background needs dark foreground colors to stay readable. --gm-cream
     is the "brightest/most prominent" text role in every scheme, so here
     it's the darkest green rather than the lightest cream. */
  .scheme-former-unattended {
    --gm-frame: #8fbf96;
    --gm-frame-outer: #6fa378;
    --gm-slot-bg: #c7e6cc;
    --gm-green: #e3f4e5;
    --gm-cream: #16321a;
    --gm-cream-dim: #4d6b50;
    --gm-star-dim: #a9cdae;
    --gm-commentary-text: #234828;
    --gm-link: #1a5fa8;
    --gm-caption-text: #2d4f31;
  }
  /* Future/planned stadium: light purple — inverted, matching the same
     tone/lightness as the light-blue current_not_visited scheme rather
     than the darker purple this used to be. */
  .scheme-future {
    --gm-frame: #b09bd9;
    --gm-frame-outer: #9683c9;
    --gm-slot-bg: #e5defa;
    --gm-green: #f1ecfb;
    --gm-cream: #3a2465;
    --gm-cream-dim: #6b5591;
    --gm-star-dim: #d3c4ea;
    --gm-commentary-text: #3f2a6b;
    --gm-link: #6a3fa3;
    --gm-caption-text: #4a3571;
  }
  .fs1 { font-size: 12px; color: var(--gm-cream); font-weight: 600; }
  .fs2 { font-size: 12px; color: var(--gm-cream-dim); font-weight: 400; }
  .hl { color: var(--gm-cream); font-weight: 700; }

  .b-name-band {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--gm-slot-bg); padding: 9px 12px;
  }
  /* Extra right-side room for the pinned view's close button — the
     condensed hover preview has no close button, so it doesn't need it. */
  .ov-pinned-header .b-name-band { padding-right: 34px; border-bottom: 1px solid var(--gm-frame); }
  .b-logo-chip {
    /* Sized to top-align with the stadium name and bottom-align with the
       team name line below it. Fixed cream/white rather than a scheme
       variable — team logos are drawn for a light backing regardless of
       which color scheme the surrounding card is in. */
    width: 44px; height: 44px; border-radius: 4px; background: #f5efd8;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .b-logo-chip img { width: 32px; height: 32px; object-fit: contain; }
  .b-name-stack { min-width: 0; }
  .b-name {
    font-size: 22px; font-weight: 700; color: var(--gm-cream); text-transform: uppercase;
    letter-spacing: 0.8px; line-height: 1.12;
  }
  .b-team {
    margin-top: 3px; font-size: 14px; font-weight: 700; line-height: 1.2;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .b-team-name { color: var(--gm-cream); }         /* team name: bright cream/white, keeps the bold from .b-team */
  /* (league division): dimmer gold, regular weight, one step smaller — in
     em (relative to .b-team's own font-size, 12/14) rather than a fixed
     px, so that if .b-team ever gets shrunk to fit (see fitOneLineToWidth)
     this scales down right along with it instead of staying fixed while
     everything around it gets smaller. */
  .b-team-leaguediv { color: var(--gm-cream-dim); font-weight: 400; font-size: 0.857em; }

  .b-meta-stack { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .b-slot { border: 1px solid var(--gm-frame); border-radius: 2px; padding: 9px 12px; background: var(--gm-slot-bg); }
  .b-slot-label { font-size: 10px; letter-spacing: 0.6px; color: var(--gm-cream-dim); text-transform: uppercase; font-weight: 700; }

  /* Section 1: city / stars / built-years / ranking. Each pair is its own
     baseline-aligned row so the two sides line up despite differing font
     sizes. */
  .b-meta-row { display: flex; align-items: baseline; justify-content: space-between; }
  .b-meta-row + .b-meta-row { margin-top: 4px; }
  /* Nudged down 1px from true baseline alignment — the star glyphs'
     points make them read as visually high relative to the text
     baseline even though they're technically aligned to it. Also nudged
     3px right: letter-spacing adds trailing space after the last star,
     so the row's true right edge (which is what lines up with the "My
     #X Stadium" text on the row below via justify-content:space-between)
     sits past the last visible star glyph — this closes that gap so the
     two right edges read as one straight line. */
  .b-stars { color: var(--gm-cream); font-size: 17px; letter-spacing: 1px; line-height: 1; position: relative; top: 1px; left: 3px; }
  .b-stars .dim { color: var(--gm-star-dim); }

  /* Section 2: MLB years (one line per team that has called the stadium
     home, baseline-aligned) combined with Formerly/Also-known-as into one
     module, with a little breathing room between the two sub-sections. */
  .b-tenant-list { margin-top: 3px; }
  .b-tenant-line { display: flex; align-items: baseline; gap: 6px; }
  .b-tenant-line + .b-tenant-line { margin-top: 2px; }
  .b-formerly-block { margin-top: 8px; }

  .b-section-gap { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gm-frame); }

  .b-commentary {
    padding: 9px 12px; border: 1px solid var(--gm-frame); border-radius: 2px;
    background: var(--gm-slot-bg); font-size: 13px; line-height: 1.55; color: var(--gm-commentary-text);
  }
  .b-commentary p { margin: 0 0 8px; }
  .b-commentary p:last-child { margin-bottom: 0; }
  /* A plain dark-blue link (the browser default) all but disappears
     against this dark green — light, slightly-blue-tinted and underlined
     reads clearly instead, for this and any future in-text links. Each
     scheme sets its own --gm-link so this stays legible against every
     background, including the light-green scheme's inverted contrast. */
  .b-commentary a { color: var(--gm-link); text-decoration: underline; }

  /* Hover preview + click-to-expand overlays: plain absolutely-positioned
     boxes (not Leaflet tooltips/popups) so we control placement exactly,
     never auto-pan the map, and can show a hover preview for one stadium
     while an expanded overlay for another stays open. Toggled via display
     only — no fade transition. */
  .stadium-overlay {
    position: absolute;
    z-index: 1001;
    display: none;
    background: var(--gm-slot-bg);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 2px var(--gm-frame-outer), 0 8px 18px rgba(0,0,0,0.3);
    padding: 0;
    font-family: "Arial Narrow", Arial, sans-serif;
    font-size: 12px;
    line-height: 1.4;
    color: var(--gm-cream-dim);
    white-space: nowrap;
    /* Used to be pointer-events: none while just previewing on hover (not
       pinned) — back when markers still had their own native mouseover/
       mouseout listeners, letting the box catch mouse events could cause
       the browser to re-evaluate what's under a stationary cursor and fire
       a spurious mouseout/mouseover pair on the marker underneath, flashing
       the preview off and back on once. That's no longer how hover works
       here — see "Unified hover/click hit-testing": every show/hide
       decision is driven by cursor-distance geometry against markers'
       true positions, computed on the map container itself, not by native
       DOM hover on individual elements — so this box can safely receive
       mouse events now, which is exactly what lets it act as its own
       click-to-expand target (see the overlayEl click handler). */
    pointer-events: auto;
  }
  /* Expanded (pinned/clicked) overlays get their own layout: a fixed
     width with normal text wrapping (rather than the hover preview's
     nowrap auto-sizing), and a two-part vertical layout — a pinned
     header that never scrolls, and a body capped at roughly half the
     viewport tall that scrolls independently once its content (metadata
     rows, photos, personal notes) exceeds that. The cap is a MAX height,
     not a fixed one: short entries with little content still size down
     to fit, and only grow toward — then stop at — the 50vh ceiling once
     there's enough to warrant it. */
  .stadium-overlay.expanded {
    z-index: 1002;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    width: 340px;
    white-space: normal;
    background: var(--gm-green);
  }
  /* Phone form factor only (see isPhoneFormFactor/showOverlay): the
     pinned panel becomes a fixed-size half-screen drawer instead of a
     content-sized box floating near the marker — full width across the
     bottom half in portrait, full height across the right half in
     landscape (see computePlacementPhoneDrawer). overlayEl.style.width/
     height are set inline to the exact half-screen box each time; this
     class just switches .ov-scroll from its normal "grow up to a 50vh
     cap" behavior to "fill whatever's left of the box below the pinned
     header," since the box itself is now a fixed height rather than
     intrinsic/content-sized. */
  /* .ov-scroll-wrap is a plain block (position:relative, no display:flex)
     everywhere else — it doesn't need to be, since the desktop/tablet box
     is auto-height and .ov-scroll's own max-height:50vh cap is all that's
     needed there. In the phone drawer the OUTER box has a real, fixed
     height instead (see above), so .ov-scroll-wrap now has to actually
     stretch to fill the leftover flex space itself (flex:1 1 auto is
     meaningless on a child unless its PARENT is a flex container — this
     is what makes the next rule's flex:1 1 auto on .ov-scroll do anything
     at all), and then hand that space on down to .ov-scroll as ITS OWN
     nested flex column. Without this, .ov-scroll-wrap just sizes to its
     content and leaves dead space below it instead of actually letting
     .ov-scroll grow to fill (and therefore scroll) the drawer.  */
  .stadium-overlay.phone-drawer .ov-scroll-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .stadium-overlay.phone-drawer .ov-scroll {
    max-height: none;
    flex: 1 1 auto;
    min-height: 0;
  }
  .ov-pinned-header { flex: none; }
  .ov-scroll-wrap { position: relative; }
  .ov-scroll {
    /* The cap lives directly on the scrolling element itself (rather
       than on an ancestor, with this stretching to fill it via flex) —
       simpler and doesn't depend on flexbox's shrink negotiation to
       hand it a definite height. "About half the viewport": the pinned
       header adds a bit more on top of this. Overridden for the phone
       drawer above. */
    max-height: 50vh;
    overflow-y: auto;
    padding: 0 14px 14px 14px;
    /* Keeps wheel/trackpad scrolling that reaches the top or bottom of
       this box from "chaining" into the map underneath and zooming it. */
    overscroll-behavior: contain;
    touch-action: pan-y;
    cursor: grab;
  }
  .ov-scroll.ov-dragging { cursor: grabbing; }
  /* Neutralizes the clipping that would otherwise break a video's own
     fullscreen button — see updateOverlayFullscreenClipping() for why this
     is needed (a fullscreened cross-origin iframe getting clipped to an
     overflow:hidden/auto ancestor's box is a real browser bug, not
     something fixable via z-index or the Fullscreen API alone). Only
     active for as long as something inside the overlay actually is
     fullscreen, so the panel's normal rounded-corner clipping and scroll
     behavior are completely unaffected the rest of the time. */
  .stadium-overlay.has-fullscreen-descendant { overflow: visible; }
  .stadium-overlay.has-fullscreen-descendant .ov-scroll { overflow: visible; max-height: none; }
  /* Themed scrollbar: browsers otherwise draw a plain white gutter with a
     flat gray thumb/arrows regardless of the panel's own colors, which
     stands out against every one of the 5 color schemes here. Both rules
     read the same per-scheme CSS variables as everything else in the
     panel (see the .scheme-* blocks above), so this automatically stays
     correct for whichever scheme is active without needing its own
     per-scheme overrides. Track uses --gm-green (the panel's own
     scroll-body background) so the gutter reads as part of the panel
     rather than a separate control; thumb uses --gm-cream-dim, which
     across every scheme is already tuned to have decent contrast against
     --gm-green (it's used for exactly that purpose elsewhere in the
     panel). scrollbar-color also themes the up/down arrow buttons in
     browsers that support it (Firefox, and Chromium new enough to render
     its auto-generated non-classic scrollbar) — there's no reliable
     cross-browser way to recolor those arrows via the older
     -webkit-scrollbar-button route, so this is as close as it gets on
     browsers that don't honor scrollbar-color at all. */
  .ov-scroll {
    scrollbar-width: thin;
    scrollbar-color: var(--gm-cream-dim) var(--gm-green);
  }
  .ov-scroll::-webkit-scrollbar { width: 10px; }
  .ov-scroll::-webkit-scrollbar-track { background: var(--gm-green); }
  .ov-scroll::-webkit-scrollbar-thumb {
    background-color: var(--gm-cream-dim);
    border-radius: 5px;
    border: 2px solid var(--gm-green);
  }
  .ov-scroll::-webkit-scrollbar-thumb:hover { background-color: var(--gm-cream); }
  /* Fade strips sit on top of the scrolling content (siblings, not
     children, so they never scroll away themselves) and hint that
     there's more above/below to scroll to. Their opacity is toggled by
     JS to match actual scroll position — hidden at the very top/bottom,
     shown otherwise — so nothing fades before there's something to hide. */
  .ov-fade-top, .ov-fade-bottom {
    position: absolute;
    left: 0; right: 0;
    height: 22px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.15s ease;
  }
  /* Fades to fully transparent (not a 0-alpha copy of --gm-green) so the
     gradient's start color always matches whichever scheme is active
     without needing a second per-scheme "transparent version" variable. */
  .ov-fade-top { top: 0; background: linear-gradient(to bottom, var(--gm-green), transparent); }
  .ov-fade-bottom { bottom: 0; background: linear-gradient(to top, var(--gm-green), transparent); }
  .ov-photo { width: 100%; height: auto; display: block; border-radius: 2px; cursor: zoom-in; }
  .ov-photo + .ov-photo { margin-top: 8px; }
  /* Zoom-crops a poorly-framed source photo for its overlay thumbnail only
     (the full original still shows in the lightbox) — see buildMediaHtml's
     p.cropPercent handling. The wrapper clips to the photo's normal
     (uncropped) box size; the inner .ov-photo is scaled up by a transform
     (which doesn't affect layout, so the wrapper's box stays put) enough
     that its outer cropPercent% margin on every edge falls outside the
     wrapper and gets clipped away. */
  .ov-photo-crop-wrap { overflow: hidden; border-radius: 2px; }
  .ov-photo-crop-wrap .ov-photo { border-radius: 0; transform-origin: center; }
  .ov-photo + .ov-photo-crop-wrap, .ov-photo-crop-wrap + .ov-photo, .ov-photo-crop-wrap + .ov-photo-crop-wrap { margin-top: 8px; }
  .ov-photo-credit {
    font-size: 10px;
    color: var(--gm-cream-dim);
    margin-top: 3px;
    margin-bottom: 8px;
  }
  .ov-photo-credit a { color: var(--gm-cream-dim); }
  /* Responsive 16:9 YouTube embed — the padding-bottom trick reserves the
     right aspect-ratio height before the iframe loads, so the panel
     doesn't jump once it renders. */
  .ov-video-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 2px;
    overflow: hidden;
  }
  .ov-video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .ov-video-wrap + .ov-video-wrap { margin-top: 8px; }
  /* Caption under a personal photo — same slot as .ov-photo-credit but
     no link. */
  .ov-photo-caption {
    font-size: 12px;
    color: var(--gm-caption-text);
    margin-top: 3px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .ov-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--gm-cream-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .ov-close:hover { color: var(--gm-cream); }

  .state-label {
    color: #b9bec7;
    font-size: 5.5px;
    font-weight: 300;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 3px rgba(255,255,255,0.8), 0 0 3px rgba(255,255,255,0.8);
  }

  /* Full-screen photo lightbox — sits outside #map entirely (see the
     body markup) so it's never a descendant of the Leaflet container and
     therefore can't have its clicks/drags mistaken for map interaction
     the way the stadium overlay itself has to guard against. Opened by
     clicking any .ov-photo; closed by clicking the backdrop, the close
     button, or pressing Escape — never by clicking the image itself. */
  .photo-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    /* No horizontal padding: the photo itself should best-fit all the way
       to the left/right edges of the screen. A little vertical breathing
       room is kept so the image doesn't collide with the close/fullscreen
       buttons up top. The caption gets its own horizontal inset below,
       independent of this. */
    padding: 16px 0;
    box-sizing: border-box;
    cursor: zoom-out;
  }
  .photo-lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    max-height: 100%;
  }
  .photo-lightbox img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 76px);
    max-height: calc(100dvh - 76px);
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    cursor: default;
  }
  .photo-lightbox-credit {
    margin-top: 12px;
    padding: 0 16px;
    box-sizing: border-box;
    max-width: 100%;
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    cursor: default;
  }
  .photo-lightbox-credit a { color: rgba(255,255,255,0.9); }
  .photo-lightbox-close {
    position: absolute;
    top: 16px;
    right: 20px;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #fff;
    font-size: 26px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .photo-lightbox-close:hover { color: #ddd; }
  /* True browser Fullscreen API toggle (hides browser chrome too, not just
     visually fills the viewport the way the lightbox backdrop already
     does) — feature-detected in JS and hidden entirely on browsers that
     don't support requesting fullscreen on an arbitrary element (notably
     iPhone Safari, which only supports it for <video>). */
  .photo-lightbox-fullscreen-btn {
    position: absolute;
    top: 16px;
    right: 64px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: #fff;
    cursor: pointer;
    padding: 0;
  }
  .photo-lightbox-fullscreen-btn:hover { color: #ddd; }
  .photo-lightbox-fullscreen-btn svg { width: 18px; height: 18px; }

  .reset-view-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    background: #fff;
    font-size: 22.5px; /* ~50% larger than the original 15px */
    line-height: 1;
    color: #333;
    text-decoration: none;
  }
  .reset-view-btn:hover { background: #f4f4f4; color: #000; }

  /* TEMPORARY — remove alongside the debug overlay JS block once the
     portrait marker-growth issue is confirmed fixed on-device. Hidden by
     default; tap the Yucatan Peninsula on the map to show/hide it.
     Fixed to the viewport and centered — deliberately NOT a Leaflet
     marker tied to a real lat/lng, so it always shows up dead center on
     screen regardless of wherever the map happens to be panned/zoomed to,
     rather than only appearing when its anchor geography is in view. */
  .debug-overlay {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5000;
    max-width: min(90vw, 340px);
    max-height: 80vh;
    overflow-y: auto;
    box-sizing: border-box;
    background: rgba(255,255,255,0.96);
    border: 1px solid #333;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    padding: 8px 26px 8px 10px;
    font-family: monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #111;
    white-space: normal;
    overflow-wrap: break-word;
    pointer-events: auto;
  }
  .debug-overlay.visible { display: block; }
  .debug-overlay .debug-close {
    position: absolute;
    top: 2px;
    right: 4px;
    width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    font-family: sans-serif;
    font-size: 13px;
    color: #666;
    cursor: pointer;
  }
  .debug-overlay .debug-close:hover { color: #000; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // category -> color / style. Kept in sync with the five overlay color
  // schemes (see the .scheme-* CSS rules): current-visited stays the
  // original dark green, current-not-visited is light blue, former
  // (attended) is dark grey, historic (never attended) is light green,
  // future is purple. This single object drives both the marker/ring/star
  // colors on the map AND (via schemeClassFor below) which overlay scheme
  // each stadium's hover/pinned panel uses, so updating a color here is
  // the one general place that needs to change for either to shift.
  const STYLES = {
    current_visited:     { color: '#1e7145' },
    current_not_visited: { color: '#5fa8dd' },
    former_demolished:   { color: '#7d7970' },
    former_exists:       { color: '#7d7970' },
    historic_not_visited: { color: '#a9d1a9' },
    historic_demolished:  { color: '#a9d1a9' },
    future_planned:       { color: '#a688d9' }
  };
  const MARKER_RADIUS = 6; // px, at default zoom (circleMarker; former/historic/future dots)
  // former/historic/future dots grow with zoom on desktop/tablet (see
  // dotRadiusForZoom below), capping out at this radius. Originally kept
  // just under the current-stadium logo marker's own visible circle
  // (15.5px) so a fully-grown dot would never exceed it; now deliberately
  // twice that former cap, so a fully-grown dot noticeably exceeds the
  // (fixed-size) logo markers at high zoom instead of just matching them.
  const FULL_MARKER_RADIUS = 29;

  // Current stadiums (visited or not) are marked with their team logo inside
  // a white circle bordered in the category color, 36px across. 5-star
  // stadiums get the same circle, laid over a light-gold star 50% bigger
  // than the circle so its points show around the edge.
  const LOGO_ICON_SIZE = 36;
  const STAR_SCALE = 1.5;

  // 5-point star polygon centered at (cx, cy).
  function starPoints(cx, cy, outerR, innerR) {
    const pts = [];
    for (let i = 0; i < 5; i++) {
      const outerAngle = -Math.PI / 2 + i * (2 * Math.PI / 5);
      const innerAngle = outerAngle + Math.PI / 5;
      pts.push(`${(cx + outerR * Math.cos(outerAngle)).toFixed(2)},${(cy + outerR * Math.sin(outerAngle)).toFixed(2)}`);
      pts.push(`${(cx + innerR * Math.cos(innerAngle)).toFixed(2)},${(cy + innerR * Math.sin(innerAngle)).toFixed(2)}`);
    }
    return pts.join(' ');
  }

  // circleSize defaults to the fixed LOGO_ICON_SIZE (desktop/tablet, never
  // grows); on mobile, updateGrowingMarkerSizes passes a zoom-dependent,
  // grown circleSize instead — every dimension here (insets, ring stroke
  // width) scales proportionally with it, so a 4x-grown marker still
  // looks like a scaled-up version of the same icon, not a blown-up image
  // with a paper-thin border.
  function logoIcon(color, logoSrc, rating, circleSize = LOGO_ICON_SIZE, dimmed = false) {
    const scale = circleSize / LOGO_ICON_SIZE;
    const starred = rating === 5;
    const iconSize = starred ? circleSize * STAR_SCALE : circleSize;
    const c = iconSize / 2;

    // Star behind the circle uses the same color as the circle's outline,
    // at 22% opacity (kept faint so it reads as a subtle badge, not a shape
    // competing with the circle itself).
    const starHtml = starred
      ? `<polygon points="${starPoints(c, c, iconSize / 2 * 0.98, iconSize / 2 * 0.98 * 0.42)}" fill="${color}" fill-opacity="0.22" stroke="${color}" stroke-opacity="0.22" stroke-linejoin="round"/>`
      : '';
    const bg = `<circle cx="${c}" cy="${c}" r="${circleSize / 2 - 2.5 * scale}" fill="#fff"/>`;
    const ring = `<circle cx="${c}" cy="${c}" r="${circleSize / 2 - 4 * scale}" fill="none" stroke="${color}" stroke-width="${3 * scale}"/>`;
    const logoSize = circleSize * 0.56;
    const logoOffset = c - logoSize / 2;
    const logo = `<image href="${logoSrc}" x="${logoOffset}" y="${logoOffset}" width="${logoSize}" height="${logoSize}"/>`;

    return L.divIcon({
      className: 'logo-marker-icon' + (dimmed ? ' stadium-marker-dimmed' : ''),
      html: `<svg width="${iconSize}" height="${iconSize}" viewBox="0 0 ${iconSize} ${iconSize}">${starHtml}${bg}${ring}${logo}</svg>`,
      iconSize: [iconSize, iconSize],
      iconAnchor: [c, c]
    });
  }

  // Demolished dots (former-visited AND historic-not-visited) get a small
  // white center dot so they read distinctly from their "still exists"
  // counterparts, which otherwise share the same fill color. borderColor
  // defaults to fillColor so former_demolished's original single-color look
  // is unchanged; historic_not_visited passes its own dark-green border to
  // match the plain circleMarker styling used for its "still exists" peers.
  function demolishedDotIcon(fillColor, borderColor = fillColor, radius = MARKER_RADIUS, dimmed = false) {
    const r = radius;
    const weight = 1.5;
    const size = (r + weight) * 2;
    const c = size / 2;
    const innerR = r * 0.28;
    return L.divIcon({
      className: 'demolished-marker-icon' + (dimmed ? ' stadium-marker-dimmed' : ''),
      html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
               <circle cx="${c}" cy="${c}" r="${r}" fill="${fillColor}" fill-opacity="0.9" stroke="${borderColor}" stroke-width="${weight}"/>
               <circle cx="${c}" cy="${c}" r="${innerR}" fill="#fff"/>
             </svg>`,
      iconSize: [size, size],
      iconAnchor: [c, c]
    });
  }

  // Plain dot for "still exists" former/historic/future-planned stadiums —
  // same look former/historic dots always had via L.circleMarker (solid
  // fill, own-color border), just rendered as a divIcon instead. Needed so
  // every growing marker (this, demolishedDotIcon, logoIcon) shares the
  // exact same DOM shape — a Leaflet-positioned outer <div> wrapping one
  // plain inner <svg> — which is what lets the zoom-compensation scale
  // below target the inner <svg> uniformly (see applyZoomCompensation).
  // circleMarker's raw SVG <path>, drawn directly inside Leaflet's shared
  // renderer canvas alongside every other vector layer, doesn't have that
  // same simple "one positioned wrapper, one inner shape" structure — that
  // mismatch turned out to be exactly why compensating it directly was so
  // unreliable (see the long comment on applyZoomCompensation for the
  // full story).
  function dotIcon(fillColor, borderColor, weight, radius = MARKER_RADIUS, dimmed = false) {
    const r = radius;
    const size = (r + weight) * 2;
    const c = size / 2;
    return L.divIcon({
      className: 'plain-dot-marker-icon' + (dimmed ? ' stadium-marker-dimmed' : ''),
      html: `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
               <circle cx="${c}" cy="${c}" r="${r}" fill="${fillColor}" fill-opacity="0.9" stroke="${borderColor}" stroke-width="${weight}"/>
             </svg>`,
      iconSize: [size, size],
      iconAnchor: [c, c]
    });
  }

  // Formats 1 -> "1st", 2 -> "2nd", 11 -> "11th", 21 -> "21st", etc.
  function ordinal(n) {
    const v = n % 100;
    if (v >= 11 && v <= 13) return n + 'th';
    switch (n % 10) {
      case 1: return n + 'st';
      case 2: return n + 'nd';
      case 3: return n + 'rd';
      default: return n + 'th';
    }
  }

  // Renders a stadium's internet photo(s) (s.photos: [{url, credit,
  // creditUrl}]) — the whole credit line is itself the hyperlink, no
  // "Photo:" label — and personal photos (s.personalPhotos: [{url,
  // caption}]), captioned rather than credited. Each <img> carries
  // data-photo-kind/data-photo-idx so a click can look up the right entry
  // for the lightbox regardless of which section it's in.
  function buildPhotoImgHtml(p, i, kind) {
    // p.cropPercent (0-100), if present, zoom-crops the thumbnail display
    // only (via a scaled, overflow-hidden wrapper) to hide poor framing —
    // the lightbox still opens the original, uncropped image.
    const imgTag = `<img class="ov-photo" src="${p.url}" alt="" data-photo-kind="${kind}" data-photo-idx="${i}" onerror="this.parentElement && this.parentElement.classList.contains('ov-photo-crop-wrap') ? this.parentElement.style.display='none' : this.style.display='none'">`;
    if (p.cropPercent) {
      const scale = 100 / (100 - 2 * p.cropPercent);
      return `<div class="ov-photo-crop-wrap"><img class="ov-photo" src="${p.url}" alt="" data-photo-kind="${kind}" data-photo-idx="${i}" style="transform: scale(${scale});" onerror="this.parentElement.style.display='none'"></div>`;
    }
    return imgTag;
  }
  function buildPublicPhotosHtml(s) {
    if (!s.photos || !s.photos.length) return '';

  // Returns '' (nothing to show) for a not-yet-built stadium.
  function buildingYears(s) {
    const tenants = getTenants(s);
    if (!tenants.length) return '';
    const startYears = tenants.map(t => {
      const m = t.years.match(/\d{4}/);
      return m ? parseInt(m[0], 10) : Infinity;
    });
    const start = Math.min(...startYears);
    const startStr = isFinite(start) ? start : '';

    return s.demolishedYear

  // yearsUsed at all (future_planned).
  function lastYearUsed(s) {
    const tenants = getTenants(s);
    if (!tenants.length) return null;

      .map(t => {
        const matches = t.years.match(/\d{4}/g);
        return matches ? parseInt(matches[matches.length - 1], 10) : null;

      .filter(y => y != null);

      personalNotes: "This beautiful stadium opened in 1999, and the Mariners moved in from the Kingdome mid-season. Over time I would see more games here than in any stadium other than Fenway Park. My kids grew up going to games here. I had a partial season ticket plan here one year with my friend Jim Cox. I've seen the Mariners win playoff games here (and the Kingdome) in all the post-seasons they've reached. This ballpark's location is excellent — close to downtown and a great atmosphere during the walk to get there. Food options are better than most stadiums, although you will fight the pervasive odor of garlic fries everywhere you go. The view of the city and the bay from the upper deck along the first base line remains one of my favorite sights in baseball, and yeah, there's something sublime about watching the roof close on a misty spring evening."

    { name: "Uniqlo Field at Dodger Stadium", fullName: "Los Angeles Dodgers", teamId: 119, formerNames: "Dodger Stadium", lat: 34.0739, lon: -118.2400, category: "current_visited", rating: 5, firstVisited: 2002, lastVisited: 2026, gamesAttended: 5, ranking: 6, byTeamNum: 12, byStadiumNum: 13, league: "NL", division: "West", city: "Los Angeles", state: "CA", people: ["jessie","andrew","fender","howard","rob"], yearsUsed: "1962–present",
      photos: [
        { url: "https://commons.wikimedia.org/wiki/Special:FilePath/Dodger-Stadium-Panorama-052707.jpg", credit: "Wikimedia Commons", creditUrl: "https://commons.wikimedia.org/wiki/File:Dodger-Stadium-Panorama-052707.jpg" }
      ],
      personalNotes: "Opened in 1962 (like me), this stadium is a time capsule (also like me). The aesthetic is perfect mid-century vintage, and the feeling is pure nostalgia. Incredibly, in the middle of one of the most populous cities in America, here you feel like you are removed to a secluded baseball paradise. It's still cramped in the concourses and hard to move between levels, and the food sucks, but once you're in your seats the vibe is pure chill. I've been there three different times (2002, 2006, 2026), with my kids and my friends, and I'll keep going back any chance I get."
    },

      ],
      personalNotes: "I've been twice to this wonderful stadium, 20 years apart. I visited in 2006 with my kids and my cousin Fender, and my friend Howard, and then again recently (2026) with my friend Rob. On this recent visit I re-jiggered my rankings and moved Petco up to #3, and first among the newer stadiums. The views are wonderful; the stadium blends in beautifully with the texture and sightlines of the city in the background. The downtown location can't be beat, and the food is awesome. If I lived here, I would surely go to 20-30 games a year."
    },

      personalNotes: "This stadium is always ranked among the very best in baseball, for good reason. The views from the upper deck of the city and bay are fabulous. I've been several times, with different companions, and sadly it seems every time I visit, it has a different name. The last time I was here, I saw Dead & Co. play two of their last shows, so this stadium has a special place in my heart. If I lived in the Bay Area, I'd go to 20 games a year!"

      personalNotes: "I moved to Seattle when I was 23 and attended many games at the old cavernous Kingdome. A cement, perfectly round, artificial-turfed monstrosity; it was the biggest room I ever sat in. I, incidentally, also attended several company meetings there as a new Microsoft employee in the 90s. I was there for the one-game playoff in '95 between the Mariners and Angels, and later attended a playoff game between the Mariners and Yankees, and I can say with assurance that those were the loudest moment of my life. My daughter's first game was here. The implosion of this massive structure in 2000 was a seminal moment in Seattle history." },

  // The layers & filters panel docks top-right and floats OVER the map —
  // it doesn't push or resize the map, and the map's auto-fit doesn't
  // reserve any space for it either. Opening/closing the panel is purely
  // visual overlay on top of whatever's already fitted; the map itself
  // never re-fits because of it.
  //
  // The padding here is deliberately FLAT and SYMMETRIC — [60,60] on both
  // corners — rather than reserving extra room for docked controls. That
  // symmetry matters, not just the number: Leaflet's fitBounds picks its
  // zoom from whichever axis (the west-east marker span or the
  // north-south one) needs more room to fit the padded viewport, i.e. it
  // naturally "best-fits by the limiting dimension." And because
  // paddingTopLeft equals paddingBottomRight, the leftover room on the
  // OTHER (non-limiting) axis comes out perfectly centered for free —
  // Leaflet's center calculation cancels out entirely when the two
  // paddings match. So this one flat value simultaneously gives exactly
  // 60px of margin on whichever axis is constrained, and a centered map
  // on the other axis, without computing either case separately. (An
  // earlier version of this reserved extra space for the zoom control so
  // Seattle wouldn't sit behind it — if that resurfaces, it'll need a
  // different fix that doesn't break this symmetry.)
  function viewportFitPadding() {
    const MARGIN = 60;
    return {
      paddingTopLeft: [MARGIN, MARGIN],
      paddingBottomRight: [MARGIN, MARGIN]
    };
  }

  // Default view: fit all 45 stadium locations to the current window size,
  // with modest padding, best-fit for whatever the window's aspect ratio is.
  const stadiumBounds = L.latLngBounds(stadiums.map(s => [s.lat, s.lon]));
  let defaultZoom = 4;

  // How many full 360° "worlds" every stadium marker and state label is
  // currently shifted from its true home coordinates. The map itself pans
  // longitude with no limit (see MAP_MAX_BOUNDS below), but every marker
  // only truly exists at its one real longitude — without this, panning
  // far enough east/west would just run off the edge of a single North
  // America into open ocean forever. Instead, whichever copy of the globe
  // is nearest the current view gets the real stadiums drawn on it (and
  // only that one copy, even if the window is wide/zoomed-out enough to
  // show more than one at once) — see updateWorldOffset, defined once the
  // markers themselves exist, further down.
  let worldOffsetDeg = 0;

  // Whether the user has panned/zoomed away from the default view since it
  // was last applied — tracked so a resize/rotation (see the resize
  // listener further down) knows whether it's safe to silently re-fit to
  // the new orientation's own best-fit view, versus leaving whatever the
  // user has manually navigated to (or a road trip's own framing) alone.
  // dragstart is unambiguously always real user input; zoomstart fires for
  // both real input AND our own programmatic fitBounds/flyTo calls, so
  // those specific calls (below, and flyToDefaultView) briefly suppress
  // this tracking around themselves — flyToTripBounds deliberately does
  // NOT suppress it, since a road trip's own view genuinely should count
  // as "diverged from the all-stadiums default."
  let userDivergedFromDefault = false;
  let suppressInteractionTracking = false;
  map.on('dragstart zoomstart', () => {
    if (!suppressInteractionTracking) userDivergedFromDefault = true;
  });

  // stadiumBounds shifted onto whichever world copy is currently on screen
  // (see worldOffsetDeg/updateWorldOffset). Resetting the view should
  // recenter on the SAME North America you're already looking at, not fly
  // you all the way back around the globe to the one true home copy — if
  // you've scrolled two worlds east and hit reset, you want the nearby
  // copy of the stadiums, not a full-earth spin back to the origin.
  function defaultViewBoundsForCurrentWorld() {
    if (worldOffsetDeg === 0) return stadiumBounds;
    const sw = stadiumBounds.getSouthWest(), ne = stadiumBounds.getNorthEast();
    return L.latLngBounds(
      [sw.lat, sw.lng + worldOffsetDeg],
      [ne.lat, ne.lng + worldOffsetDeg]
    );
  }

  // Generous safety net (just keeps casual panning from drifting off into
  // open ocean/space) rather than a tight box. Unbounded in longitude —
  // [-Infinity, Infinity] — so dragging left/right never hits a wall at
  // all: keep spinning the globe in either direction as far as you like,
  // wrapping seamlessly (Leaflet's tile layer already wraps at ±180° on
  // its own). Bounded in latitude to [-90, 90] — Leaflet's own Mercator
  // projection clamps that internally to its real max (~85.05°, where the
  // projection itself goes to infinity), which in practice reads as "stop
  // once the pole reaches the edge of the screen," exactly as intended.
  // maxBoundsViscosity: 1 makes that latitude limit fully rigid — the
  // drag itself resists going past it, rather than the softer default
  // (freely drag past the limit, then bounce back once you let go, which
  // read as the map ignoring deliberate drags entirely). Longitude being
  // unbounded means viscosity has nothing to enforce on that axis anyway,
  // so this only actually changes how the latitude limit feels.
  //
  // Declared here (before applyDefaultView below, which needs it) rather
  // than after — applyDefaultView's very first call happens synchronously
  // during initial page load, so MAP_MAX_BOUNDS has to already exist by
  // then, not just be hoisted.
  const MAP_MAX_BOUNDS = L.latLngBounds([-90, -Infinity], [90, Infinity]);

  // Surfaced in the debug overlay (see updateDebugOverlay) — if
  // applyDefaultView ever throws partway through, suppressInteractionTracking
  // or maxBounds could otherwise get stuck in the wrong state silently
  // (the catch below restores both regardless), with no visible sign of
  // WHY the next refit misbehaved. Better to see the error on-device than
  // guess at it.
  let lastApplyDefaultViewError = null;
  function applyDefaultView() {
    suppressInteractionTracking = true;
    try {
      // maxBounds off for the fitBounds call itself, then straight back on
      // — same reasoning as flyToDefaultViewSmooth just below (and the
      // road-trip flights further down): a best-fit view computed fresh
      // for whatever the current window/orientation is can legitimately
      // need an extent that presses right up against MAP_MAX_BOUNDS (a
      // tall portrait fit especially, with its large empty margins
      // above/below), and with maxBoundsViscosity:1 that's a HARD clamp —
      // active during the fit, it can distort the very center/zoom
      // fitBounds is trying to compute. This didn't matter for the very
      // first call below (maxBounds isn't set until the lines just above
      // have run), but it matters a lot for every later call from
      // scheduleViewRefit's automatic rotation/resize refit — without
      // this, that path could land on a visibly different, wrong result
      // than clicking Reset (which already had this guard via
      // flyToDefaultViewSmooth) even though both compute the exact same
      // target bounds and padding.
      //
      // animate: false is explicit and load-bearing here, not just
      // belt-and-suspenders: Leaflet's setView/fitBounds will silently
      // auto-animate a "small enough" zoom change over ~250ms on any
      // browser that supports it, UNLESS told not to. That's invisible
      // for a single isolated call — but scheduleViewRefit can fire this
      // same function again (from a second, later resize or
      // visualViewport-resize event) well within that 250ms window during
      // a real device rotation, calling invalidateSize() while the PRIOR
      // call's zoom animation is still mid-flight. Interrupting an
      // in-progress zoom animation like that is exactly the kind of thing
      // that can leave the map holding a genuinely wrong, in-between zoom
      // afterward — which is a very plausible explanation for the debug
      // overlay showing a stale defaultZoom next to a current zoom that
      // doesn't match it. Forcing every call here to apply instantly,
      // synchronously, with nothing left running afterward, removes that
      // whole class of interference.
      map.setMaxBounds(null);
      map.fitBounds(defaultViewBoundsForCurrentWorld(), Object.assign({ animate: false }, viewportFitPadding()));
      map.setMaxBounds(MAP_MAX_BOUNDS);
      defaultZoom = map.getZoom();
      lastApplyDefaultViewError = null;
    } catch (err) {
      lastApplyDefaultViewError = String(err && err.message || err);
      map.setMaxBounds(MAP_MAX_BOUNDS); // best-effort: don't leave bounds disabled
    } finally {
      suppressInteractionTracking = false;
      userDivergedFromDefault = false;
    }
  }

  // Smooth animated version for the reset button — same target view as
  // applyDefaultView, but eased into over exactly one second instead of
  // snapping instantly.
  function flyToDefaultView() {
    suppressInteractionTracking = true;
    flyToDefaultViewSmooth(defaultViewBoundsForCurrentWorld(), Object.assign({ duration: 1 }, viewportFitPadding()));
    suppressInteractionTracking = false;
    userDivergedFromDefault = false;

  // Road-trip bounding boxes are tall and narrow (e.g. the 2006 trip runs
  // Seattle-to-San-Diego-and-back), so fitting one in a wide window picks a
  // zoom driven by its height — and the resulting viewport width at that
  // zoom can span far more longitude than the route itself, enough to press
  // against MAP_MAX_BOUNDS. If maxBounds is still active when that happens,
  // Leaflet forcibly re-pans the instant the animation ends, which reads as
  // a little bounce right at the finish. So maxBounds stays fully off for
  // as long as any road trip is showing (only restored once we're back on

  // for the animation itself.
  function flyToTripBounds(bounds, options) {
    map.setMaxBounds(null);

  function flyToDefaultViewSmooth(bounds, options) {
    map.setMaxBounds(null);

  // dragged window resize.
  let viewportResizeTimer = null;
  window.addEventListener('resize', () => {
    if (viewportResizeTimer) clearTimeout(viewportResizeTimer);
    viewportResizeTimer = setTimeout(updateGrowingMarkerSizes, 150);
  });

  // Leaflet fakes smooth zooming by CSS-transforming the whole pane during
  // the animation, naively scaling whatever's already drawn by the FULL
  // zoom ratio (e.g. 2x for one zoom level). A growing marker's true
  // target radius grows far more slowly than that (spread across many
  // zoom levels — see growValueForZoom), so left alone, that naive
  // full-ratio scaling balloons every growing marker well past its actual
  // target size mid-transition, then visibly snaps back down the instant
  // updateGrowingMarkerSizes applies the real size at zoomend.
  //
  // The fix: apply an inverse CSS scale directly on each growing marker's
  // own DOM element throughout the animation, exactly canceling Leaflet's
  // pane-level scale for that element's SIZE only. CSS transforms compose
  // multiplicatively down the DOM tree, so (pane's 2^Δzoom) × (our own
  // 1/2^Δzoom) nets out to 1 — the marker's on-screen size holds steady
  // through the transition while its position keeps panning/zooming
  // smoothly with everything else (this transform only touches scale,
  // never position). At zoomend the compensation is cleared and the real
  // target size takes over — landing at the same instant Leaflet itself
  // resets the pane transform and redraws everything crisply, so it
  // settles in unnoticed rather than as a separate, jarring correction.
  // A discrete zoom step (scroll wheel, the +/- buttons, double-click,
  // flyTo) fires 'zoomanim' exactly ONCE, up front, with the target zoom
  // — the actual visual transition from there is entirely a single CSS
  // transition on Leaflet's own map pane (class 'leaflet-zoom-anim'),
  // smoothly eased over its whole duration. A continuous gesture (touch/
  // trackpad pinch) instead fires 'zoomanim' repeatedly, once per frame,
  // each with a real intermediate zoom value, and never adds that CSS
  // class — Leaflet just snaps the pane straight to each frame's value
  // with no eased transition at all. (Leaflet's own docs: "Fired at
  // least once per zoom animation. For continuous zoom, like pinch
  // zooming, fired once per frame during zoom.")
  //
  // Our compensating transform has to match whichever of those two the
  // pane is actually doing, or it can't stay in sync: for the discrete
  // case it needs its OWN matching CSS transition (same duration/easing
  // as Leaflet's default) so it eases in step with the pane instead of
  // jumping to its final value instantly while the pane is still
  // easing into its; for the continuous case it needs to jump instantly
  // too, tracking each frame directly, or it'll lag a beat behind every
  // finger movement. leaflet-zoom-anim being present on the map pane
  // AT THE MOMENT zoomanim fires is exactly the signal for which case
  // this particular call is.
  const LEAFLET_ZOOM_TRANSITION = 'transform 0.25s cubic-bezier(0,0,0.25,1)';
  let lastSettledZoom = defaultZoom;

  // A growing marker only actually needs compensating if its TARGET size
  // can differ from its base size at all — for team-logo markers that's
  // only true on mobile (logoDiameterForZoom is a fixed constant on
  // desktop/tablet, see above). Compensating a marker whose real size
  // never changes just fights the pane's normal, correct zoom scaling for
  // no reason — visually it should scale with the map exactly like the
  // tiles do, same as any other fixed-size thing on the page.
  function markerNeedsCompensation(gm) {
    return gm.kind !== 'logo' || isMobileViewport();
  }

  // Every growing marker (dot, demolished, logo) is now the exact same
  // DOM shape: Leaflet's own divIcon wrapper <div> (positioned via a
  // translate3d Leaflet set the last time it repositioned this marker),
  // wrapping one plain inner <svg> that draws the actual visible shape.
  // That match matters: Leaflet POSITIONS the outer div, and mid zoom-
  // animation (discrete OR continuous — Leaflet fakes both by
  // transforming the whole PANE the div sits in as one rigid unit) it
  // freezes that div's translate3d and never touches it again until the
  // animation ends. An earlier version of this scaled the OUTER div
  // directly, which overwrote that translate3d outright and threw every
  // marker to the pane's origin for the whole gesture — the "way out of
  // position" bug. Scaling the INNER <svg> instead sidesteps that
  // entirely: it has no position of its own to lose (its parent div does
  // all the positioning), so `transform-origin: center` on it "just
  // works" the same reliable way it already does for the road-trip pop-in
  // animation elsewhere in this file (see .stadium-pop-svg) — no
  // cross-browser SVG fill-box gamble, no translate to preserve.
  function markerSvgEl(gm) {
    const el = gm.marker.getElement && gm.marker.getElement();
    return el ? el.querySelector('svg') : null;
  }
  // The marker's real, drawn-into-the-DOM size is whatever
  // updateGrowingMarkerSizes last set it to at lastSettledZoom — that's
  // the "base" the pane's naive scaling is working from. dotRadius/
  // logoDiameter growth is a CURVE, not a fixed value, so the CORRECT
  // apparent size at any given mid-gesture zoom is that same curve
  // evaluated at THIS frame's zoom, not just "whatever it was at the
  // start held constant." An earlier version of this did hold it
  // constant (the plain 1/2^Δzoom inverse of the pane's own scaling) —
  // that's exactly correct for a marker whose target size never changes
  // (desktop logo markers, which is why those always looked perfect), but
  // for a marker that DOES grow, holding it flat for the whole gesture
  // and then jumping to the true value only at zoomend is exactly the
  // "wrong size, then bounces to correct" you saw right as you released:
  // zooming in, it stayed at its smaller starting size the whole time,
  // then visibly grew to the correct larger size the instant zoomend
  // applied it; zooming out, the reverse. Dividing by the curve's own
  // ratio (desired ÷ base) instead of just inverting the pane's scale
  // makes the compensated size track the TRUE curve continuously through
  // the whole gesture, so it's already sitting at the exact right value
  // the moment zoomend hands off to the real update — no jump left to see.
  function sizeMetricForZoom(gm, zoom) {
    return gm.kind === 'logo' ? logoDiameterForZoom(zoom) : dotRadiusForZoom(zoom);
  }
  // What scale has Leaflet ACTUALLY put on the map pane right now, read
  // straight from the DOM rather than assumed from the math. The obvious
  // formula (2^(targetZoom - lastSettledZoom)) is correct for how the
  // pane behaves during the steady middle of a gesture, but the very last
  // 'zoomanim' call right at release — the one that matters most, since
  // it's the one still visible right as zoomend hands off to the real
  // update — is handled specially inside Leaflet's own touch/pinch code
  // (a "settle" step queued a frame ahead rather than applied inline),
  // and its actual pane scale at that instant doesn't reliably match what
  // the formula predicts. That mismatch, not the growth-curve math, is
  // what was still causing the release-moment snap: compensating against
  // an assumed pane scale that isn't quite the pane's real one leaves a
  // small residual, uncancelled scale showing through right at the
  // hand-off. Reading Leaflet's own inline style (which is exactly the
  // string L.DomUtil.setTransform just wrote — "translate3d(...) scale(N)"
  // — cheap to read, no forced layout) sidesteps the guesswork
  // entirely: whatever Leaflet actually did, that's what gets cancelled.
  function currentPaneScale() {
    const t = map._mapPane && map._mapPane.style.transform;
    const m = t && /scale\(([\d.eE+-]+)\)/.exec(t);
    return m ? parseFloat(m[1]) : 1;
  }
  function applyZoomCompensation(targetZoom) {
    const eased = !!(map._mapPane && map._mapPane.classList.contains('leaflet-zoom-anim'));
    const paneScale = currentPaneScale();
    growingMarkers.forEach(gm => {
      if (!markerNeedsCompensation(gm)) return;
      const svg = markerSvgEl(gm);
      if (!svg) return;
      const base = sizeMetricForZoom(gm, lastSettledZoom);
      const desired = sizeMetricForZoom(gm, targetZoom);
      const compensationScale = base > 0 ? (desired / base) / paneScale : 1;
      svg.style.transformOrigin = 'center';
      svg.style.transition = eased ? LEAFLET_ZOOM_TRANSITION : 'none';
      svg.style.transform = `scale(${compensationScale})`;
    });
  }
  function clearZoomCompensation() {
    growingMarkers.forEach(gm => {
      const svg = markerSvgEl(gm);
      if (svg) { svg.style.transform = ''; svg.style.transition = ''; }
    });
  }
  map.on('zoomanim', (e) => applyZoomCompensation(e.zoom));

  // --- Single info overlay ---
  // One plain positioned box (not a Leaflet tooltip/popup) always showing
  // the full info. On rollover it's shown without a close button and
  // dismissed on mouseout. On click it's "pinned" — a close button appears,
  // and it stays open through hovering elsewhere; it's dismissed only by
  // clicking the close button, clicking another stadium dot, or interacting
  // with the filters menu. Positioning never auto-pans the map on desktop/
  // tablet, and display is toggled instantly (no fade) there — phone form
  // factor is the one exception (see the phone-drawer state below and
  // showOverlay's isPhoneFormFactor branch), where tapping a marker DOES
  // pan the map on purpose. A hidden measuring box decides desktop/tablet
  // placement before the visible box is shown/moved.
  const overlayEl = document.getElementById('overlay-full');
  const measureEl = document.getElementById('overlay-measure');
  let pinnedStadiumName = null;
  // Phone form factor only: the map center from just before the pinned
  // panel first opened (see showOverlay), so dismissing it can pan back to
  // exactly where the user was, rather than leaving the view wherever the
  // marker-centering pan (also phone-only — see showOverlay) left it. Set
  // once per "session" of pinned panels — switching between markers while
  // one's already open does NOT overwrite it, so a chain of taps still
  // restores the ORIGINAL pre-tap view once everything's dismissed, not
  // just the most recently tapped marker's own start point. Null whenever
  // nothing's pinned.
  let phoneDrawerPreTapCenter = null;
  // True for the duration of any pan WE'RE driving ourselves (the phone
  // drawer's marker-centering pan, or its dismiss-time restore pan) — the
  // movestart/zoomstart listener further down normally treats any pan/zoom
  // as "the user is navigating away, close the panel," which would
  // immediately undo (or fight) our own programmatic pan the instant it
  // starts. Reset back to false once that specific pan's own moveend
  // fires.
  let suppressPinDismissOnMove = false;
  // Set around repositionPinned()'s call to showOverlay so the phone
  // drawer's slide+fade entrance (below) only ever plays on a genuine
  // fresh open/switch — repositioning an already-open drawer in place
  // (e.g. after a rotation) should just snap to its new spot, not replay
  // the "appearing" animation.
  let suppressPhoneDrawerEntrance = false;
  // The invisible corridor connecting a hovered marker to its condensed
  // preview panel — see computeHoverBridge below. Recomputed every time
  // the condensed preview is (re)shown; consulted by the pointermove
  // handler (see "Unified hover/click hit-testing") so crossing the gap
  // between marker and panel doesn't dismiss the preview before the mouse
  // actually reaches it. {left, top, right, bottom} in map-container-
  // relative pixels, or null when there's no active condensed preview.
  let hoverBridge = null;
  // Debounces mouseover/mouseout so hovering right at a marker's circular
  // edge (or the seam between two overlapping markers) doesn't rapidly
  // flicker the overlay on and off — the hide is delayed slightly and
  // cancelled if a mouseover lands anywhere before it fires.
  let hoverHideTimer = null;
  function debouncedShowOverlay(stadium, marker) {
    if (hoverHideTimer) { clearTimeout(hoverHideTimer); hoverHideTimer = null; }
    if (!pinnedStadiumName) showOverlay(stadium, marker, false);
  }
  function debouncedHideOverlay() {
    if (hoverHideTimer) clearTimeout(hoverHideTimer);
    hoverHideTimer = setTimeout(() => {
      hoverHideTimer = null;
      if (!pinnedStadiumName) { overlayEl.style.display = 'none'; hoverBridge = null; }
    }, 60);
  }

  const OV_GAP = 10;    // gap between the dot and the overlay
  const OV_INSET = 10;  // fixed offset for the size-independent below/right anchors
  const OV_MARGIN = 8;  // minimum distance kept from the window edge (mobile placement only)
  // Phone drawer only (see showOverlay/computePlacementPhoneDrawer): how
  // close the tapped marker is allowed to get to the drawer's near edge
  // before we bother panning it out of the way at all.
  const PHONE_DRAWER_CLEARANCE = 120;

  // Shrinks a single line of header text only as much as needed to keep
  // it on one line — used for BOTH the stadium name ("Great American Ball
  // Park", "Kauffman Stadium") and the team name + league/division line
  // ("Milwaukee Brewers (NL Central)"), since either one can independently
  // be too wide to fit the fixed 340px pinned card, regardless of what
  // content happens to be poured into the template. Lines that already
  // fit at full size are left alone. Only meaningful in pinned mode,
  // where the card has a fixed width; the condensed hover preview
  // auto-sizes to its content (nowrap) and never wraps in the first place.
  // Floor is deliberately low: whatever font is actually rendering
  // (Arial Narrow isn't installed everywhere — some systems fall back to
  // plain Arial, which is meaningfully wider) needs enough shrink room
  // that a long line can still reach one line rather than getting stuck
  // wrapped at a floor that was never actually low enough for it.
  function fitOneLineToWidth(lineEl, minSize) {
    if (!lineEl) return;
    lineEl.style.fontSize = ''; // reset to the CSS default before (re)measuring
    lineEl.style.letterSpacing = '';

    // Available width comes straight from the header row's own box model
    // — the row's content width minus its OTHER children (just the logo
    // chip, when present) and the flex gap — rather than reading this
    // line's own clientWidth. This line's immediate containing block
    // (.b-name-stack) is itself a flex item with min-width:0 being
    // actively shrunk to fit; toggling ITS content's white-space to
    // measure "natural" width can change what width the flex algorithm
    // assigns it in the first place, a circular measurement that turned
    // out to be unreliable for some text/size combinations (confirmed via
    // a live-browser check: available and natural came back identical
    // even though the line was visibly still wrapping). Deriving the
    // width from the row instead sidesteps that circularity entirely.
    const band = lineEl.closest('.b-name-band');
    const stack = lineEl.parentElement;
    if (!band || !stack) return;
    const bandStyle = getComputedStyle(band);
    let available = band.clientWidth - parseFloat(bandStyle.paddingLeft || 0) - parseFloat(bandStyle.paddingRight || 0);
    const gapValue = parseFloat(bandStyle.columnGap || bandStyle.gap || 0) || 0;
    let siblingCount = 0;
    Array.prototype.forEach.call(band.children, function (child) {
      if (child !== stack) { available -= child.getBoundingClientRect().width; siblingCount++; }
    });
    if (siblingCount) available -= gapValue * siblingCount;
    if (!available || available <= 0) return;

    // The line's true single-line width is measured on a fully detached,
    // off-screen clone (same classes, so it picks up the same font
    // rules) rather than by forcing white-space: nowrap on the live
    // element and reading its scrollWidth back — for the same reason as
    // above, a value read off an element inside this shrinking flex
    // layout isn't dependable. A clone appended straight to <body> has no
    // such constraint and measures cleanly.
    const clone = lineEl.cloneNode(true);
    clone.style.position = 'absolute';
    clone.style.visibility = 'hidden';
    clone.style.left = '-9999px';
    clone.style.top = '-9999px';
    clone.style.width = 'auto';
    clone.style.maxWidth = 'none';
    clone.style.whiteSpace = 'nowrap';
    clone.style.fontSize = '';
    clone.style.letterSpacing = '';
    document.body.appendChild(clone);
    const baseSize = parseFloat(getComputedStyle(clone).fontSize);
    const baseLetterSpacing = parseFloat(getComputedStyle(clone).letterSpacing) || 0;
    const natural = clone.getBoundingClientRect().width;

    if (natural <= available) { document.body.removeChild(clone); return; } // already fits at full size

    // Letter-spacing is a per-character FIXED px add-on that doesn't
    // shrink on its own just because the font-size does — for a long line
    // that's several extra px of width that would otherwise force the
    // font down further than necessary, so scale it down in step with
    // the font size too. (Any child element whose own font-size needs to
    // track this, like .b-team-leaguediv inside .b-team, is defined in em
    // rather than a fixed px, so it rides along automatically.)
    const applySize = (px) => {
      clone.style.fontSize = px + 'px';
      clone.style.letterSpacing = (baseLetterSpacing * (px / baseSize)) + 'px';
    };
    let size = Math.max(minSize, Math.floor(baseSize * (available / natural)));
    applySize(size);
    // The proportional guess above is approximate (kerning/rounding aren't
    // perfectly linear with font-size), so nudge down further if it's
    // still slightly overflowing, down to the floor.
    let guard = 30;
    while (clone.getBoundingClientRect().width > available && size > minSize && guard-- > 0) {
      size -= 1;
      applySize(size);
    }
    document.body.removeChild(clone);
    lineEl.style.fontSize = size + 'px';
    lineEl.style.letterSpacing = (baseLetterSpacing * (size / baseSize)) + 'px';
  }
  const STADIUM_NAME_MIN_SIZE = 11;
  const TEAM_LINE_MIN_SIZE = 10;
  function fitStadiumName(rootEl) {
    fitOneLineToWidth(rootEl.querySelector('.ov-pinned-header .b-name'), STADIUM_NAME_MIN_SIZE);
    fitOneLineToWidth(rootEl.querySelector('.ov-pinned-header .b-team'), TEAM_LINE_MIN_SIZE);
  }

  // The condensed hover preview and the pinned expanded card render the
  // exact same header markup (stadium.condensedHtml) but in
  // differently-constrained boxes: the preview auto-sizes to its content
  // (nowrap, so it never needs to shrink), while the pinned card is a
  // fixed 340px wide. Running fitStadiumName against each mode's own live
  // width would let a long name/team line show full-size on hover and
  // only shrink once pinned — a visible font change on click that should
  // read as a pure expansion instead. Computing the fit once, always
  // against the pinned card's fixed width (via a scratch render into
  // measureEl), and reusing that one result in both modes keeps the
  // header text pixel-identical whichever mode is on screen. Cached on
  // the stadium object since it only depends on the stadium's own name/
  // team text, never on which mode is currently showing.
  function computeHeaderFit(stadium) {
    if (stadium._headerFit) return stadium._headerFit;
    measureEl.className = ('stadium-overlay expanded ' + schemeClassFor(stadium.category)).trim();
    measureEl.style.display = 'flex';
    measureEl.innerHTML = `<div class="ov-pinned-header">${stadium.condensedHtml}</div>`;
    fitStadiumName(measureEl);
    const nameEl = measureEl.querySelector('.ov-pinned-header .b-name');
    const teamEl = measureEl.querySelector('.ov-pinned-header .b-team');
    stadium._headerFit = {
      nameFontSize: nameEl ? nameEl.style.fontSize : '',
      nameLetterSpacing: nameEl ? nameEl.style.letterSpacing : '',
      teamFontSize: teamEl ? teamEl.style.fontSize : '',
      teamLetterSpacing: teamEl ? teamEl.style.letterSpacing : ''
    };
    return stadium._headerFit;
  }

  // Applies a previously-computed header fit (see computeHeaderFit above)
  // to whichever header is actually on screen. Plain .b-name/.b-team
  // selectors (not scoped to .ov-pinned-header) since the condensed
  // preview's header isn't wrapped in that element.
  function applyHeaderFit(rootEl, fit) {
    const nameEl = rootEl.querySelector('.b-name');
    const teamEl = rootEl.querySelector('.b-team');
    if (nameEl) { nameEl.style.fontSize = fit.nameFontSize; nameEl.style.letterSpacing = fit.nameLetterSpacing; }
    if (teamEl) { teamEl.style.fontSize = fit.teamFontSize; teamEl.style.letterSpacing = fit.teamLetterSpacing; }
  }

  // Maps a stadium's category to its overlay color-scheme class (see the
  // .scheme-* CSS rules) — current_visited has no override class since it
  // IS the default scheme defined at :root. Centralized here so both
  // measureBox (sizing) and showOverlay (the real element) always agree.
  function schemeClassFor(category) {
    switch (category) {
      case 'current_not_visited': return 'scheme-current-not-visited';
      case 'former_exists':
      case 'former_demolished': return 'scheme-former-attended';
      case 'historic_not_visited':
      case 'historic_demolished': return 'scheme-former-unattended';
      case 'future_planned': return 'scheme-future';
      default: return '';
    }
  }

  function measureBox(html, pinned, stadium) {
    // Computed BEFORE measureEl is repointed at the real html below —
    // computeHeaderFit uses measureEl itself as scratch space for its own
    // pinned-width probe (cached after the first call per stadium), so it
    // has to finish before this function overwrites measureEl's content
    // with what's actually being measured here.
    const fit = computeHeaderFit(stadium);
    measureEl.className = ('stadium-overlay' + (pinned ? ' expanded' : '') + ' ' + schemeClassFor(stadium.category)).trim();
    // Must mirror whatever showOverlay() sets on the real element below —
    // .expanded is display:flex, and measuring it as display:block (this
    // element's static default) would let its flex-only sizing rules
    // (min-height:0 on the scroll wrap, in particular) silently not apply,
    // risking a measured height that doesn't match what's actually shown.
    measureEl.style.display = pinned ? 'flex' : 'block';
    measureEl.innerHTML = html;
    applyHeaderFit(measureEl, fit);
    return { w: measureEl.offsetWidth, h: measureEl.offsetHeight };
  }

  // Phone form factor's pinned/full panel: a fixed drawer, not a box
  // sized/positioned around the marker (see computePlacementSimple just
  // below, kept only as a defensive fallback — see showOverlay). Portrait
  // fills the bottom two-thirds of the screen at full width; landscape
  // fills the right HALF at full height — the marker itself gets panned
  // clear of whichever edge borders the drawer instead (see showOverlay's
  // phone branch's clearance check, which reads this same fraction so the
  // two stay in sync). Pure function of the current screen size, nothing
  // else.
  const PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION = 2 / 3;
  function computePlacementPhoneDrawer(mapSize) {
    const landscape = mapSize.x >= mapSize.y;
    if (landscape) return { left: mapSize.x / 2, top: 0, width: mapSize.x / 2, height: mapSize.y };
    const height = mapSize.y * PHONE_DRAWER_PORTRAIT_HEIGHT_FRACTION;
    return { left: 0, top: mapSize.y - height, width: mapSize.x, height };
  }

  // Mobile placement only (see computeStadiumPlacement below for desktop/
  // tablet) — mobile skips the condensed hover step entirely and taps
  // straight to the full panel. Superseded by computePlacementPhoneDrawer
  // above for the pinned case (the only case that actually reaches this
  // on a real phone — see showOverlay); kept as a defensive fallback for
  // the (currently theoretical) unpinned/condensed phone case.
  // Prefers placing the box below the dot; if it doesn't fit, to the
  // right; if that doesn't fit either, above-and-left of the dot; and as
  // an absolute last resort, centered over the dot. Always clamped to
  // stay fully inside the current window.
  function computePlacementSimple(anchor, w, h, mapSize) {
    let mode, left, top;
    if (anchor.x - OV_INSET + w + OV_MARGIN <= mapSize.x && anchor.y + OV_GAP + h + OV_MARGIN <= mapSize.y) {
      mode = 'below';
      left = anchor.x - OV_INSET;
      top = anchor.y + OV_GAP;
    } else if (anchor.x + OV_GAP + w + OV_MARGIN <= mapSize.x && anchor.y - OV_INSET + h + OV_MARGIN <= mapSize.y) {
      mode = 'right';
      left = anchor.x + OV_GAP;
      top = anchor.y - OV_INSET;
    } else if (anchor.x - OV_GAP - w >= OV_MARGIN && anchor.y - OV_GAP - h >= OV_MARGIN) {
      mode = 'above-left';
      left = anchor.x - OV_GAP - w;
      top = anchor.y - OV_GAP - h;
    } else {
      mode = 'over-dot';
      left = anchor.x - w / 2;
      top = anchor.y - h / 2;
    }
    left = Math.min(Math.max(left, OV_MARGIN), Math.max(OV_MARGIN, mapSize.x - w - OV_MARGIN));
    top = Math.min(Math.max(top, OV_MARGIN), Math.max(OV_MARGIN, mapSize.y - h - OV_MARGIN));
    return { mode, left, top };
  }
